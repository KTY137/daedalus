[package]
name = "daedalus-desktop"
version = "0.1.6"
description = "Native desktop shell for the Daedalus local-first agent operating system."
authors = ["Daedalus contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "daedalus_desktop_lib"
# This repository ships desktop targets only. The mobile static/dynamic crate
# types make `cargo test` link unused GUI plugin DLL exports on Windows GNU;
# the desktop binary consumes the Rust library as an rlib on every CI target.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "=0.2.16"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
