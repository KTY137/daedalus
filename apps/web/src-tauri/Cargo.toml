[package]
name = "daedalus-desktop"
version = "0.1.5"
description = "Native desktop shell for the Daedalus local-first agent operating system."
authors = ["Daedalus contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "daedalus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "=0.2.16"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
