name: Gate 0 — runtime trust contention fault

on:
  pull_request:
    branches:
      - g0/effect-ledger-contention-fault-linear
    paths:
      - "daedalus/kernel/effects.py"
      - "daedalus/kernel/runtime_effects.py"
      - "daedalus/runtimes/broker.py"
      - "daedalus/runtimes/trust_store.py"
      - "daedalus/runtimes/fault_matrix.py"
      - "daedalus/runtimes/host_fault_runner.py"
      - "tests/fixtures/runtime_trust_contention_fault_executor.py"
      - "tests/runtimes/test_runtime_trust_contention_fault_executor.py"
      - "tests/runtimes/test_runtime_trust_contention_fault_executor_review.py"
      - "docs/work-packets/G0-RTC-06O_RUNTIME_TRUST_CONTENTION_FAULT.md"
      - ".github/workflows/g0-runtime-trust-contention-fault.yml"
  push:
    branches:
      - g0/runtime-trust-contention-fault-linear-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-runtime-trust-contention-fault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m compileall -q daedalus tests
      - name: Verify runtime-trust contention contracts
        run: >-
          python -m pytest -q
          tests/kernel/test_effect_leases.py
          tests/kernel/test_runtime_effect_admission.py
          tests/runtimes/test_runtime_trust_store.py
          tests/runtimes/test_runtime_provider_broker.py
          tests/runtimes/test_runtime_terminal_fence.py
          tests/runtimes/test_runtime_terminal_fence_release.py
          tests/runtimes/test_runtime_trust_contention_fault_executor.py
          tests/runtimes/test_runtime_trust_contention_fault_executor_review.py
          tests/runtimes/test_linux_host_fault_runner.py
          tests/runtimes/test_linux_host_fault_runner_review.py
          tests/runtimes/test_runtime_fault_catalog.py
          tests/runtimes/test_runtime_fault_attestations.py
          tests/runtimes/test_runtime_fault_attestation_hardening.py
          tests/runtimes/test_runtime_fault_attestation_receipt.py

  retained-host-evidence:
    name: retained untrusted runtime-trust contention evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - name: Execute exact-head runtime-trust contention fault
        run: >-
          python tests/fixtures/runtime_trust_contention_fault_executor.py
          --source-revision "${GITHUB_SHA}"
          --output-dir reports/runtime-trust-contention
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: untrusted-runtime-trust-contention-${{ github.sha }}
          path: reports/runtime-trust-contention/*
          if-no-files-found: error

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  package:
    name: package / isolated wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-runtime-trust-contention-wheel
      - run: /tmp/daedalus-runtime-trust-contention-wheel/bin/pip install dist/*.whl
      - name: Import runtime broker and trust authority outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-runtime-trust-contention-wheel/bin/python -c
          "from daedalus.runtimes.broker import run_runtime_provider;
          from daedalus.runtimes.trust_store import RuntimeTrustLedger;
          assert run_runtime_provider;
          assert RuntimeTrustLedger"
