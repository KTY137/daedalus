name: Gate 0 — runtime fault catalog

on:
  pull_request:
    branches:
      - g0/runtime-terminal-fence
    paths:
      - "daedalus/runtimes/fault_matrix.py"
      - "daedalus/runtimes/faults.py"
      - "tests/runtimes/test_runtime_fault_catalog.py"
      - "tests/runtimes/test_runtime_provider_broker.py"
      - "tests/runtimes/test_runtime_terminal_fence.py"
      - "tests/runtimes/test_runtime_terminal_fence_release.py"
      - ".github/workflows/g0-runtime-fault-catalog.yml"
      - "docs/work-packets/G0-RTC-06F_RUNTIME_FAULT_CATALOG.md"
  push:
    branches:
      - g0/runtime-fault-catalog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-runtime-fault-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: catalog / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m compileall -q daedalus tests
      - run: mkdir -p reports
      - name: Verify catalog and deterministic broker scenarios
        run: >-
          python -m pytest -q
          --junitxml="reports/runtime-fault-catalog-py${{ matrix.python }}-seed${{ matrix.seed }}.xml"
          tests/runtimes/test_runtime_fault_catalog.py
          tests/runtimes/test_runtime_provider_broker.py
          tests/runtimes/test_runtime_terminal_fence.py
          tests/runtimes/test_runtime_terminal_fence_release.py
      - name: Emit deterministic required-scenario catalog
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from daedalus.runtimes.faults import RUNTIME_FAULT_CATALOG

          payload = {
              "catalog": RUNTIME_FAULT_CATALOG.to_dict(),
              "catalog_sha256": RUNTIME_FAULT_CATALOG.digest,
              "security_boundary_claimed": False,
              "execution_evidence_claimed": False,
          }
          Path("reports/runtime-fault-catalog.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: runtime-fault-catalog-py${{ matrix.python }}-seed${{ matrix.seed }}
          path: reports/*
          if-no-files-found: error

  isolated-wheel:
    name: isolated runtime-fault-catalog wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-runtime-fault-catalog-wheel
      - run: /tmp/daedalus-runtime-fault-catalog-wheel/bin/pip install dist/*.whl
      - name: Import compatibility and canonical fault modules
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-runtime-fault-catalog-wheel/bin/python -c
          "from daedalus.runtimes.faults import RUNTIME_FAULT_CATALOG as compat;
          from daedalus.runtimes.fault_matrix import RUNTIME_FAULT_CATALOG as canonical;
          assert compat is canonical;
          assert len(canonical.scenarios) == 24;
          assert len(canonical.digest) == 64"
