name: Gate 0 Repository Write Surface Inventory

on:
  pull_request:
    branches:
      - g0/gate-baseline-v2-linear
    paths:
      - "daedalus/gates/repository_write_inventory.py"
      - "scripts/report_repository_write_inventory.py"
      - "scripts/run_repository_write_inventory_mutations.py"
      - "tests/gates/test_repository_write_inventory*.py"
      - "configs/schemas/repository-write-inventory-v1.schema.json"
      - "docs/work-packets/G0-RWI-20_REPOSITORY_WRITE_SURFACE_INVENTORY.*"
      - ".github/workflows/g0-repository-write-surface-inventory.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/repository-write-surface-inventory-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-repository-write-surface-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool configs/schemas/repository-write-inventory-v1.schema.json
      - run: python -m json.tool docs/work-packets/G0-RWI-20_REPOSITORY_WRITE_SURFACE_INVENTORY.json
      - run: >-
          python -m pytest -q
          tests/gates/test_repository_write_inventory.py
          tests/gates/test_repository_write_inventory_cli.py
          tests/gates/test_repository_write_inventory_review.py
          tests/gates/test_repository_write_inventory_schema.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_repository_write_inventory_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-repository-write-inventory-wheel
      - run: /tmp/daedalus-repository-write-inventory-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-repository-write-inventory-wheel/bin/python - <<'PY'
          import tempfile
          from pathlib import Path

          from daedalus.gates.repository_write_inventory import (
              scan_repository_write_surfaces,
          )

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              package = root / "daedalus"
              package.mkdir()
              (package / "__init__.py").write_text("", encoding="utf-8")
              (package / "surface.py").write_text(
                  "open('state.json', 'w').write('{}')\n",
                  encoding="utf-8",
              )
              report = scan_repository_write_surfaces(
                  root,
                  source_revision="f" * 40,
              )
              assert report.closed is False
              assert report.to_dict()["primary_checkout_target_proven"] is False
          PY
