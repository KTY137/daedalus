name: Gate 0 Repository HEAD Receipt Integration

on:
  pull_request:
    branches:
      - g0/provider-target-receipt-retention-inventory-refresh-linear
    paths:
      - "daedalus/gates/repository_head_revision.py"
      - "configs/schemas/repository-head-revision-receipt.schema.json"
      - "tests/gates/test_repository_head_revision*.py"
      - "scripts/run_repository_head_revision_mutations.py"
      - "docs/work-packets/G0-RTC-07I_REPOSITORY_HEAD_RECEIPT_INTEGRATION.*"
      - ".github/workflows/g0-repository-head-receipt-integration.yml"
  push:
    branches:
      - g0/provider-target-receipt-retention-head-receipt-integration-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-repository-head-receipt-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest jsonschema
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-RTC-07I_REPOSITORY_HEAD_RECEIPT_INTEGRATION.json
      - run: python -m json.tool configs/schemas/repository-head-revision-receipt.schema.json
      - run: >-
          python -m pytest -q
          tests/gates/test_repository_head_revision.py
          tests/gates/test_repository_head_revision_wire.py
          tests/gates/test_repository_head_revision_review.py
          tests/gates/test_repository_head_revision_schema.py
          tests/gates/test_repository_head_revision_integration_review.py
          tests/gates/test_repository_tree.py
          tests/gates/test_repository_tree_review.py

  predecessor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest jsonschema
      - run: >-
          python -m pytest -q
          tests/runtimes/test_provider_target_receipt_ledger.py
          tests/runtimes/test_provider_target_receipt_ledger_hardening.py
          tests/runtimes/test_provider_target_receipt_ledger_review.py
          tests/runtimes/test_provider_target_receipt_retention_contract.py
          tests/runtimes/test_provider_target_receipt_retention_contract_review.py
          tests/gates/test_provider_target_receipt_retention_inventory.py
          tests/gates/test_provider_target_receipt_retention_inventory_review.py
          tests/gates/test_provider_target_receipt_retention_inventory_refresh_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_repository_head_revision_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest jsonschema
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-repository-head-integration-wheel
      - run: /tmp/daedalus-repository-head-integration-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-repository-head-integration-wheel/bin/python - <<'PY'
          from daedalus.gates.repository_head_revision import (
              RepositoryHeadRevisionReceipt,
              verify_repository_head_revision,
              verify_repository_head_revision_receipt,
          )

          assert RepositoryHeadRevisionReceipt is not None
          assert callable(verify_repository_head_revision)
          assert callable(verify_repository_head_revision_receipt)
          PY
