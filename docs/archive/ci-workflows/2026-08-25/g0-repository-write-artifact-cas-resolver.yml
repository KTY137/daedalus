name: Gate 0 Repository Write Artifact CAS Resolution

on:
  pull_request:
    branches:
      - g0/repository-write-artifact-verifier-linear
  push:
    branches:
      - g0/repository-write-artifact-cas-resolver-linear
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-GR-23_REPOSITORY_WRITE_ARTIFACT_CAS_RESOLUTION.json
      - run: python -m json.tool configs/schemas/repository-write-artifact-resolution-receipt-v1.schema.json
      - run: >-
          python -m pytest -q
          tests/gates/test_repository_write_artifact_cas.py
          tests/gates/test_repository_write_artifact_cas_adversarial.py
          tests/gates/test_repository_write_artifact_cas_receipt.py
          tests/gates/test_repository_write_artifact_cas_review.py
          tests/gates/test_repository_write_artifact_cas_schema.py
          tests/gates/test_repository_write_artifact_cas_toctou.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_repository_write_artifact_cas_mutations.py

  predecessor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: >-
          python -m pytest -q
          tests/gates/test_repository_write_artifact_verifier.py
          tests/gates/test_repository_write_artifact_verifier_canonical_bytes.py
          tests/gates/test_repository_write_artifact_verifier_malformed.py
          tests/gates/test_repository_write_artifact_verifier_review.py
          tests/gates/test_repository_write_artifact_verifier_schema.py
          tests/gates/test_repository_write_artifact_verifier_types.py
          tests/gates/test_repository_write_evidence.py
          tests/gates/test_repository_write_evidence_review.py
          tests/gates/test_repository_write_evidence_schema.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-artifact-cas-wheel
      - run: /tmp/daedalus-artifact-cas-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-artifact-cas-wheel/bin/python - <<'PY'
          from daedalus.gates.repository_write_artifact_cas import (
              RepositoryWriteArtifactCASRoot,
              RepositoryWriteArtifactResolutionReceipt,
              ResolvedRepositoryWriteArtifact,
              artifact_relative_path,
              resolve_repository_write_artifact,
          )
          assert RepositoryWriteArtifactCASRoot is not None
          assert RepositoryWriteArtifactResolutionReceipt is not None
          assert ResolvedRepositoryWriteArtifact is not None
          assert callable(artifact_relative_path)
          assert callable(resolve_repository_write_artifact)
          PY
