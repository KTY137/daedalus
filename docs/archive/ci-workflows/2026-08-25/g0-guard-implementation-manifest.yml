name: Gate 0 Guard Implementation Manifest

on:
  pull_request:
    branches:
      - g0/repository-write-source-anchor-semantics-linear
    paths:
      - "daedalus/gates/guard_implementation_manifest.py"
      - "tests/gates/test_guard_implementation_manifest*.py"
      - "scripts/run_guard_implementation_manifest_mutations.py"
      - "configs/schemas/guard-implementation-manifest-report.schema.json"
      - "docs/work-packets/G0-RWI-20G_GUARD_IMPLEMENTATION_MANIFEST.*"
      - ".github/workflows/g0-guard-implementation-manifest.yml"
  push:
    branches:
      - g0/repository-write-guard-manifest-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-guard-implementation-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool configs/schemas/guard-implementation-manifest-report.schema.json
      - run: python -m json.tool docs/work-packets/G0-RWI-20G_GUARD_IMPLEMENTATION_MANIFEST.json
      - run: >-
          python -m pytest -q
          tests/gates/test_guard_implementation_manifest.py
          tests/gates/test_guard_implementation_manifest_review.py
          tests/gates/test_repository_write_source_anchor_semantics.py
          tests/gates/test_repository_write_source_anchor_semantics_review.py
          tests/gates/test_repository_write_evidence_origin.py
          tests/gates/test_repository_write_evidence_origin_review.py
          tests/gates/test_repository_write_evidence_materialization.py
          tests/gates/test_repository_write_evidence_materialization_review.py
          tests/gates/test_repository_write_classification.py
          tests/gates/test_repository_write_classification_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_guard_implementation_manifest_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-guard-manifest-wheel
      - run: /tmp/daedalus-guard-manifest-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-guard-manifest-wheel/bin/python - <<'PY'
          from daedalus.gates.guard_implementation_manifest import (
              GuardImplementationManifest,
              GuardImplementationManifestBindingError,
              GuardImplementationManifestError,
              GuardImplementationManifestReport,
              GuardImplementationManifestSignatureError,
              GuardImplementationRecord,
              issue_guard_implementation_manifest,
              parse_guard_implementation_manifest,
              verify_guard_implementation_manifest,
          )

          assert issubclass(
              GuardImplementationManifestBindingError,
              GuardImplementationManifestError,
          )
          assert issubclass(
              GuardImplementationManifestSignatureError,
              GuardImplementationManifestError,
          )
          assert GuardImplementationManifest.__dataclass_fields__
          assert GuardImplementationManifestReport.__dataclass_fields__
          assert GuardImplementationRecord.__dataclass_fields__
          assert callable(issue_guard_implementation_manifest)
          assert callable(parse_guard_implementation_manifest)
          assert callable(verify_guard_implementation_manifest)
          PY
