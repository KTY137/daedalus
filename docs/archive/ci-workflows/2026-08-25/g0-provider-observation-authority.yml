name: Gate 0 Provider Observation Authority

on:
  pull_request:
    branches:
      - g0/runtime-post-provider-unknown-linear
    paths:
      - "daedalus/runtimes/broker.py"
      - "daedalus/runtimes/provider_observation.py"
      - "daedalus/runtimes/recovery.py"
      - "tests/runtimes/test_provider_observation_authority*.py"
      - "tests/runtimes/test_runtime_provider_post_invoke_unknown.py"
      - "tests/runtimes/test_runtime_provider_recovery.py"
      - "scripts/run_provider_observation_authority_mutations.py"
      - "docs/work-packets/G0-RTC-06R_PROVIDER_OBSERVATION_AUTHORITY.*"
      - ".github/workflows/g0-provider-observation-authority.yml"
  push:
    branches:
      - g0/provider-observation-authority-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-observation-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-RTC-06R_PROVIDER_OBSERVATION_AUTHORITY.json
      - run: >-
          python -m pytest -q
          tests/runtimes/test_provider_observation_authority.py
          tests/runtimes/test_provider_observation_authority_review.py
          tests/runtimes/test_runtime_provider_broker.py
          tests/runtimes/test_runtime_provider_post_invoke_unknown.py
          tests/runtimes/test_runtime_provider_post_invoke_unknown_review.py
          tests/runtimes/test_runtime_provider_recovery.py
          tests/runtimes/test_runtime_provider_recovery_review.py
          tests/kernel/test_effect_recovery.py
          tests/kernel/test_effect_recovery_hardening.py
          tests/kernel/test_runtime_effect_replay_projection.py
          tests/kernel/test_runtime_effect_replay_projection_review.py
          tests/runtimes/test_unknown_outcome_reconciliation_fault_executor.py
          tests/runtimes/test_unknown_outcome_reconciliation_fault_executor_review.py
          tests/runtimes/test_runtime_trust_contention_fault_executor.py
          tests/runtimes/test_runtime_trust_contention_fault_executor_review.py
          tests/test_runtime_profiles.py
          tests/test_runtime_trust_store.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_provider_observation_authority_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-provider-observation-wheel
      - run: /tmp/daedalus-provider-observation-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-provider-observation-wheel/bin/python - <<'PY'
          from daedalus.runtimes.broker import run_runtime_provider
          from daedalus.runtimes.provider_observation import (
              ProviderObservationAuthority,
              ProviderObservationBindingLedger,
              issue_provider_observation_authority,
          )
          from daedalus.runtimes.recovery import reconcile_runtime_provider_unknown

          assert callable(run_runtime_provider)
          assert callable(issue_provider_observation_authority)
          assert callable(reconcile_runtime_provider_unknown)
          assert ProviderObservationAuthority is not None
          assert ProviderObservationBindingLedger is not None
          PY
