name: Gate 0 Report Writer Inventory Binding

on:
  pull_request:
    branches:
      - g0/event-store-writer-inventory-linear
    paths:
      - "daedalus/gates/report.py"
      - "configs/schemas/gate-report-v2.schema.json"
      - "tests/gates/test_gate_report.py"
      - "tests/gates/test_gate_report_writer_inventory_review.py"
      - "tests/gates/test_gate_report_v2_schema.py"
      - "scripts/run_gate_report_writer_inventory_mutations.py"
      - "docs/work-packets/G0-GR-18_GATE_REPORT_WRITER_INVENTORY.md"
      - "docs/work-packets/G0-GR-18_GATE_REPORT_WRITER_INVENTORY.json"
      - ".github/workflows/g0-gate-report-writer-inventory.yml"
  push:
    branches:
      - g0/gate-report-writer-inventory-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-gate-report-writer-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-report:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts tools
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool configs/schemas/gate-report-v2.schema.json
      - run: python -m json.tool docs/work-packets/G0-GR-18_GATE_REPORT_WRITER_INVENTORY.json
      - run: >-
          python -m pytest -q
          tests/gates/test_gate_report.py
          tests/gates/test_gate_report_writer_inventory_review.py
          tests/gates/test_gate_report_v2_schema.py
          tests/test_spine_writer_inventory.py
          tests/test_spine_writer_inventory_review.py
          tests/test_spine_writer_inventory_cli.py
          tests/test_spine_writer_inventory_schema.py
          tests/test_spine_gate0_writer_factory.py
          tests/test_spine_gate0_writer_factory_review.py
          tests/test_spine_gate0_durability.py
          tests/test_spine_gate0_durability_review.py
      - name: Produce exact-head Gate report v2
        run: >-
          python -m daedalus.gates report
          --gate 0
          --repo-root .
          --source-revision "${{ github.sha }}"
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.seed == '0' }}
        run: python scripts/run_gate_report_writer_inventory_mutations.py
      - run: python -m pytest -q

  report-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - shell: bash
        run: |
          set -euo pipefail
          python -m daedalus.gates report \
            --gate 0 \
            --repo-root . \
            --source-revision "${GITHUB_SHA}" \
            > gate0-report-v2.json
          python -m json.tool gate0-report-v2.json >/dev/null
          python tools/assert_gate_report.py --report gate0-report-v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate0-report-v2-${{ github.sha }}
          path: gate0-report-v2.json
          if-no-files-found: error

  isolated-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-gate-report-v2-wheel
      - run: /tmp/daedalus-gate-report-v2-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-gate-report-v2-wheel/bin/python - <<'PY'
          from daedalus.gates.report import GateReport

          report = GateReport(
              gate=0,
              source_revision="a" * 40,
              registry_sha256="b" * 64,
              security_boundary_claimed=False,
              event_store_writer_inventory_sha256="c" * 64,
          )
          assert report.to_dict()["schema"] == "daedalus-gate-report/2"
          PY
