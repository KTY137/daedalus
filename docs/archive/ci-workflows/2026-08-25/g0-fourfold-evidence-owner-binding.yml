name: Gate 0 — Fourfold evidence owner binding

on:
  pull_request:
    branches:
      - g0/non-runtime-authorization-port-linear
    paths:
      - "daedalus/kernel/fourfold_evidence.py"
      - "tests/kernel/test_fourfold_evidence_owner_binding.py"
      - "tests/kernel/test_fourfold_evidence_adversarial.py"
      - "tests/kernel/test_fourfold_evidence_source_review.py"
      - "scripts/run_fourfold_evidence_binding_mutations.py"
      - "docs/work-packets/G0-EVD-10_FOURFOLD_OWNER_BINDING.md"
      - ".github/workflows/g0-fourfold-evidence-owner-binding.yml"
  push:
    branches:
      - g0/fourfold-evidence-owner-binding-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-fourfold-evidence-owner-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Fourfold evidence / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m compileall -q daedalus tests scripts
      - name: Focused canonical, malformed, stale and bypass tests
        run: >-
          python -m pytest -q
          tests/twin/test_wiki_reference.py
          tests/kernel/test_owner_approval.py
          tests/kernel/test_fourfold_evidence_owner_binding.py
          tests/kernel/test_fourfold_evidence_adversarial.py
          tests/kernel/test_fourfold_evidence_source_review.py
      - name: Bounded mutation campaign
        run: python scripts/run_fourfold_evidence_binding_mutations.py

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    name: isolated wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-fourfold-evidence-wheel
      - run: /tmp/daedalus-fourfold-evidence-wheel/bin/pip install dist/*.whl
      - name: Import installed bridge outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-fourfold-evidence-wheel/bin/python -c
          "from daedalus.kernel.fourfold_evidence import
          assemble_fourfold_evidence_packet, assemble_fourfold_nomination_receipt;
          assert assemble_fourfold_evidence_packet and assemble_fourfold_nomination_receipt"
