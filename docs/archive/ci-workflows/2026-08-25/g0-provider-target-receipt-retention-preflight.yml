name: Gate 0 Provider Target Receipt Retention Preflight

on:
  pull_request:
    branches:
      - g0/provider-target-receipt-retention-head-receipt-integration-linear
    paths:
      - "daedalus/runtimes/provider_target_receipt_retention_preflight.py"
      - "configs/schemas/provider-target-receipt-retention-preflight.schema.json"
      - "tests/runtimes/test_provider_target_receipt_retention_preflight*.py"
      - "scripts/run_provider_target_receipt_retention_preflight_mutations.py"
      - "docs/work-packets/G0-RTC-07J_PROVIDER_TARGET_RECEIPT_RETENTION_PREFLIGHT.*"
      - ".github/workflows/g0-provider-target-receipt-retention-preflight.yml"
  push:
    branches:
      - g0/provider-target-receipt-retention-preflight-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-target-receipt-retention-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest jsonschema
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-RTC-07J_PROVIDER_TARGET_RECEIPT_RETENTION_PREFLIGHT.json
      - run: python -m json.tool configs/schemas/provider-target-receipt-retention-preflight.schema.json
      - run: >-
          python -m pytest -q
          tests/runtimes/test_provider_target_receipt_retention_preflight.py
          tests/runtimes/test_provider_target_receipt_retention_preflight_review.py
          tests/runtimes/test_provider_target_receipt_retention_preflight_schema.py

  predecessor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest jsonschema
      - run: >-
          python -m pytest -q
          tests/gates/test_repository_head_revision.py
          tests/gates/test_repository_head_revision_wire.py
          tests/gates/test_repository_head_revision_review.py
          tests/gates/test_repository_head_revision_schema.py
          tests/gates/test_provider_target_receipt_retention_inventory.py
          tests/gates/test_provider_target_receipt_retention_inventory_review.py
          tests/gates/test_provider_target_receipt_retention_inventory_refresh_review.py
          tests/runtimes/test_provider_target_receipt_retention_contract.py
          tests/runtimes/test_provider_target_receipt_retention_contract_review.py
          tests/runtimes/test_provider_target_receipt_ledger.py
          tests/runtimes/test_provider_target_receipt_ledger_hardening.py
          tests/runtimes/test_provider_target_receipt_ledger_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_provider_target_receipt_retention_preflight_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest jsonschema
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-retention-preflight-wheel
      - run: /tmp/daedalus-retention-preflight-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-retention-preflight-wheel/bin/python - <<'PY'
          from daedalus.runtimes.provider_target_receipt_retention_preflight import (
              ProviderTargetReceiptRetentionPreflightReceipt,
              verify_provider_target_receipt_retention_preflight,
          )

          assert ProviderTargetReceiptRetentionPreflightReceipt is not None
          assert callable(verify_provider_target_receipt_retention_preflight)
          PY
