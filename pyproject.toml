[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
version = "0.1.0"
description = "Portable local+cloud multi-agent routing harness (Adam senior crew + Ikarus local bench)."
readme = "README.md"
requires-python = ">=3.10"
# Core is ZERO runtime dependencies -- Python stdlib only. The real
# dependencies are external tools (Ollama, the claude CLI), installed by
# bootstrap.ps1 / bootstrap.sh.
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]   # enables YAML config verification in the verifier gate
math = ["numpy", "scipy", "networkx"] # optional structural graph analysis
polyglot = [
    "tree-sitter==0.26.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-cpp==0.23.4",
]
root = ["uproot==5.7.5"]
# Optional graph engine for composing a run brief (daedalus/langgraph_adapter.py).
# NOT a runtime dependency of anything: `create_run` defaults to engine="stdlib",
# nothing under daedalus/ imports langgraph at module scope, and the adapter is
# one file to delete. Pulls langchain-core and langsmith transitively -- the
# adapter pins langsmith tracing off explicitly rather than trusting that no
# environment variable on the machine turns it on.
orchestration = ["langgraph>=1.2,<2"]
# Test-time only: nothing under daedalus/ imports either of these, only tests/.
# The core stays zero-dependency; this extra is what `python -m pytest tests/`
# (the runner README.md documents) actually needs.
#   pytest      -- required by 298 of 529 test files (MEASURED 2026-08-25,
#                  `grep -rl "import pytest" --include="test_*.py" tests | wc -l`
#                  against `find tests -name "test_*.py" | wc -l`). It was
#                  undeclared until then, so a fresh checkout whose venv
#                  installed only the declared extras could not run 56% of the
#                  suite -- including the Gate-0 fault, containment, promotion
#                  and killswitch tests -- and got a module-not-found error
#                  rather than a red test.
#                  Note the recursion: the first count of this was `tests/test_*.py`,
#                  which sees only the top level and reported 116 of 254. Both
#                  halves of a ratio need the same, windowless instrument.
#   jsonschema  -- required by 7 files in tests/ that validate the Gate-0
#                  contract schemas (fault matrix, repository write
#                  classification, provider target receipt retention). Also
#                  undeclared until 2026-08-25, and the reason those 7 were the
#                  only collection errors left after pytest was declared:
#                  `pytest tests/ --collect-only` reported exactly 7 errors,
#                  one per file. Nothing under daedalus/ imports it.
#   pytest-asyncio -- the 10 `@pytest.mark.asyncio` tests in test_adapters.py
#                  and test_kairos_evolution.py. Without it pytest collects
#                  them and then fails them with "async def functions are not
#                  natively supported" -- loudly, at least, but their bodies
#                  had never run. With it: 16 passed (MEASURED 2026-08-25).
#   hypothesis  -- property-based tests (docs/ABSORPTION.md D1). MPL-2.0 -- see
#                  ABSORPTION.md D1 bar 3 for why that licence attaches to
#                  nothing here (imported, never modified/redistributed).
test = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4.23", "hypothesis>=6.163"]

[project.scripts]
daedalus = "daedalus.cli:main"

[tool.setuptools.packages.find]
include = ["daedalus*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
"daedalus.kairos" = ["_gated_writes_legacy.py.src"]
