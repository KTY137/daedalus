[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
version = "0.1.0"
description = "Portable local+cloud multi-agent routing harness (Adam senior crew + Ikarus local bench)."
readme = "README.md"
requires-python = ">=3.10"
# Core is ZERO runtime dependencies -- Python stdlib only. The real
# dependencies are external tools (Ollama, the claude CLI), installed by
# bootstrap.ps1 / bootstrap.sh.
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]   # enables YAML config verification in the verifier gate
math = ["numpy", "scipy", "networkx"] # optional structural graph analysis

[project.scripts]
daedalus = "daedalus.cli:main"

[tool.setuptools]
# Installed editable (`pip install -e .`) so agents/, projects/, and local
# state stay next to the code and travel with the repo.
#
# This list is EXPLICIT, which disables auto-discovery -- so any package
# missing here is simply absent from a built wheel. `structcore` (the whole
# structural engine) and `eval` were both missing, meaning a non-editable
# `pip install .` shipped a package with no engine. The bug was invisible
# locally because every install here is editable.
packages = [
    "daedalus",
    "daedalus.adapters",
    "daedalus.memory",
    "daedalus.kairos",
    "daedalus.providers",
    "daedalus.structcore",
    "daedalus.eval",
    "daedalus.spine",
    "daedalus.council",
    "daedalus.mapping",
]
