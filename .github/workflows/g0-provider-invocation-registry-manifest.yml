name: Gate 0 Provider Invocation Registry Manifest

on:
  pull_request:
    branches:
      - g0/provider-invocation-observation-authority-linear
  push:
    branches:
      - g0/provider-invocation-registry-manifest-linear
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool docs/work-packets/G0-RTC-06X_PROVIDER_INVOCATION_REGISTRY_MANIFEST.json
      - run: python -m pytest -q tests/runtimes/test_provider_invocation_registry.py tests/runtimes/test_provider_invocation_registry_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_provider_invocation_registry_mutations.py

  predecessor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/runtimes/test_provider_invocation_subject.py tests/runtimes/test_provider_invocation_subject_review.py tests/runtimes/test_provider_invocation_authority.py tests/runtimes/test_provider_invocation_authority_review.py tests/runtimes/test_provider_observation_authority.py tests/runtimes/test_provider_observation_authority_review.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-invocation-registry-wheel
      - run: /tmp/daedalus-invocation-registry-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-invocation-registry-wheel/bin/python - <<'PY'
          from daedalus.runtimes.provider.invocation_registry import (
              ProviderAdapterDescriptor,
              ProviderInvocationRegistryManifest,
              build_provider_invocation_registry_manifest,
          )
          assert ProviderAdapterDescriptor is not None
          assert ProviderInvocationRegistryManifest is not None
          assert callable(build_provider_invocation_registry_manifest)
          PY
