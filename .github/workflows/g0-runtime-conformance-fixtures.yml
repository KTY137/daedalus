# Exact-head CI evidence for G0-RTC-06A.
name: Gate 0 — offline runtime conformance profiles

on:
  pull_request:
    branches:
      - g0/effect-entrypoint-centralization
    paths:
      - "configs/runtimes/**"
      - "daedalus/runtimes/**"
      - "daedalus/kernel/runtime_conformance.py"
      - "daedalus/schemas.py"
      - "tests/fixtures/runtime_probe_fixture.py"
      - "tests/runtimes/**"
      - ".github/workflows/g0-runtime-conformance-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    name: offline-contract / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q daedalus tests
      - name: Runtime identity, authority, stale, and process-tree tests
        run: >-
          python -m pytest -q
          tests/kernel/test_runtime_conformance_harness.py
          tests/runtimes/test_runtime_conformance_profiles.py
          tests/runtimes/test_runtime_profile_adversarial.py
          tests/runtimes/test_runtime_live_trust_anchor.py
          tests/test_effect_boundary.py

  isolated-wheel:
    name: isolated wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-wheel
      - run: /tmp/daedalus-wheel/bin/pip install dist/*.whl
      - name: Import installed runtime contracts outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-wheel/bin/python -c
          "from daedalus.runtimes import
          RuntimeConformanceEnvelope, RuntimeProbeIdentity, RuntimeProfile,
          verify_production_runtime_envelope;
          assert RuntimeConformanceEnvelope.CONTRACT_TYPE ==
          'daedalus.runtime-conformance-envelope'"
