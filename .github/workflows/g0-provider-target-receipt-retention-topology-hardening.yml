name: Gate 0 Provider Target Receipt Retention Topology Hardening

on:
  pull_request:
    branches:
      - g0/provider-target-receipt-retention-contract-linear
    paths:
      - "daedalus/runtimes/provider/target_receipt_ledger.py"
      - "scripts/run_provider_target_receipt_retention_mutations.py"
      - "tests/runtimes/test_provider_target_receipt_ledger*.py"
      - "docs/work-packets/G0-RTC-07G_PROVIDER_TARGET_RECEIPT_RETENTION_TOPOLOGY_HARDENING.*"
      - ".github/workflows/g0-provider-target-receipt-retention-topology-hardening.yml"
  push:
    branches:
      - g0/provider-target-receipt-retention-topology-hardening-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-target-receipt-retention-topology-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool docs/work-packets/G0-RTC-07G_PROVIDER_TARGET_RECEIPT_RETENTION_TOPOLOGY_HARDENING.json
      - run: >-
          python -m pytest -q
          tests/runtimes/test_provider_target_receipt_ledger.py
          tests/runtimes/test_provider_target_receipt_ledger_hardening.py
          tests/runtimes/test_provider_target_receipt_ledger_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_provider_target_receipt_retention_mutations.py

  predecessor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: >-
          python -m pytest -q
          tests/gates/test_provider_target_receipt_retention_inventory.py
          tests/gates/test_provider_target_receipt_retention_inventory_review.py
          tests/runtimes/test_provider_target_receipt_retention_contract.py
          tests/runtimes/test_provider_target_receipt_retention_contract_review.py
          tests/runtimes/test_provider_target_receipt_ledger.py
          tests/runtimes/test_provider_target_receipt_ledger_hardening.py
          tests/runtimes/test_provider_target_receipt_ledger_review.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - working-directory: /tmp
        run: >-
          python -c "from daedalus.runtimes.provider.target_receipt_ledger import ProviderTargetReceiptLedger; assert ProviderTargetReceiptLedger is not None"

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-retention-topology-wheel
      - run: /tmp/daedalus-retention-topology-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-retention-topology-wheel/bin/python - <<'PY'
          from daedalus.runtimes.provider.target_receipt_ledger import (
              ProviderTargetReceiptLedger,
              ProviderTargetReceiptRetentionBindingError,
          )

          assert ProviderTargetReceiptLedger is not None
          assert issubclass(ProviderTargetReceiptRetentionBindingError, RuntimeError)
          PY
