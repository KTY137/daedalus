name: Gate 0 Fourfold Evidence Binding

on:
  pull_request:
    branches:
      - g0/effect-leases
    paths:
      - "daedalus/kernel/fourfold_evidence.py"
      - "daedalus/kernel/__init__.py"
      - "tests/kernel/test_fourfold_evidence.py"
      - "tests/kernel/test_fourfold_approval_integration.py"
      - "tests/kernel/test_owner_approval.py"
      - "tests/twin/**"
      - "examples/fourfold_wiki_app/**"
      - "docs/work-packets/G0-RCP-04A_FOURFOLD_EVIDENCE_BINDING.md"
      - ".github/workflows/gate0-fourfold-evidence.yml"
  push:
    branches:
      - g0/fourfold-evidence-binding
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate0-fourfold-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: >-
          python -m pytest -q
          tests/kernel/test_fourfold_evidence.py
          tests/kernel/test_fourfold_approval_integration.py
          tests/kernel/test_owner_approval.py
          tests/twin/test_wiki_reference.py
          tests/twin/test_reference_hardening.py

  isolated-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-wheel
      - run: /tmp/daedalus-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        run: >-
          /tmp/daedalus-wheel/bin/python -c
          "from daedalus.kernel import assemble_fourfold_evidence_packet;
          from daedalus.twin import compile_reference_project"
