name: Gate 0 Live Promotion Receipts

on:
  pull_request:
    branches:
      - g0/promotion-receipt-ledger-linear
    paths:
      - "daedalus/kairos/gated_writes.py"
      - "tests/kernel/test_live_promotion_seam.py"
      - "tests/kernel/test_live_promotion_seam_review.py"
      - "tests/kernel/test_live_promotion_receipts.py"
      - "tests/kernel/test_primary_checkout_fingerprint.py"
      - "scripts/run_live_promotion_receipt_mutations.py"
      - "docs/work-packets/G0-PRM-12D_LIVE_PROMOTION_RECEIPTS.md"
      - ".github/workflows/g0-live-promotion-receipts.yml"
  push:
    branches:
      - g0/live-promotion-receipts-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-live-promotion-receipts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: >-
          python -m pytest -q
          tests/kernel/test_live_promotion_seam.py
          tests/kernel/test_live_promotion_seam_review.py
          tests/kernel/test_live_promotion_receipts.py
          tests/kernel/test_primary_checkout_fingerprint.py
          tests/kernel/test_live_promotion_legacy_retirement.py
          tests/kernel/test_persisted_promotion_authorization.py
          tests/kernel/test_persisted_promotion_authorization_review.py
          tests/kernel/test_promotion_receipts.py
          tests/kernel/test_promotion_receipts_review.py
          tests/kernel/test_sealed_promotion.py
          tests/kernel/test_owner_approval.py
          tests/kernel/test_approval_consumption_review.py
          tests/kernel/test_fourfold_approval_integration.py
          tests/kernel/test_fourfold_evidence_owner_binding.py
          tests/kernel/test_effect_leases.py
          tests/kernel/test_effect_leases_adversarial.py
          tests/gates/test_gate_report.py
          tests/test_effect_boundary.py
          tests/test_kernel_contracts.py
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.seed == '0' }}
        run: python scripts/run_live_promotion_receipt_mutations.py
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-live-promotion-receipt-wheel
      - run: /tmp/daedalus-live-promotion-receipt-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-live-promotion-receipt-wheel/bin/python - <<'PY'
          import inspect
          from daedalus.kairos import gated_writes
          from daedalus.kernel import PromotionLedger

          signature = inspect.signature(gated_writes.promote_candidates)
          assert "promotion_ledger" in signature.parameters
          assert signature.parameters["promotion_ledger"].default is None
          assert PromotionLedger.__module__ == "daedalus.kernel.promotion_receipts"
          PY
