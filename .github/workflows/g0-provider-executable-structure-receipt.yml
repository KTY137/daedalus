name: Gate 0 Provider Executable Structure Receipt

on:
  pull_request:
    branches:
      - g0/provider-executable-target-manifest-linear
    paths:
      - "daedalus/runtimes/provider_executable_structure.py"
      - "configs/schemas/provider-executable-structure-receipt.schema.json"
      - "tests/runtimes/test_provider_executable_structure*.py"
      - "scripts/run_provider_executable_structure_mutations.py"
      - "docs/work-packets/G0-RTC-07C_PROVIDER_EXECUTABLE_STRUCTURE_RECEIPT.*"
      - ".github/workflows/g0-provider-executable-structure-receipt.yml"
  push:
    branches:
      - g0/provider-executable-structure-receipt-r2-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-executable-structure-receipt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-RTC-07C_PROVIDER_EXECUTABLE_STRUCTURE_RECEIPT.json
      - run: python -m json.tool configs/schemas/provider-executable-structure-receipt.schema.json
      - run: >-
          python -m pytest -q
          tests/runtimes/test_provider_executable_structure.py
          tests/runtimes/test_provider_executable_structure_review.py
          tests/runtimes/test_provider_executable_structure_schema.py
          tests/runtimes/test_provider_executable_targets.py
          tests/runtimes/test_provider_executable_targets_review.py
          tests/gates/test_python_target_structure.py
          tests/gates/test_python_target_structure_review.py
          tests/gates/test_repository_tree.py
          tests/gates/test_repository_tree_review.py
          tests/runtimes/test_provider_invocation_identity.py
          tests/runtimes/test_runtime_provider_broker.py
          tests/runtimes/test_runtime_provider_exact_authority_boundary.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_provider_executable_structure_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-provider-structure-wheel
      - run: /tmp/daedalus-provider-structure-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-provider-structure-wheel/bin/python - <<'PY'
          from daedalus.runtimes.provider_executable_structure import (
              ProviderExecutableStructureReceipt,
              VerifiedProviderExecutableTarget,
              verify_provider_executable_structure,
              verify_provider_executable_structure_receipt,
          )

          assert ProviderExecutableStructureReceipt is not None
          assert VerifiedProviderExecutableTarget is not None
          assert callable(verify_provider_executable_structure)
          assert callable(verify_provider_executable_structure_receipt)
          PY
