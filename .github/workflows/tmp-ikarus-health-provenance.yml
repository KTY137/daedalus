name: Temporary Ikarus health provenance cut

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - .github/workflows/tmp-ikarus-health-provenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical provider-health projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path("daedalus/core.py")
          core = core_path.read_text(encoding="utf-8")
          old = '''def provider_health(project: str | None = None) -> dict[str, Any]:
              rows = _provider_health()
              warnings = []
              if not any(row["name"] == "ollama" and row["available"] for row in rows):
                  warnings.append("Ollama is not fully available; local bench work may fail.")
              if not any(row["name"] == "claude_cli" and row["available"] for row in rows):
                  warnings.append("Claude CLI is not on PATH; Claude lane may be unavailable.")
              return envelope(project, providers=rows, warnings=warnings)
          '''
          new = '''def provider_health(project: str | None = None) -> dict[str, Any]:
              rows = _provider_health()
              warnings = []
              if not any(row["name"] == "ollama" and row["available"] for row in rows):
                  warnings.append("Ollama is not fully available; local bench work may fail.")

              claude_row = next((row for row in rows if row.get("name") == "claude_cli"), None)
              if not claude_row or not bool(claude_row.get("available")):
                  detail = str((claude_row or {}).get("last_error") or "").strip()
                  if detail:
                      warnings.append(f"Claude lane unavailable: {detail}")
                  else:
                      warnings.append(
                          "Claude lane is unavailable; canonical provider readiness could not be proven."
                      )
              return envelope(project, providers=rows, warnings=warnings)
          '''
          if core.count(old) != 1:
              raise SystemExit("provider_health source block drifted; refusing blind patch")
          core_path.write_text(core.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_runtime_registry_claude_shim.py")
          tests = test_path.read_text(encoding="utf-8")
          old_imports = "import daedalus.providers as providers\nimport daedalus.runtime_registry as registry\n"
          new_imports = "import daedalus.core as core\nimport daedalus.providers as providers\nimport daedalus.runtime_registry as registry\n"
          if tests.count(old_imports) != 1:
              raise SystemExit("Claude shim test imports drifted; refusing blind patch")
          tests = tests.replace(old_imports, new_imports, 1)
          regression = '''

          def test_core_provider_health_surfaces_canonical_claude_dispatch_refusal(monkeypatch) -> None:
              refusal = (
                  "Claude CLI is installed, but canonical dispatch is not activated "
                  "(provider.claude wiring=inventory_only)"
              )
              rows = [
                  {"name": "ollama", "available": True, "last_error": ""},
                  {"name": "claude_cli", "available": False, "last_error": refusal},
              ]
              monkeypatch.setattr(core, "_provider_health", lambda: rows)

              payload = core.provider_health("daedalus")

              assert payload["providers"] == rows
              assert payload["warnings"] == [f"Claude lane unavailable: {refusal}"]
              assert all("not on PATH" not in warning for warning in payload["warnings"])
          '''
          regression = regression.replace("\n          ", "\n")
          if "test_core_provider_health_surfaces_canonical_claude_dispatch_refusal" in tests:
              raise SystemExit("Claude health provenance regression already exists")
          test_path.write_text(tests.rstrip() + regression + "\n", encoding="utf-8")
          PY
      - name: Verify focused readiness regression
        shell: bash
        run: |
          python -m pip install -q -e . pytest
          python -m py_compile daedalus/core.py tests/test_runtime_registry_claude_shim.py
          python -m pytest -q tests/test_runtime_registry_claude_shim.py
      - name: Commit product cut and remove helper
        shell: bash
        run: |
          rm .github/workflows/tmp-ikarus-health-provenance.yml
          git config user.name "KTY"
          git config user.email "kaya.yesilyurt@tu-dortmund.de"
          git add daedalus/core.py tests/test_runtime_registry_claude_shim.py .github/workflows/tmp-ikarus-health-provenance.yml
          git commit -m "fix(ikarus): surface canonical Claude readiness in health"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
