name: Apply Gate 0 final patch

on:
  pull_request:
    branches:
      - g0/fourfold-evidence-binding
    paths:
      - ".daedalus-bootstrap/g0-final.patch"
      - ".github/workflows/apply-g0-final-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'g0/sealed-promotion-runtime-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify, apply, and remove bootstrap patch
        shell: bash
        run: |
          set -euo pipefail
          echo "ea5481baac6ebece360c88f2c50f1ef3ca7c6db1ebf5a6db58c6437d3034444d  .daedalus-bootstrap/g0-final.patch" | sha256sum -c -
          git apply --check .daedalus-bootstrap/g0-final.patch
          git apply .daedalus-bootstrap/g0-final.patch
          rm -rf .daedalus-bootstrap
          rm -f .github/workflows/apply-g0-final-patch.yml
          git config user.name "daedalus-gate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(g0): seal promotion and register owner guard"
          git push origin HEAD:g0/sealed-promotion-runtime-sandbox
