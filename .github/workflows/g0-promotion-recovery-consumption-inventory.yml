name: Gate 0 Promotion Recovery Consumption Inventory

on:
  pull_request:
    branches:
      - g0/promotion-recovery-consumption-linear
    paths:
      - "daedalus/spine/promotion_recovery_consumption_inventory.py"
      - "tests/test_promotion_recovery_consumption_inventory*.py"
      - "scripts/run_promotion_recovery_consumption_inventory_mutations.py"
      - "docs/work-packets/G0-PRM-25M_PROMOTION_RECOVERY_CONSUMPTION_INVENTORY.*"
      - ".github/workflows/g0-promotion-recovery-consumption-inventory.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-recovery-consumption-inventory-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-promotion-recovery-consumption-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-PRM-25M_PROMOTION_RECOVERY_CONSUMPTION_INVENTORY.json
      - run: >-
          python -m pytest -q
          tests/test_promotion_recovery_consumption_inventory.py
          tests/test_promotion_recovery_consumption_inventory_review.py
          tests/kernel/test_promotion_recovery_consumption.py
          tests/kernel/test_promotion_recovery_consumption_concurrency.py
          tests/kernel/test_promotion_recovery_consumption_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_promotion_recovery_consumption_inventory_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-promotion-recovery-consumption-inventory-wheel
      - run: /tmp/daedalus-promotion-recovery-consumption-inventory-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-promotion-recovery-consumption-inventory-wheel/bin/python - <<'PY'
          from daedalus.spine.promotion_recovery_consumption_inventory import (
              INVENTORY_DELTA,
              recognizes_recovery_consumption_method,
          )

          assert INVENTORY_DELTA.closed is False
          assert INVENTORY_DELTA.canonical_registry_integrated is False
          assert recognizes_recovery_consumption_method(
              "daedalus.kernel.promotion_recovery_consumption",
              "PromotionRecoveryConsumptionLedger",
              "consume",
          )
          PY
