name: Gate 0 — runtime fault attestations

on:
  pull_request:
    branches:
      - g0/runtime-fault-catalog
    paths:
      - "daedalus/runtimes/fault_attestations.py"
      - "daedalus/runtimes/fault_matrix.py"
      - "daedalus/runtimes/faults.py"
      - "tests/runtimes/test_runtime_fault_attestations.py"
      - "tests/runtimes/test_runtime_fault_attestation_hardening.py"
      - "tests/runtimes/test_runtime_fault_catalog.py"
      - ".github/workflows/g0-runtime-fault-attestations.yml"
      - "docs/work-packets/G0-RTC-06G_RUNTIME_FAULT_ATTESTATIONS.md"
  push:
    branches:
      - g0/runtime-fault-attestations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-runtime-fault-attestations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attestations:
    name: attestations / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m compileall -q daedalus tests
      - name: Verify fault-attestation and catalog contracts
        run: >-
          python -m pytest -q
          tests/runtimes/test_runtime_fault_attestations.py
          tests/runtimes/test_runtime_fault_attestation_hardening.py
          tests/runtimes/test_runtime_fault_catalog.py

  isolated-wheel:
    name: isolated runtime-fault-attestation wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-runtime-fault-attestation-wheel
      - run: /tmp/daedalus-runtime-fault-attestation-wheel/bin/pip install dist/*.whl
      - name: Import packaged trust boundary
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-runtime-fault-attestation-wheel/bin/python -c
          "from daedalus.runtimes.fault_attestations import RuntimeFaultAttestation, verify_attested_runtime_fault_matrix;
          from daedalus.runtimes.faults import RUNTIME_FAULT_CATALOG;
          assert RuntimeFaultAttestation and verify_attested_runtime_fault_matrix;
          assert len(RUNTIME_FAULT_CATALOG.scenarios) == 24"
