name: Gate 0 — authenticated release assessment

on:
  pull_request:
    branches:
      - g0/evidence-trust-bundle-linear
    paths:
      - "daedalus/gates/**"
      - "configs/schemas/gate0-release-receipt-v1.schema.json"
      - "tests/gates/**"
      - "docs/work-packets/G0-RPT-08C_AUTHENTICATED_RELEASE_ASSESSMENT.md"
      - ".github/workflows/g0-release-assessment.yml"
  push:
    branches:
      - g0/release-assessment-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-release-assessment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: release assessment / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m json.tool configs/schemas/gate0-release-receipt-v1.schema.json
      - run: python -m compileall -q daedalus tests
      - name: Exact, stale, malformed, bypass and counter-review tests
        run: >-
          python -m pytest -q
          tests/gates/test_gate_report.py
          tests/gates/test_exact_head_evidence.py
          tests/gates/test_exact_head_evidence_strict.py
          tests/gates/test_exact_head_evidence_io.py
          tests/gates/test_evidence_trust_bundle.py
          tests/gates/test_evidence_trust_bundle_review.py
          tests/gates/test_gate0_release_assessment.py
          tests/gates/test_gate0_release_assessment_review.py

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  isolated-wheel:
    name: isolated wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-release-wheel
      - run: /tmp/daedalus-release-wheel/bin/pip install dist/*.whl
      - name: Import installed release contracts outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-release-wheel/bin/python -c
          "from daedalus.gates import Gate0ReleaseReceipt,
          issue_gate0_release_receipt,
          load_strict_gate_report,
          verify_gate0_release_receipt;
          assert Gate0ReleaseReceipt.CONTRACT_TYPE ==
          'daedalus-gate0-release-receipt/1';
          assert issue_gate0_release_receipt;
          assert load_strict_gate_report;
          assert verify_gate0_release_receipt"
