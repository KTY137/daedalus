name: Gate 0 Promotion Effect Lifecycle

on:
  pull_request:
    branches:
      - g0/promotion-terminalization-linear
    paths:
      - "daedalus/kairos/promotion_effect_lifecycle.py"
      - "tests/kernel/test_promotion_effect_lifecycle*.py"
      - "scripts/run_promotion_effect_lifecycle_mutations.py"
      - "docs/work-packets/G0-PRM-25H_PROMOTION_EFFECT_LIFECYCLE.*"
      - ".github/workflows/g0-promotion-effect-lifecycle.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-effect-lifecycle-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-promotion-effect-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-PRM-25H_PROMOTION_EFFECT_LIFECYCLE.json
      - run: >-
          python -m pytest -q
          tests/kernel/test_promotion_effect_capability.py
          tests/kernel/test_promotion_effect_replay.py
          tests/kernel/test_promotion_replay_projection.py
          tests/kernel/test_promotion_reconciliation.py
          tests/kernel/test_promotion_terminalization.py
          tests/kernel/test_promotion_effect_lifecycle.py
          tests/kernel/test_promotion_effect_lifecycle_fault_windows.py
          tests/kernel/test_promotion_effect_lifecycle_adversarial.py
          tests/kernel/test_promotion_effect_lifecycle_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_promotion_effect_lifecycle_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-promotion-effect-lifecycle-wheel
      - run: /tmp/daedalus-promotion-effect-lifecycle-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-promotion-effect-lifecycle-wheel/bin/python - <<'PY'
          from daedalus.kairos.promotion_effect_lifecycle import (
              PromotionEffectLifecycleError,
              promote_candidates_with_effect_lifecycle,
          )

          assert promote_candidates_with_effect_lifecycle.__module__ == "daedalus.kairos.promotion_effect_lifecycle"
          assert PromotionEffectLifecycleError.__module__ == "daedalus.kairos.promotion_effect_lifecycle"
          PY
