name: Temporary Ikarus terminal evidence patch

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - .github/workflows/tmp-ikarus-terminal-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch terminal execution projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge = Path('daedalus/file_bridge.py')
          text = bridge.read_text(encoding='utf-8')
          old = (
              '        # Execution attribution is copied only from the terminal report\n'
              '        # itself. Request/chat metadata must never be promoted into an\n'
              '        # agent identity because routing may change after enqueue.\n'
              '        "agent": payload.get("agent") or "",\n'
              '        "summary": " ".join(str(summary).split())[:160],  # one line for the console\n'
          )
          new = (
              '        # Execution attribution is copied only from the terminal report\n'
              '        # itself. Request/chat metadata must never be promoted into an\n'
              '        # execution identity because routing may change after enqueue.\n'
              '        "agent": payload.get("agent") or "",\n'
              '        "runtime_id": payload.get("runtime_id") or "",\n'
              '        "work_item_id": payload.get("work_item_id") or "",\n'
              '        "attempt_id": payload.get("attempt_id") or "",\n'
              '        "phase": payload.get("phase") or "",\n'
              '        "terminal_receipt_sha256": payload.get("terminal_receipt_sha256") or "",\n'
              '        "summary": " ".join(str(summary).split())[:160],  # one line for the console\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one report projection seam, found {text.count(old)}')
          bridge.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Verify focused bridge projection
        run: |
          python -m py_compile daedalus/file_bridge.py tests/test_bridge_report_execution_evidence.py
          python -m pytest -q tests/test_bridge_report_execution_evidence.py tests/test_bridge_signals.py
      - name: Commit bounded product delta and retire helper
        shell: bash
        run: |
          git rm .github/workflows/tmp-ikarus-terminal-evidence.yml
          git add daedalus/file_bridge.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(web): carry terminal execution identity through bridge'
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
