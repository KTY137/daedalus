name: Gate 2 Corpus Pilot

on:
  pull_request:
    branches:
      - consolidation/g0-g1-foundation
    paths:
      - "daedalus/kernel/contracts.py"
      - "daedalus/twin/ablations.py"
      - "daedalus/twin/corpus.py"
      - "daedalus/twin/capabilities.py"
      - "daedalus/twin/corpus_genesis.py"
      - "daedalus/twin/corpus_review.py"
      - "daedalus/twin/gate2_report.py"
      - "daedalus/twin/gate2_closure.py"
      - "daedalus/twin/genesis.py"
      - "daedalus/twin/motifs.py"
      - "configs/corpus/gate2-pilot-v1.json"
      - "configs/schemas/owner-approval-v1.schema.json"
      - "tests/kernel/test_owner_approval.py"
      - "tests/twin/test_capability_matrix.py"
      - "tests/twin/test_corpus_genesis_binding.py"
      - "tests/twin/test_corpus_manifest.py"
      - "tests/twin/test_corpus_review.py"
      - "tests/twin/test_four_plane_ablations.py"
      - "tests/twin/test_gate2_closure.py"
      - "tests/twin/test_gate2_report.py"
      - "tests/twin/test_motif_provenance.py"
      - ".github/workflows/gate2-corpus-pilot.yml"
      - "pyproject.toml"
  push:
    branches:
      - g2/project-twin-genesis-final
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate2-corpus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        hash-seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.hash-seed }}
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: >-
          python -m pytest -q
          tests/kernel/test_owner_approval.py
          tests/twin/test_corpus_manifest.py
          tests/twin/test_capability_matrix.py
          tests/twin/test_corpus_genesis_binding.py
          tests/twin/test_corpus_review.py
          tests/twin/test_four_plane_ablations.py
          tests/twin/test_gate2_report.py
          tests/twin/test_gate2_closure.py
          tests/twin/test_motif_provenance.py
          tests/twin/test_genesis_contracts.py
      - run: >-
          python -m compileall -q
          daedalus/kernel/contracts.py
          daedalus/twin/ablations.py
          daedalus/twin/corpus.py
          daedalus/twin/capabilities.py
          daedalus/twin/corpus_genesis.py
          daedalus/twin/corpus_review.py
          daedalus/twin/gate2_report.py
          daedalus/twin/gate2_closure.py
          daedalus/twin/genesis.py
          daedalus/twin/motifs.py
          tests/kernel/test_owner_approval.py
          tests/twin/test_corpus_manifest.py
          tests/twin/test_capability_matrix.py
          tests/twin/test_corpus_genesis_binding.py
          tests/twin/test_corpus_review.py
          tests/twin/test_four_plane_ablations.py
          tests/twin/test_gate2_report.py
          tests/twin/test_gate2_closure.py
          tests/twin/test_motif_provenance.py

  pinned-repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Git revisions and declared license paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/corpus.tsv
          import json
          from pathlib import Path
          payload = json.loads(Path("configs/corpus/gate2-pilot-v1.json").read_text())
          for repo in payload["repositories"]:
              fields = [repo["repository_id"], repo["repository_url"], repo["source_revision"], repo["license_path"], " ".join(repo["include_prefixes"])]
              if any("\t" in field or "\n" in field for field in fields):
                  raise SystemExit("manifest field contains shell record delimiter")
              print("\t".join(fields))
          PY
          while IFS=$'\t' read -r repository_id repository_url revision license_path prefixes; do
            checkout="external/${repository_id}"
            git clone --filter=blob:none --no-checkout "${repository_url}" "${checkout}"
            git -C "${checkout}" sparse-checkout init --cone
            read -r -a prefix_array <<< "${prefixes}"
            git -C "${checkout}" sparse-checkout set "${prefix_array[@]}"
            git -C "${checkout}" fetch --depth=1 origin "${revision}"
            git -C "${checkout}" checkout --detach "${revision}"
            test "$(git -C "${checkout}" rev-parse HEAD)" = "${revision}"
            test -f "${checkout}/${license_path}"
          done < /tmp/corpus.tsv

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel --sdist
      - name: Install and import wheel outside checkout
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python -m pip install --target "${tmpdir}" dist/*.whl
          cd /tmp
          PYTHONPATH="${tmpdir}" python -c "from daedalus.kernel.contracts import OwnerApproval; from daedalus.twin.ablations import FourPlaneAblationReport; from daedalus.twin.corpus_review import CorpusReviewRecord; from daedalus.twin.gate2_report import Gate2Report; from daedalus.twin.gate2_closure import Gate2ClosureApproval; from daedalus.twin.motifs import MotifProvenance; print(OwnerApproval.__name__, FourPlaneAblationReport.__name__, CorpusReviewRecord.__name__, Gate2Report.__name__, Gate2ClosureApproval.__name__, MotifProvenance.__name__)"
      - name: Install and import sdist outside checkout
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python -m pip install --target "${tmpdir}" dist/*.tar.gz
          cd /tmp
          PYTHONPATH="${tmpdir}" python -c "from daedalus.twin.corpus_review import apply_reviewed_record; from daedalus.twin.gate2_closure import Gate2ClosureLedger; print(apply_reviewed_record.__name__, Gate2ClosureLedger.__name__)"
