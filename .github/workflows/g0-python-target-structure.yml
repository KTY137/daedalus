name: Gate 0 Python Target Structure

on:
  pull_request:
    branches:
      - g0/repository-tree-reader-linear
    paths:
      - "daedalus/gates/python_target_structure.py"
      - "tests/gates/test_python_target_structure*.py"
      - "scripts/run_python_target_structure_mutations.py"
      - "docs/work-packets/G0-RWI-20I_PYTHON_TARGET_STRUCTURE.*"
      - ".github/workflows/g0-python-target-structure.yml"
  push:
    branches:
      - g0/python-target-structure-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-python-target-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool docs/work-packets/G0-RWI-20I_PYTHON_TARGET_STRUCTURE.json
      - run: >-
          python -m pytest -q
          tests/gates/test_python_target_structure.py
          tests/gates/test_python_target_structure_review.py
          tests/gates/test_repository_tree.py
          tests/gates/test_repository_tree_review.py
          tests/gates/test_guard_implementation_manifest.py
          tests/gates/test_guard_implementation_manifest_review.py
          tests/gates/test_repository_write_source_anchor_semantics.py
          tests/gates/test_repository_write_source_anchor_semantics_review.py
          tests/gates/test_repository_write_evidence_origin.py
          tests/gates/test_repository_write_evidence_origin_review.py
          tests/gates/test_repository_write_evidence_materialization.py
          tests/gates/test_repository_write_evidence_materialization_review.py
          tests/gates/test_repository_write_classification.py
          tests/gates/test_repository_write_classification_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_python_target_structure_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-python-target-wheel
      - run: /tmp/daedalus-python-target-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-python-target-wheel/bin/python - <<'PY'
          from daedalus.gates.python_target_structure import (
              PythonTargetBindingError,
              PythonTargetSourceError,
              PythonTargetStructure,
              PythonTargetStructureError,
              module_repository_path,
              parse_python_target,
              resolve_python_target_structure,
          )

          assert issubclass(PythonTargetBindingError, PythonTargetStructureError)
          assert issubclass(PythonTargetSourceError, PythonTargetStructureError)
          assert PythonTargetStructure.__dataclass_fields__
          assert callable(module_repository_path)
          assert callable(parse_python_target)
          assert callable(resolve_python_target_structure)
          PY
