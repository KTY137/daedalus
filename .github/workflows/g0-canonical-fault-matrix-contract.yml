name: G0 Canonical Fault Matrix Contract

on:
  pull_request:
    branches:
      - g0/provider-target-receipt-retention-admission-linear
    paths:
      - daedalus/gates/fault_matrix.py
      - configs/gates/g0-provider-target-receipt-retention-fault-matrix.json
      - configs/schemas/fault-matrix-contract.schema.json
      - tests/gates/test_fault_matrix_contract.py
      - tests/gates/test_fault_matrix_contract_schema.py
      - tests/gates/test_fault_matrix_contract_review.py
      - scripts/run_fault_matrix_contract_exact_mutations.py
      - docs/work-packets/G0-FLT-07A_CANONICAL_FAULT_MATRIX_CONTRACT.*
      - .github/workflows/g0-canonical-fault-matrix-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-fault-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  focused:
    name: focused-${{ matrix.os }}-py${{ matrix.python }}-seed${{ matrix.hashseed }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        hashseed: ["0", "777"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Compile package and tests
        run: python -m compileall -q daedalus tests/gates scripts/run_fault_matrix_contract_exact_mutations.py
      - name: Validate machine contract and adversarial behavior
        run: >-
          python -m pytest -q
          tests/gates/test_fault_matrix_contract.py
          tests/gates/test_fault_matrix_contract_schema.py
          tests/gates/test_fault_matrix_contract_review.py

  mutation:
    name: bounded-mutation-campaign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mutation dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Kill exact contract bypasses
        run: python scripts/run_fault_matrix_contract_exact_mutations.py

  predecessor-regression:
    name: predecessor-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install regression dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Gate and receipt-retention regressions
        run: >-
          python -m pytest -q
          tests/gates
          tests/runtimes/test_provider_target_receipt_retention_preflight.py
          tests/runtimes/test_provider_target_receipt_retention_admission.py
          tests/runtimes/test_provider_target_receipt_retention_admission_review.py

  full-suite:
    name: full-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Run full suite
        run: python -m pytest -q

  packaging:
    name: package-and-isolated-import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Install wheel in isolated environment
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --upgrade pip
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "from daedalus.gates.fault_matrix import FaultMatrixManifest, verify_fault_matrix_run; print(FaultMatrixManifest.__name__, verify_fault_matrix_run.__name__)"
