name: Ikarus Delivery Acceptance

on:
  push:
    branches: [g1/ikarus-runtime-invocation-binding-07d3]
    paths:
      - '.github/workflows/ikarus-delivery-acceptance.yml'
      - 'daedalus/**'
      - 'tests/**'
      - 'apps/web/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ikarus-delivery-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-inputs:
    name: Exact integration input, no runner state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/ikarus-review"
          mkdir -p "$destination"
          git rev-parse HEAD HEAD^{tree} > "$destination/revision.txt"
          git diff --stat df761b7e0e463f1d056f6f5ff3deecc7f3cee5e3 HEAD > "$destination/change-stat.txt"
          # Incremental Git objects only. The two prerequisites are already
          # retained in the original review bundle; no checkout/config/secrets.
          git bundle create "$destination/review.bundle" HEAD ^70ec314cd55603653c1a23fd888d6995cac3aada ^217d5edc2b5e59441051b9cb0df60a5fbca93fe2
          git bundle verify "$destination/review.bundle"
          sha256sum "$destination/review.bundle" > "$destination/review.bundle.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ikarus-review-${{ github.sha }}
          path: ${{ runner.temp }}/ikarus-review/
          retention-days: 7
          if-no-files-found: error

  runtime-regressions:
    name: Ikarus caller integration (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" tzdata
      - name: Verify production callers and persisted broker evidence
        run: >-
          python -m pytest -q -p no:cacheprovider
          --junitxml=delivery-regressions.xml
          tests/test_ikarus_runtime_events.py
          tests/test_ikarus_runtime_replay.py
          tests/test_ikarus_act.py
          tests/test_ikarus_act_literal_intent.py
          tests/test_ikarus_act_literal_dispatch.py
          tests/test_ikarus_shells.py
          tests/test_ikarus_stream.py
          tests/test_ikarus_supervisor.py
          tests/test_ikarus_supervisor_attempt_identity.py
          tests/test_ikarus_claude_composition.py
          tests/test_ikarus_claude_task_attempt_authority.py
          tests/test_ikarus_claude_task_attempt_runner.py
          tests/test_ikarus_claude_attempt_handoff.py
          tests/providers/test_claude_ikarus_result_binding.py
          tests/runtimes/test_runtime_terminal_fence.py
          tests/runtimes/test_runtime_terminal_fence_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ikarus-delivery-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: delivery-regressions.xml
          retention-days: 7
          if-no-files-found: warn

  web-build:
    name: Typed production web build and pure application contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:app
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ikarus-web-candidate-${{ github.sha }}
          path: apps/web/dist/
          retention-days: 7
          if-no-files-found: error
# The existing unified-runtime workflow separately runs all browser contracts
# on native Windows, with its owned server, teardown and explicit failure modes.
