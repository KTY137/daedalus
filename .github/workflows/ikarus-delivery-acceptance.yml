name: Ikarus Delivery Acceptance

on:
  push:
    branches: [g1/ikarus-runtime-invocation-binding-07d3]
    paths:
      - '.github/workflows/ikarus-delivery-acceptance.yml'
      - 'daedalus/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ikarus-delivery-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-inputs:
    name: Exact source and non-mutating merge diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact Git input for reproducible offline review
        env:
          MAIN_REVISION: 217d5edc2b5e59441051b9cb0df60a5fbca93fe2
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/ikarus-integration-inputs"
          mkdir -p "$destination"
          git cat-file -e "$MAIN_REVISION^{commit}"
          git rev-parse HEAD > "$destination/branch-revision.txt"
          printf '%s\n' "$MAIN_REVISION" > "$destination/main-revision.txt"
          git ls-tree -r HEAD > "$destination/branch-tree.txt"
          git ls-tree -r "$MAIN_REVISION" > "$destination/main-tree.txt"
          git diff --name-status "$MAIN_REVISION"...HEAD > "$destination/branch-changes.txt"
          # Only Git objects/refs from this public repository, never checkout
          # configuration, runner environment, credentials or untracked files.
          git bundle create "$destination/review.bundle" HEAD refs/remotes/origin/main
          git bundle verify "$destination/review.bundle"
          set +e
          git merge-tree --write-tree HEAD "$MAIN_REVISION" > "$destination/merge-diagnosis.txt" 2>&1
          merge_status=$?
          set -e
          printf '%s\n' "$merge_status" > "$destination/merge-exit-code.txt"
          sha256sum "$destination/review.bundle" > "$destination/review.bundle.sha256"
          # A retained diagnosis is not a successful integration. The separate
          # acceptance jobs, not this transport job, decide test results.
          test "$merge_status" -le 1
      - uses: actions/upload-artifact@v4
        with:
          name: ikarus-integration-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/ikarus-integration-inputs/
          retention-days: 7
          if-no-files-found: error

  runtime-regressions:
    name: Full-checkout runtime regressions (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - name: Test the installed package with the repository conftest
        run: >-
          python -m pytest -q -p no:cacheprovider
          --junitxml=delivery-regressions.xml
          tests/test_ikarus_runtime_events.py
          tests/test_ikarus_act.py
          tests/test_ikarus_act_literal_intent.py
          tests/test_ikarus_act_literal_dispatch.py
          tests/test_ikarus_shells.py
          tests/test_ikarus_stream.py
          tests/test_ikarus_supervisor.py
          tests/test_ikarus_supervisor_attempt_identity.py
          tests/test_ikarus_claude_composition.py
          tests/test_ikarus_claude_task_attempt_runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ikarus-delivery-regressions-${{ matrix.python }}-${{ github.sha }}
          path: delivery-regressions.xml
          retention-days: 7
          if-no-files-found: warn
