name: Gate 0 Promotion Effect Inventory

on:
  pull_request:
    branches:
      - g0/promotion-manager-audit-linear
    paths:
      - "daedalus/kernel/promotion_effect_inventory.py"
      - "daedalus/kernel/promotion_execution.py"
      - "daedalus/kairos/gated_writes.py"
      - "daedalus/spine/effect_boundary.py"
      - "tests/kernel/test_promotion_effect_inventory.py"
      - "scripts/run_promotion_effect_inventory_mutations.py"
      - "docs/work-packets/G0-PRM-23_PROMOTION_EFFECT_INVENTORY.*"
      - ".github/workflows/g0-promotion-effect-inventory.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-effect-inventory-linear
    paths:
      - "daedalus/kernel/promotion_effect_inventory.py"
      - "daedalus/kernel/promotion_execution.py"
      - "daedalus/kairos/gated_writes.py"
      - "daedalus/spine/effect_boundary.py"
      - "tests/kernel/test_promotion_effect_inventory.py"
      - "scripts/run_promotion_effect_inventory_mutations.py"
      - "docs/work-packets/G0-PRM-23_PROMOTION_EFFECT_INVENTORY.*"
      - ".github/workflows/g0-promotion-effect-inventory.yml"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: promotion-effect-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        hashseed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m pytest -q tests/kernel/test_promotion_effect_inventory.py
      - name: Assert current inventory remains honestly open
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set +e
          python -m daedalus.kernel.promotion_effect_inventory . \
            --source-revision "${GITHUB_SHA}" \
            --require-closed > promotion-effect-inventory.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("promotion-effect-inventory.json").read_text())
          assert payload["closed"] is False
          assert len(payload["findings"]) == 3
          PY

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_promotion_effect_inventory_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv wheel-venv
      - run: wheel-venv/bin/python -m pip install dist/*.whl
      - run: >-
          wheel-venv/bin/python -c
          "from daedalus.kernel.promotion_effect_inventory import build_promotion_effect_inventory; print(build_promotion_effect_inventory)"
