name: Automation workspace export

on:
  pull_request:
    branches:
      - g0/effect-leases
  push:
    branches:
      - automation/g0-workspace-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$(git rev-parse HEAD)" > CHECKOUT_HEAD
          tar --exclude=.git --exclude=daedalus-checkout.tar.gz -czf daedalus-checkout.tar.gz .
          test -s daedalus-checkout.tar.gz
          sha256sum daedalus-checkout.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-checkout-${{ github.sha }}
          path: daedalus-checkout.tar.gz
          if-no-files-found: error
          retention-days: 2
