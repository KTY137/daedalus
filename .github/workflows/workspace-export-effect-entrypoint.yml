name: Apply effect-entrypoint centralization batch

on:
  workflow_dispatch:
  push:
    branches: [g0/effect-entrypoint-centralization]
    paths: [.github/workflows/workspace-export-effect-entrypoint.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g0/effect-entrypoint-centralization
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/effect.patch
          patch -p1 < /tmp/effect.patch
          echo '' | base64 -d | gzip -d > .github/workflows/gate0-promotion-effect-lease.yml
          rm .github/workflows/workspace-export-effect-entrypoint.yml
      - name: Verify focused batch
        run: |
          python -m pip install -e . pytest
          python tools/iron_plan_guard.py verify
          python -m pytest -q tests/kernel/test_sealed_promotion.py tests/kernel/test_effect_leases.py tests/test_effect_boundary.py
          python -m compileall -q daedalus
      - name: Commit batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daedalus-gate-bot'
          git config user.email 'daedalus-gate-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat(g0): lease sealed promotion effects'
          git push origin HEAD:g0/effect-entrypoint-centralization
