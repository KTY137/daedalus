name: Apply G0 effect entrypoint work packet

on:
  pull_request:
    branches:
      - consolidation/g0-g1-foundation

permissions:
  contents: write

concurrency:
  group: g0-effect-entrypoint-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: g0/effect-entrypoint-centralization
      - name: Verify and apply reviewed work packet
        shell: bash
        run: |
          set -euo pipefail
          cd .github/work-packets/g0-effect-entrypoint
          sha256sum -c <<'EOF'
          802d9bc300ebaa1a83ab1f6db7091c7e700c975729749dae75bccc9339534cfb  part-00
          9de9b38761a355c428df8520d38cc507eb5d7cf575e7d9fca1dbdc65547eb909  part-01
          552ba35712d4274f07aebaacc9f791109f063a3ae86db582d5d647308be79765  part-02
          71c941a92abdb7a7997cdb740cdb5b749535fa588fb1da8f44a2826b41430a95  part-03
          d1bdbb93924aaef138ddd1bff91c192fa28e8159ba7dbcc16af2d87373beba39  part-04
          2bc63ec9c372152f32761c246be0f5b4f62f2bd0e08dd5ef8b7e4a6ae7a962a4  part-05
          8e1cfd785674a8b2db725b0653778106d1db44d0d75dad5297d3fe5bc88b9861  part-06
          44e1d56fb94693db31edb342c9b42de2367aef23db4a84af926fe77be0089383  part-07
          f4cbdfc8ff93a95aae8503946ac07d60df9150910b05571177af4e3eff8a166b  part-08
          EOF
          cat part-* > /tmp/full-effect.patch
          echo '69a55fa1184e1abb96a9d2f86480a8095e630a95a311343ca9b315125fef4baf  /tmp/full-effect.patch' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          sed -n '/^diff --git a\/daedalus\/kernel\/__init__\.py/,$p' /tmp/full-effect.patch > /tmp/code.patch
          git apply --check /tmp/code.patch
          git apply /tmp/code.patch
          rm -rf .github/work-packets/g0-effect-entrypoint
          rm -f .github/workflows/workspace-export-effect-entrypoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(g0): centralize python offload behind persisted effect leases'
          git push origin HEAD:g0/effect-entrypoint-centralization
