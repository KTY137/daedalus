name: Gate 0 Kernel Storage

on:
  pull_request:
    branches:
      - g0/effect-leases
    paths:
      - "daedalus/kernel/storage.py"
      - "daedalus/kernel/__init__.py"
      - "tests/kernel/test_storage.py"
      - "tests/kernel/test_storage_adversarial.py"
      - "docs/work-packets/G0-WP-04_KERNEL_STORAGE.md"
      - ".github/workflows/gate0-kernel-storage.yml"
  push:
    branches:
      - g0/kernel-storage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate0-kernel-storage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: focused-${{ matrix.os }}-py${{ matrix.python }}-seed${{ matrix.seed }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: >-
          python -m pytest -q
          tests/kernel/test_storage.py
          tests/kernel/test_storage_adversarial.py
          tests/kernel/test_owner_approval.py
          tests/kernel/test_effect_leases.py
          tests/kernel/test_effect_leases_adversarial.py
          tests/gates/test_gate_report.py
          tests/test_kernel_contracts.py
          tests/test_effect_boundary.py
          tests/test_gate0_faults_atalanta.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-storage-wheel
      - run: /tmp/daedalus-storage-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        run: >-
          /tmp/daedalus-storage-wheel/bin/python -c
          "from daedalus.kernel import ContentAddressedStore, EventStore,
          ZERO_EVENT_SHA256; assert len(ZERO_EVENT_SHA256) == 64"
