# Exact-head evidence for Tier-2 evaluator integrity (#252 / #253 / #268).
# The broader eval corpus has a separate non-hermetic sunny_garden defect (#261),
# so this gate intentionally runs the changed Tier-2 surface plus its historical
# no-provider compatibility test instead of laundering that fixture failure.
name: Gate 1 — Tier-2 eval integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "daedalus/eval/**"
      - "tests/test_eval.py"
      - "tests/test_eval_tier2_integrity.py"
      - "tests/test_eval_tier2_text_evidence_nemesis.py"
      - ".github/workflows/g1-tier2-eval-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier2-integrity:
    name: tier2-integrity / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Compile evaluator surface
        run: >-
          python -m py_compile
          daedalus/eval/__init__.py
          daedalus/eval/_text_integrity.py
          daedalus/eval/harness.py
          daedalus/eval/report.py
          daedalus/eval/tasks.py
          daedalus/eval/tier2.py
          tests/test_eval.py
          tests/test_eval_tier2_integrity.py
          tests/test_eval_tier2_text_evidence_nemesis.py
      - name: Adversarial Tier-2 integrity regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q
          tests/test_eval_tier2_integrity.py
          tests/test_eval_tier2_text_evidence_nemesis.py
          tests/test_eval.py::EvalTier1Test::test_tier2_skips_cleanly_without_provider
