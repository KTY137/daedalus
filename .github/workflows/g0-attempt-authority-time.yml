name: Gate 0 Attempt Authority Time

on:
  pull_request:
    branches:
      - g0/attempt-workspace-topology-linear
    paths:
      - "daedalus/kernel/attempt_contracts.py"
      - "daedalus/kernel/attempt_ledger.py"
      - "daedalus/kernel/attempt_spine_reader.py"
      - "daedalus/kernel/attempt_workspace.py"
      - "tests/kernel/test_isolated_attempt_authority_time.py"
      - "tests/kernel/test_isolated_attempt_lifecycle.py"
      - "tests/kernel/test_isolated_attempt_lifecycle_adversarial.py"
      - "tests/kernel/test_isolated_attempt_lifecycle_review.py"
      - "tests/kernel/test_isolated_attempt_spine_wire_review.py"
      - "scripts/run_attempt_authority_time_mutations.py"
      - "docs/work-packets/G0-ATT-13B2_EVENT_SPINE_AUTHORITY_TIME.md"
      - ".github/workflows/g0-attempt-authority-time.yml"
  push:
    branches:
      - g0/attempt-lifecycle-authority-time-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-attempt-authority-time-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m compileall -q daedalus tests scripts/run_attempt_authority_time_mutations.py
      - run: >-
          python -m pytest -q
          tests/kernel/test_isolated_attempt_authority_time.py
          tests/kernel/test_isolated_attempt_lifecycle.py
          tests/kernel/test_isolated_attempt_lifecycle_adversarial.py
          tests/kernel/test_isolated_attempt_lifecycle_review.py
          tests/kernel/test_isolated_attempt_spine_wire_review.py
          tests/kernel/test_isolated_attempt_cas_review.py
          tests/kernel/test_isolated_attempt_schema_review.py
          tests/kernel/test_isolated_attempt_workspace_topology_review.py
          tests/kernel/test_isolated_attempt_effect_inventory.py
          tests/kernel/test_source_tree_store.py
          tests/kernel/test_source_tree_store_adversarial.py

  mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python scripts/run_attempt_authority_time_mutations.py
      - run: >-
          git diff --exit-code --
          daedalus/kernel/attempt_contracts.py
          daedalus/kernel/attempt_ledger.py
          daedalus/kernel/attempt_spine_reader.py

  full-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: "123456"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" pytest
      - run: python -m pytest -q -p no:cacheprovider

  isolated-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-attempt-time-wheel
      - run: /tmp/daedalus-attempt-time-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        run: >-
          /tmp/daedalus-attempt-time-wheel/bin/python -c
          "from daedalus.kernel.attempts import
          AttemptLedger, IsolatedAttemptCoordinator"
