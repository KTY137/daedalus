name: Gate 0 Effect Replay Integration

on:
  pull_request:
    branches:
      - g0/repository-write-runtime-conformance-linear
    paths:
      - "daedalus/kernel/authorization.py"
      - "daedalus/kernel/effects.py"
      - "daedalus/kernel/effect_replay.py"
      - "tests/kernel/test_effect_authorization.py"
      - "tests/kernel/test_effect_replay_projection*.py"
      - "scripts/run_effect_replay_projection_mutations.py"
      - "docs/work-packets/G0-RWI-20L_EFFECT_REPLAY_INTEGRATION.*"
      - ".github/workflows/g0-effect-replay-integration.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/effect-replay-integration-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-effect-replay-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-RWI-20L_EFFECT_REPLAY_INTEGRATION.json
      - run: >-
          python -m pytest -q
          tests/kernel/test_effect_authorization.py
          tests/kernel/test_effect_replay_projection.py
          tests/kernel/test_effect_replay_projection_review.py
          tests/gates/test_repository_write_runtime_conformance.py
          tests/gates/test_repository_write_runtime_conformance_review.py
          tests/gates/test_repository_write_guard_structure.py
          tests/gates/test_repository_write_guard_structure_review.py
          tests/gates/test_python_target_structure.py
          tests/gates/test_python_target_structure_review.py
          tests/gates/test_repository_tree.py
          tests/gates/test_repository_tree_review.py
          tests/gates/test_guard_implementation_manifest.py
          tests/gates/test_guard_implementation_manifest_review.py
          tests/gates/test_repository_write_source_anchor_semantics.py
          tests/gates/test_repository_write_source_anchor_semantics_review.py
          tests/gates/test_repository_write_evidence_origin.py
          tests/gates/test_repository_write_evidence_origin_review.py
          tests/gates/test_repository_write_evidence_materialization.py
          tests/gates/test_repository_write_evidence_materialization_review.py
          tests/gates/test_repository_write_classification.py
          tests/gates/test_repository_write_classification_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_effect_replay_projection_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-effect-replay-wheel
      - run: /tmp/daedalus-effect-replay-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-effect-replay-wheel/bin/python - <<'PY'
          from daedalus.kernel.effect_replay import (
              EffectExecutionReplaySnapshot,
              EffectReplayProjectionError,
              inspect_effect_execution,
          )

          assert inspect_effect_execution.__module__ == "daedalus.kernel.effect_replay"
          assert EffectExecutionReplaySnapshot.__module__ == "daedalus.kernel.effect_replay"
          assert EffectReplayProjectionError.__module__ == "daedalus.kernel.effect_replay"
          PY
