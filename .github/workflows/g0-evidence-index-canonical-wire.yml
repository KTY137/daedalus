name: Gate 0 — canonical evidence-index wire

on:
  pull_request:
    branches:
      - g0/runtime-authorization-clock-linear
    paths:
      - "daedalus/gates/evidence.py"
      - "daedalus/gates/evidence_io.py"
      - "tests/gates/test_exact_head_evidence_io.py"
      - "tests/gates/test_exact_head_evidence_canonical_wire.py"
      - "scripts/run_evidence_index_wire_mutations.py"
      - "docs/work-packets/G0-EVD-08E_EVIDENCE_INDEX_CANONICAL_WIRE.md"
      - ".github/workflows/g0-evidence-index-canonical-wire.yml"
  push:
    branches:
      - g0/evidence-index-canonical-wire-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-evidence-index-wire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: evidence wire / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          python -m compileall -q
          daedalus/gates/evidence.py
          daedalus/gates/evidence_io.py
          tests/gates/test_exact_head_evidence_io.py
          tests/gates/test_exact_head_evidence_canonical_wire.py
          scripts/run_evidence_index_wire_mutations.py
      - name: Existing and canonical wire tests
        run: >-
          python -m pytest -q
          tests/gates/test_exact_head_evidence.py
          tests/gates/test_exact_head_evidence_strict.py
          tests/gates/test_exact_head_evidence_io.py
          tests/gates/test_exact_head_evidence_canonical_wire.py
          tests/gates/test_evidence_trust_bundle.py
          tests/gates/test_evidence_trust_bundle_review.py

  mutation:
    name: evidence-index wire mutation / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python scripts/run_evidence_index_wire_mutations.py
      - name: Refuse dirty source after mutation restoration
        shell: bash
        run: git diff --exit-code -- daedalus/gates/evidence_io.py

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  isolated-wheel:
    name: isolated wheel import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-evidence-wire-wheel
      - run: /tmp/daedalus-evidence-wire-wheel/bin/pip install dist/*.whl
      - name: Import strict evidence parser outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-evidence-wire-wheel/bin/python -c
          "from daedalus.gates import load_gate_evidence_index,
          parse_gate_evidence_index;
          assert load_gate_evidence_index;
          assert parse_gate_evidence_index"
