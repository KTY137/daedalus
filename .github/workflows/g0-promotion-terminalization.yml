name: Gate 0 Promotion Terminalization

on:
  pull_request:
    branches:
      - g0/promotion-dual-replay-linear
    paths:
      - "daedalus/kernel/__init__.py"
      - "daedalus/kernel/promotion_terminalization.py"
      - "tests/kernel/test_promotion_terminalization*.py"
      - "scripts/run_promotion_terminalization_mutations.py"
      - "docs/work-packets/G0-PRM-25G_PROMOTION_EFFECT_TERMINALIZATION.*"
      - ".github/workflows/g0-promotion-terminalization.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-terminalization-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-promotion-terminalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-PRM-25G_PROMOTION_EFFECT_TERMINALIZATION.json
      - run: >-
          python -m pytest -q
          tests/kernel/test_promotion_effect_capability.py
          tests/kernel/test_promotion_effect_replay.py
          tests/kernel/test_promotion_replay_projection.py
          tests/kernel/test_promotion_reconciliation.py
          tests/kernel/test_promotion_reconciliation_outcomes.py
          tests/kernel/test_promotion_terminalization.py
          tests/kernel/test_promotion_terminalization_outcomes.py
          tests/kernel/test_promotion_terminalization_adversarial.py
          tests/kernel/test_promotion_terminalization_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_promotion_terminalization_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-promotion-terminalization-wheel
      - run: /tmp/daedalus-promotion-terminalization-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-promotion-terminalization-wheel/bin/python - <<'PY'
          from daedalus.kernel import (
              PromotionEffectTerminalizationError,
              PromotionEffectTerminalizationResult,
              terminalize_promotion_effect,
          )

          assert terminalize_promotion_effect.__module__ == "daedalus.kernel.promotion_terminalization"
          assert PromotionEffectTerminalizationError.__module__ == "daedalus.kernel.promotion_terminalization"
          assert PromotionEffectTerminalizationResult.__module__ == "daedalus.kernel.promotion_terminalization"
          PY
