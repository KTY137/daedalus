name: Gate 2 prep — graph proposal contract

on:
  pull_request:
    branches:
      - g0/release-assessment-linear
    paths:
      - "daedalus/twin/proposals.py"
      - "daedalus/twin/__init__.py"
      - "tests/twin/test_graph_proposals.py"
      - "tests/twin/test_graph_proposal_review.py"
      - "scripts/run_graph_proposal_mutations.py"
      - "docs/work-packets/G2-PREP-GP01_GRAPH_PROPOSAL.md"
      - ".github/workflows/g2-graph-proposal-contract.yml"
  push:
    branches:
      - g2/graph-proposal-contract-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-graph-proposal-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: proposal / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m compileall -q daedalus tests scripts
      - name: Fourfold parent, malformed, stale, bypass and counter-review tests
        run: >-
          python -m pytest -q
          tests/twin/test_fourfold_contracts.py
          tests/twin/test_projection_verifier.py
          tests/twin/test_graph_proposals.py
          tests/twin/test_graph_proposal_review.py
      - name: Bounded graph-proposal mutation campaign
        run: python scripts/run_graph_proposal_mutations.py

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    name: isolated wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-graph-proposal-wheel
      - run: /tmp/daedalus-graph-proposal-wheel/bin/pip install dist/*.whl
      - name: Import installed contracts outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-graph-proposal-wheel/bin/python -c
          "from daedalus.twin import GraphProposal, ProposalVerificationReport;
          assert GraphProposal and ProposalVerificationReport"
