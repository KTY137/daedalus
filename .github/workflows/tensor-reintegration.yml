name: Owner-requested Tensor reintegration

# Temporary integration aid. Remove before merging PR #363 into main.
# Never writes main, changes approvals, or publishes candidate projects.
on:
  push:
    branches: [exp/tensor-kernel-contract-01]
    paths: [.github/workflows/tensor-reintegration.yml]
permissions:
  contents: write
concurrency:
  group: owner-tensor-reintegration
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile exact main and Tensor histories
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = 217d5edc2b5e59441051b9cb0df60a5fbca93fe2
          git config user.name 'Daedalus integration'
          git config user.email 'integration@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git switch -C exp/tensor-kernel-contract-01 "$GITHUB_SHA"
          git merge --no-ff --no-commit origin/main || {
            python - <<'PY'
          import subprocess
          allowed = {'docs/work-packets/index.json', 'tests/contracts/test_work_packet_index.py'}
          conflicted = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          if not conflicted or not conflicted <= allowed:
              raise SystemExit(f'Unexpected merge conflicts: {sorted(conflicted)}')
          for path in sorted(conflicted):
              subprocess.run(['git', 'checkout', '--ours', '--', path], check=True)
              subprocess.run(['git', 'add', '--', path], check=True)
          PY
          }
          python - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('docs/work-packets/G1-DESKTOP-LOCAL-BUILD-REPAIR-20260908.md')
          original = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          if blob != '2d9b8acba66d9922ba9346c52a18e71e79465e65':
              raise SystemExit('Desktop evidence changed; refusing an unreviewed metadata repair')
          header = '''Packet ID: G1-DESKTOP-LOCAL-BUILD-REPAIR-20260908
          Artifact role: primary
          Active gate: 1
          Classification: ALIGNED
          Owner: repository owner
          Base revision: 24e229c0f34e5404bc219637b646386529f82035
          Dependencies: none (standalone local build-driver repair)

          Registry projection added during owner-requested integration on 2026-09-11.
          The original report below is retained verbatim; its historical claims have
          not been re-executed or upgraded by this metadata repair.

          ## Primary acceptance claim
          Repair the owner-selected local desktop build driver; not release admission.

          ## Scope
          The frozen scope and actual files are documented in the original report below.

          ## Contracts and behavior
          Preserve canonical backend/smoke entrypoints, package identity, policy and version equality.

          ## Acceptance matrix
          The original Actual final build and Independent and adversarial review sections
          record measured checks, skips and platform limitations; this projection adds no results.

          ## Migration and rollback
          Restore only the scoped script backup and edits documented below; never reset unrelated work.

          ## Evidence expected failures and review
          Original logs, hashes, expected refusals, independent review and unsigned-local-build
          limitations remain in the unchanged historical report below.

          '''
          path.write_bytes(header.encode() + original)
          path = Path('tests/twin/test_relation_block_validation_fusion.py')
          original = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          if blob != '08055f21706eb1138b2d74a6efd2434c75ab30d5':
              raise SystemExit('Tensor test changed; refusing an unreviewed repair')
          text = original.decode()
          anchor = 'def test_from_indexed_reuses_validated_key_order_without_item_pair_copy()'
          assert text.count(anchor) == 1
          replacement = '''@pytest.mark.parametrize("coordinates", ((), ((1, 1),), ((0, 0), (0, 2), (1, 1))))
          def test_from_indexed_reuses_values_without_rehashing_validated_keys(coordinates) -> None:
              """Observe behavior, not the spelling of the compiler implementation."""
              forbid_hash = False

              class Key(tuple):
                  def __hash__(self):
                      if forbid_hash:
                          raise AssertionError("validated exact-dict keys must not be rehashed")
                      return super().__hash__()

              entries = {Key(coordinate): True for coordinate in coordinates}
              forbid_hash = True
              rows, columns = _axes()
              block = TypedRelationBlock._from_indexed(
                  _subject(), RelationSignature("code", "declares", "type"),
                  rows, columns, entries, BooleanSemiring(),
              )
              assert tuple(block.iter_entries()) == tuple(
                  (rows.labels[row], columns.labels[column], True)
                  for row, column in coordinates
              )
              assert block.row_offsets == (
                  0, sum(row == 0 for row, _ in coordinates), len(coordinates)
              )
          '''
          path.write_bytes((text[:text.index(anchor)] + replacement).encode())
          path = Path('tests/test_ariadne_test_evaluator.py')
          original = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          if blob != 'fc50e8c606dde83f4b124b36c0daacca1b6a2529':
              raise SystemExit('Ariadne test changed; refusing an unreviewed repair')
          text = original.decode()
          old = '    with pytest.raises(AriadneCampaignError, match="different number of tests"):'
          assert text.count(old) == 1
          new = '''    # A containment backend may refuse the import-time forgery before the
              # cardinality check. Both are fail-closed; never require an attack to run.
              with pytest.raises(AriadneCampaignError, match=(
                  "different number of tests|the repair does not pass the test command"
              )):'''
          path.write_bytes(text.replace(old, new).encode())
          PY
          git add docs/work-packets/G1-DESKTOP-LOCAL-BUILD-REPAIR-20260908.md tests/twin/test_relation_block_validation_fusion.py tests/test_ariadne_test_evaluator.py
          mkdir -p "$RUNNER_TEMP/reintegration-evidence"
          python tools/index_work_packets.py --render > "$RUNNER_TEMP/work-packet-index.json"
          cp "$RUNNER_TEMP/work-packet-index.json" docs/work-packets/index.json
          git add docs/work-packets/index.json
          python tools/index_work_packets.py --check
          git -c core.whitespace=cr-at-eol diff --cached --check origin/main
          git commit -m 'merge: reconcile main and Tensor; regenerate registry; verify CSR and containment behavior'
          git rev-parse HEAD > "$RUNNER_TEMP/reintegration-evidence/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/reintegration-evidence/tree.txt"
          git show -s --format='%H%n%P%n%T%n%B' HEAD > "$RUNNER_TEMP/reintegration-evidence/identity.txt"
          cp docs/work-packets/index.json "$RUNNER_TEMP/reintegration-evidence/index.json"
      - name: Install declared test dependencies
        run: python -m pip install '.[test,polyglot,root]'
      - name: Test combined Tensor, registry, Ikarus and Ariadne contracts
        env:
          PYTHONHASHSEED: '0'
        run: |
          python -m pytest -q \
            tests/twin \
            tests/contracts/test_work_packet_index.py \
            tests/test_kernel_contracts.py \
            tests/test_ikarus_computer_loop_ariadne.py \
            tests/test_ariadne_test_evaluator.py \
            tests/runtimes/test_computer_ariadne.py \
            --junitxml="$RUNNER_TEMP/reintegration-evidence/junit.xml"
      - name: Retain actual combined-tree test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensor-reintegration-${{ github.sha }}
          path: ${{ runner.temp }}/reintegration-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish verified merge only to existing Tensor lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          remote_main=$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/main | cut -f1)
          test "$remote_main" = 217d5edc2b5e59441051b9cb0df60a5fbca93fe2
          remote_tensor=$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/exp/tensor-kernel-contract-01 | cut -f1)
          test "$remote_tensor" = "$GITHUB_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/exp/tensor-kernel-contract-01
