name: Gate 0 Promotion Effect Terminal Reconciliation

on:
  pull_request:
    branches:
      - g0/promotion-effect-replay-decision-linear
    paths:
      - "daedalus/kernel/__init__.py"
      - "daedalus/kernel/effect_replay.py"
      - "daedalus/kernel/promotion_replay.py"
      - "daedalus/kernel/promotion_effect_replay.py"
      - "daedalus/kernel/promotion_effect_reconcile.py"
      - "tests/kernel/test_effect_replay_projection*.py"
      - "tests/kernel/test_promotion_replay_projection*.py"
      - "tests/kernel/test_promotion_effect_replay_*.py"
      - "tests/kernel/test_promotion_effect_reconcile*.py"
      - "scripts/run_promotion_effect_reconcile_mutations.py"
      - "docs/work-packets/G0-PRM-25G_PROMOTION_EFFECT_TERMINAL_RECONCILE.*"
      - ".github/workflows/g0-promotion-effect-terminal-reconcile.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-effect-terminal-reconcile-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-promotion-effect-terminal-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-PRM-25G_PROMOTION_EFFECT_TERMINAL_RECONCILE.json
      - run: >-
          python -m pytest -q
          tests/kernel/test_effect_replay_projection.py
          tests/kernel/test_effect_replay_projection_review.py
          tests/kernel/test_promotion_replay_projection.py
          tests/kernel/test_promotion_replay_projection_review.py
          tests/kernel/test_promotion_effect_replay_decision.py
          tests/kernel/test_promotion_effect_replay_outcomes.py
          tests/kernel/test_promotion_effect_replay_decision_review.py
          tests/kernel/test_promotion_effect_reconcile.py
          tests/kernel/test_promotion_effect_reconcile_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_promotion_effect_reconcile_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-promotion-effect-reconcile-wheel
      - run: /tmp/daedalus-promotion-effect-reconcile-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-promotion-effect-reconcile-wheel/bin/python - <<'PY'
          from daedalus.kernel import (
              PromotionEffectReconciliationResult,
              reconcile_promotion_effect_terminal,
          )

          assert reconcile_promotion_effect_terminal.__module__ == "daedalus.kernel.promotion_effect_reconcile"
          assert PromotionEffectReconciliationResult.__module__ == "daedalus.kernel.promotion_effect_reconcile"
          PY
