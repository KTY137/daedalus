name: Iron Plan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the canonical plan and projections
        run: python tools/iron_plan_guard.py verify
      - name: Verify append-only adoption against the PR base
        if: github.event_name == 'pull_request'
        run: >-
          python tools/iron_plan_guard.py verify-base
          "${{ github.event.pull_request.base.sha }}"
      - name: Verify append-only history on push
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        run: >-
          python tools/iron_plan_guard.py verify-base
          "${{ github.event.before }}"
      - name: Run Iron Plan contract tests
        run: python -m unittest tests.test_iron_plan_guard -v
