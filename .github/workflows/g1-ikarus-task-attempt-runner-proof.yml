name: Ikarus TaskAttempt Claude Runner Proof

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - "daedalus/ikarus_claude_task_attempt_runner.py"
      - "tests/test_ikarus_claude_task_attempt_runner.py"
      - ".github/workflows/g1-ikarus-task-attempt-runner-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-ikarus-task-attempt-runner-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: >-
          python -m py_compile
          daedalus/ikarus_claude_task_attempt_runner.py
          tests/test_ikarus_claude_task_attempt_runner.py
      - run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_ikarus_claude_task_attempt_runner.py
