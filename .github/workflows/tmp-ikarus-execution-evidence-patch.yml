name: Temporary Ikarus execution evidence patch

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - .github/workflows/tmp-ikarus-execution-evidence-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply bounded patch
        run: python .github/ikarus_execution_evidence_patch.py
      - name: Commit product and regression; remove temporary scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daedalus/core.py tests/providers/test_claude_sealed_output_evidence.py
          git rm .github/ikarus_execution_evidence_patch.py .github/workflows/tmp-ikarus-execution-evidence-patch.yml
          git diff --cached --check
          git commit -m "feat(ikarus): carry claude execution identity to reports"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
