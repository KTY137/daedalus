name: Gate 0 — runtime provider broker

on:
  pull_request:
    branches:
      - g0/runtime-lease-admission
    paths:
      - "daedalus/runtimes/broker.py"
      - "daedalus/kernel/runtime_effects.py"
      - "daedalus/kernel/effects.py"
      - "daedalus/runtimes/trust_store.py"
      - "daedalus/spine/effect_boundary.py"
      - "tests/runtimes/test_runtime_provider_broker.py"
      - "tests/kernel/test_runtime_effect_admission.py"
      - "tests/runtimes/test_runtime_trust_store.py"
      - ".github/workflows/g0-runtime-provider-broker.yml"
  push:
    branches:
      - g0/runtime-provider-broker
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-runtime-provider-broker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-contracts:
    name: broker / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q daedalus tests
      - name: Runtime provider broker and authority tests
        run: >-
          python -m pytest -q
          tests/runtimes/test_runtime_provider_broker.py
          tests/kernel/test_runtime_effect_admission.py
          tests/kernel/test_effect_leases.py
          tests/runtimes/test_runtime_trust_store.py
          tests/runtimes/test_runtime_live_trust_anchor.py
          tests/test_effect_boundary.py

  isolated-wheel:
    name: isolated broker wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-runtime-broker-wheel
      - run: /tmp/daedalus-runtime-broker-wheel/bin/pip install dist/*.whl
      - name: Import broker after runtime authority
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-runtime-broker-wheel/bin/python -c
          "from daedalus.kernel.runtime_effects import RuntimeBoundEffectAuthorization;
          from daedalus.runtimes.broker import run_runtime_provider;
          assert RuntimeBoundEffectAuthorization and run_runtime_provider"
      - name: Import broker before runtime authority
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-runtime-broker-wheel/bin/python -c
          "from daedalus.runtimes.broker import RuntimeInvocationResult;
          from daedalus.kernel.runtime_effects import RuntimeBoundEffectLease;
          assert RuntimeInvocationResult and RuntimeBoundEffectLease"
