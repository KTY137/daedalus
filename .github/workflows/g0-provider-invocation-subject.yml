name: Gate 0 Provider Invocation Subject

on:
  pull_request:
    branches:
      - g0/provider-observation-authority-linear
    paths:
      - "daedalus/runtimes/provider/invocation.py"
      - "tests/runtimes/test_provider_invocation_subject*.py"
      - "docs/work-packets/G0-RTC-06T_PROVIDER_INVOCATION_SUBJECT.*"
      - ".github/workflows/g0-provider-invocation-subject.yml"
  push:
    branches:
      - g0/provider-invocation-subject-r2-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-invocation-subject-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests
      - run: python -m json.tool docs/work-packets/G0-RTC-06T_PROVIDER_INVOCATION_SUBJECT.json
      - run: >-
          python -m pytest -q
          tests/runtimes/test_provider_invocation_subject.py
          tests/runtimes/test_provider_invocation_subject_review.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-provider-invocation-wheel
      - run: /tmp/daedalus-provider-invocation-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-provider-invocation-wheel/bin/python - <<'PY'
          from daedalus.runtimes.provider.invocation import (
              ProviderInvocationSubject,
              ProviderInvocationSubjectError,
          )

          assert ProviderInvocationSubject is not None
          assert ProviderInvocationSubjectError is not None
          PY
