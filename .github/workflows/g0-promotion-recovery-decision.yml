name: Gate 0 Promotion Recovery Decision

on:
  pull_request:
    branches:
      - g0/promotion-recovery-plan-linear
    paths:
      - "daedalus/kernel/promotion_recovery_decision.py"
      - "tests/kernel/test_promotion_recovery_decision*.py"
      - "scripts/run_promotion_recovery_decision_mutations.py"
      - "docs/work-packets/G0-PRM-25K_PROMOTION_RECOVERY_DECISION.*"
      - ".github/workflows/g0-promotion-recovery-decision.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-recovery-decision-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-promotion-recovery-decision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-PRM-25K_PROMOTION_RECOVERY_DECISION.json
      - run: >-
          python -m pytest -q
          tests/kernel/test_promotion_recovery_decision.py
          tests/kernel/test_promotion_recovery_decision_review.py
          tests/kernel/test_promotion_recovery_plan.py
          tests/kernel/test_promotion_reconciliation.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_promotion_recovery_decision_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-promotion-recovery-decision-wheel
      - run: /tmp/daedalus-promotion-recovery-decision-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-promotion-recovery-decision-wheel/bin/python - <<'PY'
          from daedalus.kernel.promotion_recovery_decision import (
              PromotionRecoveryDecision,
              PromotionRecoveryExpectation,
              VerifiedPromotionRecoveryDecision,
              recovery_expectation,
              verify_promotion_recovery_decision,
          )

          assert PromotionRecoveryDecision.__module__ == "daedalus.kernel.promotion_recovery_decision"
          assert PromotionRecoveryExpectation.__module__ == "daedalus.kernel.promotion_recovery_decision"
          assert VerifiedPromotionRecoveryDecision.__module__ == "daedalus.kernel.promotion_recovery_decision"
          assert recovery_expectation.__module__ == "daedalus.kernel.promotion_recovery_decision"
          assert verify_promotion_recovery_decision.__module__ == "daedalus.kernel.promotion_recovery_decision"
          PY
