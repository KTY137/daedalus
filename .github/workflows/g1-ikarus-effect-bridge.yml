name: Gate 1 Ikarus Effect Bridge

on:
  push:
    branches:
      - g1/ikarus-effect-bridge-06
  pull_request:
    branches:
      - main
      - g1/ikarus-tool-scope-05
    paths:
      - "daedalus/ikarus_effect_bridge.py"
      - "daedalus/ikarus_oneshot.py"
      - "daedalus/ikarus_tool_scope.py"
      - "daedalus/kernel/contracts.py"
      - "daedalus/kernel/effects.py"
      - "daedalus/schemas.py"
      - "daedalus/spine/effect_boundary.py"
      - "tests/test_ikarus_effect_bridge.py"
      - "tests/test_ikarus_oneshot.py"
      - "tests/test_ikarus_tool_scope.py"
      - "docs/research/hermes-agent-v2026.8.19-provenance.json"
      - "docs/work-packets/G1-IKARUS-06_CANONICAL_EFFECT_BRIDGE.md"
      - ".github/workflows/g1-ikarus-effect-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-ikarus-effect-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: >-
          python -m py_compile
          daedalus/ikarus_effect_bridge.py
          daedalus/ikarus_oneshot.py
          daedalus/ikarus_tool_scope.py
          daedalus/kernel/contracts.py
          daedalus/kernel/effects.py
          tests/test_ikarus_effect_bridge.py
      - run: python -m json.tool docs/research/hermes-agent-v2026.8.19-provenance.json
      - run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_ikarus_effect_bridge.py
          tests/test_ikarus_oneshot.py
          tests/test_ikarus_tool_scope.py
          tests/test_ikarus_runtime_role.py
          tests/kernel/test_runtime_conformance_harness.py
          tests/runtimes/test_runtime_conformance_profiles.py
