name: Temporary Ikarus Atomic Claude Handoff Patch

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - ".github/workflows/tmp-ikarus-atomic-claude.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python .github/ikarus_atomic_claude_patch.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m py_compile daedalus/ikarus_claude_composition.py tests/test_ikarus_claude_composition.py
      - run: python -m pytest -q -p no:cacheprovider tests/test_ikarus_claude_composition.py
      - name: Commit product delta and remove temporary scaffold
        run: |
          rm .github/ikarus_atomic_claude_patch.py
          rm .github/workflows/tmp-ikarus-atomic-claude.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ikarus): make Claude authority handoff atomic"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
