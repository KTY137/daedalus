name: Fourfold v2

on:
  pull_request:
    branches:
      - main
    paths:
      - "daedalus/twin/**"
      - "daedalus/schemas.py"
      - "daedalus/structcore/forest.py"
      - "tests/twin/**"
      - "tests/test_kernel_contracts.py"
      - "pyproject.toml"
      - ".github/workflows/fourfold-v2.yml"
  push:
    branches:
      - g1/gardener-post-release-containment-03
      - exp/tensor-kernel-contract-01
    paths:
      - "daedalus/twin/**"
      - "tests/twin/**"
      - "pyproject.toml"
      - ".github/workflows/fourfold-v2.yml"

concurrency:
  group: fourfold-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        hash-seed: ["0", "123456"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run Fourfold and kernel contract tests
        env:
          PYTHONHASHSEED: ${{ matrix.hash-seed }}
        run: |
          python -m pytest -q tests/twin tests/test_kernel_contracts.py
      - name: Emit fused compiled Boolean receipt
        if: matrix.python-version == '3.12' && matrix.hash-seed == '0'
        env:
          PYTHONHASHSEED: "0"
        run: |
          python - <<'PY'
          import json
          import runpy

          namespace = runpy.run_path("tests/twin/test_compiled_boolean_cost_probe.py")
          with open("compiled-boolean-cost.jsonl", "w", encoding="utf-8") as handle:
              for size in (64, 256, 512):
                  report = namespace["compiled_boolean_probe"](
                      size=size,
                      repeats=5,
                      query_iterations=20,
                  )
                  line = json.dumps(report, sort_keys=True, separators=(",", ":"))
                  print(line)
                  handle.write(line + "\n")
          PY
      - name: Upload fused compiled Boolean receipt
        if: matrix.python-version == '3.12' && matrix.hash-seed == '0'
        uses: actions/upload-artifact@v4
        with:
          name: compiled-boolean-cost-${{ github.sha }}
          path: compiled-boolean-cost.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: Verify wheel contains the twin package
        run: |
          python -c "import daedalus.twin; print(daedalus.twin.FOURFOLD_PLANES)"

  repository-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install complete test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,polyglot,root]" pytest
      - name: Verify declared test dependencies
        run: |
          python -c "import jsonschema, pytest_asyncio; print(jsonschema.__version__); print(pytest_asyncio.__version__)"
      - name: Collect complete repository suite
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest --collect-only -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/daedalus-wheel
          /tmp/daedalus-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          PYTHONPATH= /tmp/daedalus-wheel/bin/python - <<'PY'
          import daedalus.twin
          import daedalus.twin.extractors
          print(daedalus.twin.FOURFOLD_PLANES)
          print(daedalus.twin.extractors.registered_language_ids())
          PY