name: Fourfold, Tensor and integration contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "daedalus/twin/**"
      - "daedalus/arch_memory.py"
      - "daedalus/arch_hook.py"
      - "daedalus/shift.py"
      - "daedalus/shift_hook.py"
      - "daedalus/shift_ticker.py"
      - "daedalus/schemas.py"
      - "daedalus/structcore/forest.py"
      - "experiments/fourfold_hybrid_retrieval/**"
      - "experiments/tensor_embedding/**"
      - "experiments/tensor_gpu/**"
      - "docs/work-packets/**"
      - "tests/twin/**"
      - "tests/test_kernel_contracts.py"
      - "tests/test_tensor_latent_ceiling.py"
      - "tests/test_arch_memory.py"
      - "tests/test_shift.py"
      - "pyproject.toml"
      - ".github/workflows/fourfold-v2.yml"
  push:
    branches: [main]
    paths:
      - "daedalus/twin/**"
      - "daedalus/arch_memory.py"
      - "daedalus/arch_hook.py"
      - "daedalus/shift.py"
      - "daedalus/shift_hook.py"
      - "daedalus/shift_ticker.py"
      - "experiments/fourfold_hybrid_retrieval/**"
      - "experiments/tensor_embedding/**"
      - "experiments/tensor_gpu/**"
      - "docs/work-packets/**"
      - "tests/twin/**"
      - "tests/test_tensor_latent_ceiling.py"
      - "tests/test_arch_memory.py"
      - "tests/test_shift.py"
      - "pyproject.toml"
      - ".github/workflows/fourfold-v2.yml"
  workflow_dispatch:

concurrency:
  group: fourfold-tensor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Python ${{ matrix.python-version }}, hash ${{ matrix.hash-seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        hash-seed: ["0", "123456"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and declared test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Compile integrated modules
        run: |
          python -m py_compile \
            daedalus/twin/*.py \
            daedalus/arch_memory.py \
            daedalus/arch_hook.py \
            daedalus/shift.py \
            daedalus/shift_hook.py \
            daedalus/shift_ticker.py \
            experiments/fourfold_hybrid_retrieval/*.py \
            experiments/tensor_embedding/arm_o_latent_ceiling.py \
            experiments/tensor_gpu/*.py
      - name: Run integrated contract surface
        env:
          PYTHONHASHSEED: ${{ matrix.hash-seed }}
        run: |
          python -m pytest -q \
            tests/twin \
            tests/test_kernel_contracts.py \
            tests/test_tensor_latent_ceiling.py \
            tests/test_arch_memory.py \
            tests/test_shift.py
      - name: Emit bounded packed CPU bitset Tensor baseline
        if: matrix.python-version == '3.12' && matrix.hash-seed == '0'
        env:
          PYTHONHASHSEED: "0"
        run: |
          python experiments/tensor_gpu/cpu_bitset_baseline.py \
            --sizes 64 128 256 \
            --densities 0.01 0.05 \
            --repeats 5 \
            --warmup 2 \
            --output runs/tensor_gpu/cpu_bitset_ci.json
      - name: Retain bounded packed CPU bitset diagnostic
        if: matrix.python-version == '3.12' && matrix.hash-seed == '0'
        uses: actions/upload-artifact@v4
        with:
          name: tensor-cpu-bitset-baseline-${{ github.sha }}
          path: runs/tensor_gpu/cpu_bitset_ci.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify public package API
        run: |
          python - <<'PY'
          from daedalus.twin import (
              BooleanSemiring,
              TensorView,
              Transformation2Cell,
              TypedRelationBlock,
              boolean_relation_block_from_fourfold,
          )
          import daedalus.twin.hybrid_retrieval
          import daedalus.twin.relation_compiler
          print(BooleanSemiring.name)
          print(TensorView.CONTRACT_TYPE)
          print(Transformation2Cell.__name__)
          print(TypedRelationBlock.__name__)
          print(boolean_relation_block_from_fourfold.__name__)
          PY

  repository-collection:
    name: Complete repository collection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install complete declared test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,polyglot,root]"
      - name: Collect the complete repository suite
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest --collect-only -q

  isolated-wheel:
    name: Isolated wheel imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install and import from an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/daedalus-wheel
          /tmp/daedalus-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          PYTHONPATH= /tmp/daedalus-wheel/bin/python - <<'PY'
          import daedalus.arch_memory
          import daedalus.shift
          import daedalus.twin
          import daedalus.twin.hybrid_retrieval
          import daedalus.twin.relation_compiler
          import daedalus.twin.relation_projection
          import daedalus.twin.tensor
          import daedalus.twin.two_category
          print(daedalus.twin.FOURFOLD_PLANES)
          print(daedalus.twin.TensorView.CONTRACT_TYPE)
          PY

  full-suite:
    name: Complete suite (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install complete declared test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,polyglot,root]"
      - name: Run complete suite in measured load-file mode
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest -q -n auto --dist loadfile
