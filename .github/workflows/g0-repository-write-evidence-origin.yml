name: Gate 0 Repository Write Evidence Origin Authentication

on:
  pull_request:
    branches:
      - g0/repository-write-evidence-authentication-linear
    paths:
      - "daedalus/gates/repository_write_evidence_origin.py"
      - "tests/gates/test_repository_write_evidence_origin*.py"
      - "scripts/run_repository_write_evidence_origin_mutations.py"
      - "configs/schemas/repository-write-evidence-origin.schema.json"
      - "docs/work-packets/G0-RWI-20E_REPOSITORY_WRITE_EVIDENCE_ORIGIN.*"
      - ".github/workflows/g0-repository-write-evidence-origin.yml"
  push:
    branches:
      - g0/repository-write-evidence-origin-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-repository-write-evidence-origin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool configs/schemas/repository-write-evidence-origin.schema.json
      - run: python -m json.tool docs/work-packets/G0-RWI-20E_REPOSITORY_WRITE_EVIDENCE_ORIGIN.json
      - run: >-
          python -m pytest -q
          tests/gates/test_repository_write_evidence_origin.py
          tests/gates/test_repository_write_evidence_origin_review.py
          tests/gates/test_repository_write_evidence_materialization.py
          tests/gates/test_repository_write_evidence_materialization_review.py
          tests/gates/test_repository_write_classification.py
          tests/gates/test_repository_write_classification_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_repository_write_evidence_origin_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-evidence-origin-wheel
      - run: /tmp/daedalus-evidence-origin-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-evidence-origin-wheel/bin/python - <<'PY'
          from daedalus.gates.repository_write_evidence_origin import (
              RepositoryWriteEvidenceOriginAttestation,
              RepositoryWriteEvidenceOriginError,
              RepositoryWriteEvidenceOriginReport,
              issue_repository_write_evidence_origin_attestation,
              parse_repository_write_evidence_origin_attestation,
              verify_repository_write_evidence_origin,
          )

          assert issubclass(RepositoryWriteEvidenceOriginError, RuntimeError)
          assert RepositoryWriteEvidenceOriginAttestation.__dataclass_fields__
          assert RepositoryWriteEvidenceOriginReport.__dataclass_fields__
          assert callable(issue_repository_write_evidence_origin_attestation)
          assert callable(parse_repository_write_evidence_origin_attestation)
          assert callable(verify_repository_write_evidence_origin)
          PY
