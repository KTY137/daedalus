name: Run branch consolidation 2026-08-30

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: branch-consolidation-20260830
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'ops/branch-consolidation-arm3-20260830'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Execute recovery-first consolidation
        run: python tools/branch_consolidate_20260830.py
