name: Gate 1 Ignition Slice

# This workflow used to reference branch names that no longer existed on origin,
# which made its acceptance matrix effectively manual-only. The canonical form
# follows the real integration boundary: PRs targeting main and pushes to main.
# The test list names the current Gate-1 slice rather than the 2026-08-17
# rehearsal, and .gitattributes is included because evaluator-bundle closure
# stability depends on its explicit per-file declarations.
on:
  pull_request:
    branches:
      - main
    paths:
      - "daedalus/ignition/**"
      - "daedalus/kernel/fourfold_evidence.py"
      - "daedalus/mapping/switches.py"
      - "daedalus/structcore/ignore.py"
      - "tools/gate_host_preflight.py"
      - "tests/fixtures/ignition/**"
      - "tests/ignition/**"
      - "tests/test_ignition_gate1.py"
      - "tests/test_ignition_receipt_retention.py"
      - "tests/kernel/test_fourfold_evidence*.py"
      - "tests/test_fourfold_snapshot_locator.py"
      - "tests/test_artifact_store.py"
      - "tests/test_ignition_bundle.py"
      - "tests/test_ignition_bundle_gitattributes.py"
      - "tests/test_gate_host_preflight_coverage.py"
      - "tests/test_mapping_switches.py"
      - "tests/test_mapping_switches_indirect.py"
      - "tests/test_structcore_center_directive.py"
      - "docs/work-packets/G1-WP-01_VOLTAGE_IGNITION.md"
      - "docs/work-packets/G1-ISO-01_BEHAVIOR_PROBE_OUT_OF_PROCESS.md"
      - "docs/work-packets/G1-ISO-02_EVALUATOR_CHILD_BOUNDS.md"
      - ".gitattributes"
      - ".github/workflows/gate1-ignition.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate1-ignition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ignition:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      # This suite is intentionally self-contained: it must not require an
      # operator-local killswitch permit or a pre-existing spine database.
      # Linux here also gives the evaluator-child environment allowlist a POSIX
      # measurement instead of assuming the Windows development result transfers.
      - run: >-
          python -m pytest -q
          tests/ignition/
          tests/test_ignition_gate1.py
          tests/test_ignition_receipt_retention.py
          tests/test_ignition_bundle.py
          tests/test_ignition_bundle_gitattributes.py
          tests/test_gate_host_preflight_coverage.py
          tests/test_mapping_switches.py
          tests/test_mapping_switches_indirect.py
          tests/test_structcore_center_directive.py
          tests/kernel/test_fourfold_evidence.py
          tests/kernel/test_fourfold_evidence_adversarial.py
          tests/kernel/test_fourfold_evidence_source_review.py
          tests/kernel/test_fourfold_evidence_owner_binding.py
          tests/kernel/test_fourfold_evidence_outer_ports.py
          tests/test_fourfold_snapshot_locator.py
          tests/test_artifact_store.py
          tests/kernel/test_fourfold_approval_integration.py
          tests/kernel/test_owner_approval.py
          tests/twin/test_wiki_reference.py
          tests/twin/test_reference_hardening.py

  isolated-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-wheel
      - run: /tmp/daedalus-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        run: >-
          /tmp/daedalus-wheel/bin/python -c
          "from daedalus.ignition.gate1 import run_gate1_ignition; from daedalus.kernel import assemble_fourfold_evidence_packet"
