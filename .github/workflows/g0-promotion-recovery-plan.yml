name: Gate 0 Promotion Recovery Plan

on:
  pull_request:
    branches:
      - g0/promotion-public-entrypoint-linear
    paths:
      - "daedalus/kernel/promotion_recovery.py"
      - "tests/kernel/test_promotion_recovery_plan*.py"
      - "scripts/run_promotion_recovery_plan_mutations.py"
      - "docs/work-packets/G0-PRM-25J_PROMOTION_RECOVERY_PLAN.*"
      - ".github/workflows/g0-promotion-recovery-plan.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-recovery-plan-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-promotion-recovery-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-PRM-25J_PROMOTION_RECOVERY_PLAN.json
      - run: >-
          python -m pytest -q
          tests/kernel/test_promotion_recovery_plan.py
          tests/kernel/test_promotion_recovery_plan_review.py
          tests/kernel/test_promotion_reconciliation.py
          tests/kernel/test_promotion_terminalization.py
          tests/kernel/test_promotion_effect_lifecycle_fault_windows.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_promotion_recovery_plan_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-promotion-recovery-wheel
      - run: /tmp/daedalus-promotion-recovery-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-promotion-recovery-wheel/bin/python - <<'PY'
          from daedalus.kernel.promotion_recovery import (
              PromotionRecoveryAction,
              PromotionRecoveryPlan,
              plan_promotion_recovery,
          )

          assert PromotionRecoveryAction.__module__ == "daedalus.kernel.promotion_recovery"
          assert PromotionRecoveryPlan.__module__ == "daedalus.kernel.promotion_recovery"
          assert plan_promotion_recovery.__module__ == "daedalus.kernel.promotion_recovery"
          PY
