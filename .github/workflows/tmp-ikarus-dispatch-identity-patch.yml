name: Temporary Ikarus dispatch identity patch

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - .github/workflows/tmp-ikarus-dispatch-identity-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply focused producer cut
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("daedalus/web_api.py")
          text = path.read_text(encoding="utf-8")
          old = '''                    link = conv.default_store().link_dispatch(
                        str(conversation_id), task_id,
                        turn_id=(int(turn_id) if turn_id is not None else None),
                        kind="queue_task")
          '''
          new = '''                    link = conv.default_store().link_dispatch(
                        str(conversation_id), task_id,
                        turn_id=(int(turn_id) if turn_id is not None else None),
                        kind="queue_task",
                        detail={
                            "schema": "conversation.dispatch.identity.v1",
                            "project": project,
                            "objective": objective,
                            "lane": str(result["lane"]),
                        })
          '''
          # The YAML indentation above becomes part of the Python triple-quoted
          # closing line only in the workflow source, not in the shell script.
          old = old[:-10] if old.endswith("          ") else old
          new = new[:-10] if new.endswith("          ") else new
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one queue dispatch link seam, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cat > tests/test_queue_dispatch_identity.py <<'PY'
          from types import SimpleNamespace

          from daedalus import conversation as conv
          from daedalus import web_api


          def test_queue_binds_canonical_dispatch_identity_from_real_enqueue_result(monkeypatch):
              body = {
                  "project": "project_tct",
                  "objective": "  inspect runtime identity  ",
                  "lane": "auto",
                  "source": "webapp",
                  "strategy": "single",
                  "paths": ["daedalus/web_api.py"],
                  "conversation_id": "conv-1",
                  "turn_id": 7,
              }
              queue_call = {}
              link_call = {}
              sent = {}

              def fake_queue_task(project, objective, lane, source, strategy, paths):
                  queue_call.update(
                      project=project,
                      objective=objective,
                      lane=lane,
                      source=source,
                      strategy=strategy,
                      paths=paths,
                  )
                  # Deliberately differ from the request lane. The durable identity
                  # must describe what enqueue returned, not reconstruct the request.
                  return {"queued": "/tmp/task-identity-123.json", "lane": "claude"}

              def fake_link_dispatch(conversation_id, dispatch_ref, **kwargs):
                  link_call.update(
                      conversation_id=conversation_id,
                      dispatch_ref=dispatch_ref,
                      **kwargs,
                  )
                  return SimpleNamespace(
                      conversation_id=conversation_id,
                      turn_id=kwargs["turn_id"],
                      dispatch_ref=dispatch_ref,
                  )

              monkeypatch.setattr(web_api, "_read_body", lambda _handler: body)
              monkeypatch.setattr(web_api.core, "queue_task", fake_queue_task)
              monkeypatch.setattr(
                  conv,
                  "default_store",
                  lambda: SimpleNamespace(link_dispatch=fake_link_dispatch),
              )

              handler = object.__new__(web_api.DaedalusHandler)
              handler.path = "/api/queue"
              handler._send_json = (
                  lambda payload, status=200: sent.update(payload=payload, status=status)
              )

              handler._handle_post()

              assert queue_call == {
                  "project": "project_tct",
                  "objective": "inspect runtime identity",
                  "lane": "auto",
                  "source": "webapp",
                  "strategy": "single",
                  "paths": ["daedalus/web_api.py"],
              }
              assert link_call == {
                  "conversation_id": "conv-1",
                  "dispatch_ref": "task-identity-123",
                  "turn_id": 7,
                  "kind": "queue_task",
                  "detail": {
                      "schema": "conversation.dispatch.identity.v1",
                      "project": "project_tct",
                      "objective": "inspect runtime identity",
                      "lane": "claude",
                  },
              }
              assert sent["status"] == 200
              assert sent["payload"]["conversation_link"] == {
                  "conversation_id": "conv-1",
                  "turn_id": 7,
                  "dispatch_ref": "task-identity-123",
                  "linked": True,
              }
          PY
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest
      - name: Verify focused cut
        run: |
          python -m py_compile daedalus/web_api.py tests/test_queue_dispatch_identity.py
          python -m pytest -q -p no:cacheprovider tests/test_queue_dispatch_identity.py
      - name: Commit verified product delta only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daedalus/web_api.py tests/test_queue_dispatch_identity.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fxq 'daedalus/web_api.py'
          git diff --cached --name-only | grep -Fxq 'tests/test_queue_dispatch_identity.py'
          git commit -m "feat(web): bind canonical dispatch identity at enqueue"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
