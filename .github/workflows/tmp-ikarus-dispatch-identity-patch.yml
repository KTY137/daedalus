name: Temporary Ikarus dispatch identity cleanup

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - .github/workflows/tmp-ikarus-dispatch-identity-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Admit regression and retire stale one-shot scaffolding
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/g1-ikarus-unified-runtime-admission.yml")
          text = path.read_text(encoding="utf-8")

          pr_line = '      - "tests/test_llm_client_readiness_evidence.py"\n'
          pr_new = pr_line + '      - "tests/test_queue_dispatch_identity.py"\n'
          if text.count(pr_line) != 1:
              raise SystemExit("expected one PR-path insertion seam")
          text = text.replace(pr_line, pr_new, 1)

          gate_line = '          tests/test_llm_client_readiness_evidence.py\n'
          gate_new = gate_line + '          tests/test_queue_dispatch_identity.py\n'
          if text.count(gate_line) != 2:
              raise SystemExit("expected compile + pytest gate insertion seams")
          text = text.replace(gate_line, gate_new)
          path.write_text(text, encoding="utf-8")
          PY
          test -f .github/workflows/tmp-ikarus-stop-patch.yml
          test -f .github/ikarus_stop_patch.py
          test -f .github/ikarus_stop_retry
          git rm \
            .github/workflows/tmp-ikarus-stop-patch.yml \
            .github/ikarus_stop_patch.py \
            .github/ikarus_stop_retry
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest
      - name: Verify queue identity regression
        run: |
          python -m py_compile daedalus/web_api.py tests/test_queue_dispatch_identity.py
          python -m pytest -q -p no:cacheprovider tests/test_queue_dispatch_identity.py
      - name: Commit gate and cleanup delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/g1-ikarus-unified-runtime-admission.yml
          git diff --cached --check
          git diff --cached --name-only | grep -Fxq '.github/workflows/g1-ikarus-unified-runtime-admission.yml'
          git diff --cached --name-only | grep -Fxq '.github/workflows/tmp-ikarus-stop-patch.yml'
          git diff --cached --name-only | grep -Fxq '.github/ikarus_stop_patch.py'
          git diff --cached --name-only | grep -Fxq '.github/ikarus_stop_retry'
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "test(ci): admit queue identity regression"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
