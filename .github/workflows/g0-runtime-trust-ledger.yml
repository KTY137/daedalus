name: Gate 0 — runtime trust ledger

on:
  pull_request:
    branches:
      - g0/runtime-conformance-fixtures
    paths:
      - "daedalus/runtimes/**"
      - "daedalus/kernel/runtime_conformance.py"
      - "daedalus/schemas.py"
      - "tests/runtimes/**"
      - ".github/workflows/g0-runtime-trust-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-ledger:
    name: trust-ledger / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q daedalus tests
      - name: Runtime profile, trust-anchor, and ledger tests
        run: >-
          python -m pytest -q
          tests/runtimes/test_runtime_conformance_profiles.py
          tests/runtimes/test_runtime_live_trust_anchor.py
          tests/runtimes/test_runtime_profile_adversarial.py
          tests/runtimes/test_runtime_trust_store.py
          tests/kernel/test_runtime_conformance.py

  isolated-wheel:
    name: isolated wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-runtime-trust-wheel
      - run: /tmp/daedalus-runtime-trust-wheel/bin/pip install dist/*.whl
      - name: Import installed trust authority outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-runtime-trust-wheel/bin/python -c
          "from daedalus.runtimes import RuntimeTrustLedger, RuntimeTrustRecord;
          assert RuntimeTrustLedger and RuntimeTrustRecord"
