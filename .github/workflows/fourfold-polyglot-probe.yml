name: Fourfold polyglot probe

on:
  workflow_dispatch:

concurrency:
  group: fourfold-polyglot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip==26.1.2
      - run: python -m pip install ".[polyglot,root]" pytest==9.1.1
      - run: >-
          python -m pytest -q
          tests/twin/test_extractor_contracts.py
          tests/twin/test_tree_sitter_extractors.py
          tests/twin/test_root_file_extractor.py
      - run: python -c "import daedalus.twin.extractors as e; print(e.registered_language_ids())"

  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tokio-rust
            repository: https://github.com/tokio-rs/tokio.git
            revision: 108d6d3dc038332af2af83957748333091e35b3f
            prefixes: tokio tokio-macros tests
            max_parse_files: 1000
            root_data: false
          - name: spring-java
            repository: https://github.com/spring-projects/spring-framework.git
            revision: eceebb3077dda9e1b19d73c0398ef022cd91f99c
            prefixes: spring-core spring-beans spring-context
            max_parse_files: 1500
            root_data: false
          - name: root-cpp-pyroot
            repository: https://github.com/root-project/root.git
            revision: e2340033ee068808980d9131a271111c6e77dc4f
            prefixes: core io tree bindings/pyroot
            max_parse_files: 1500
            root_data: true
          - name: arrow-cpp-python
            repository: https://github.com/apache/arrow.git
            revision: 85e0b804c4e59613ab663d2967f7ac9731ad3eec
            prefixes: cpp python
            max_parse_files: 1500
            root_data: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip==26.1.2
      - run: python -m pip install ".[polyglot,root]"
      - name: Fetch pinned repository slice
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "${{ matrix.repository }}" external
          git -C external sparse-checkout init --cone
          git -C external sparse-checkout set ${{ matrix.prefixes }}
          git -C external fetch --depth=1 origin "${{ matrix.revision }}"
          git -C external checkout --detach "${{ matrix.revision }}"
      - name: Probe repository shape
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for prefix in ${{ matrix.prefixes }}; do
            args+=(--include-prefix "$prefix")
          done
          python scripts/fourfold_repo_probe.py external \
            --repository-id "${{ matrix.name }}" \
            --source-revision "${{ matrix.revision }}" \
            "${args[@]}" \
            --output "reports/${{ matrix.name }}-shape.json"
          cat "reports/${{ matrix.name }}-shape.json"
      - name: Probe structural syntax
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for prefix in ${{ matrix.prefixes }}; do
            args+=(--include-prefix "$prefix")
          done
          python scripts/fourfold_tree_sitter_probe.py external \
            --repository-id "${{ matrix.name }}" \
            --source-revision "${{ matrix.revision }}" \
            --max-files "${{ matrix.max_parse_files }}" \
            "${args[@]}" \
            --output "reports/${{ matrix.name }}-structural.json"
          cat "reports/${{ matrix.name }}-structural.json"
      - name: Probe ROOT file metadata
        if: ${{ matrix.root_data }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for prefix in ${{ matrix.prefixes }}; do
            args+=(--include-prefix "$prefix")
          done
          python scripts/fourfold_root_file_probe.py external \
            --repository-id "${{ matrix.name }}" \
            --source-revision "${{ matrix.revision }}" \
            "${args[@]}" \
            --output "reports/${{ matrix.name }}-root-data.json"
          cat "reports/${{ matrix.name }}-root-data.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fourfold-probe-${{ matrix.name }}
          path: reports/${{ matrix.name }}-*.json
          if-no-files-found: error
          retention-days: 14
