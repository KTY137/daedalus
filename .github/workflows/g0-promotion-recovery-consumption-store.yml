name: Gate 0 Promotion Recovery Consumption Store

on:
  pull_request:
    branches:
      - g0/promotion-recovery-consumption-registry-linear
    paths:
      - "daedalus/kernel/promotion_recovery_consumption_store.py"
      - "tests/test_promotion_recovery_consumption_store*.py"
      - "scripts/run_promotion_recovery_consumption_store_mutations.py"
      - "docs/work-packets/G0-PRM-25O_PROMOTION_RECOVERY_CONSUMPTION_STORE.*"
      - ".github/workflows/g0-promotion-recovery-consumption-store.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-recovery-consumption-store-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-promotion-recovery-consumption-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-PRM-25O_PROMOTION_RECOVERY_CONSUMPTION_STORE.json
      - run: >-
          python -m pytest -q
          tests/test_promotion_recovery_consumption_store.py
          tests/test_promotion_recovery_consumption_store_review.py
          tests/test_promotion_recovery_consumption_registry.py
          tests/test_promotion_recovery_consumption_registry_review.py
          tests/test_promotion_recovery_consumption_inventory.py
          tests/test_promotion_recovery_consumption_inventory_review.py
          tests/kernel/test_promotion_recovery_consumption.py
          tests/kernel/test_promotion_recovery_consumption_concurrency.py
          tests/kernel/test_promotion_recovery_consumption_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_promotion_recovery_consumption_store_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-promotion-recovery-consumption-store-wheel
      - run: /tmp/daedalus-promotion-recovery-consumption-store-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-promotion-recovery-consumption-store-wheel/bin/python - <<'PY'
          import tempfile
          from pathlib import Path

          from daedalus.kernel.promotion_recovery_consumption_store import (
              PreprovisionedPromotionRecoveryConsumptionLedger,
              initialize_promotion_recovery_consumption_store,
              inspect_promotion_recovery_consumption_store,
          )

          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / "recovery-consumption.sqlite3"
              created = initialize_promotion_recovery_consumption_store(path)
              inspected = inspect_promotion_recovery_consumption_store(path)
              ledger = PreprovisionedPromotionRecoveryConsumptionLedger(path)
              assert created == inspected
              assert ledger.store_status.identity == created.identity
          PY
