name: Gate 0 — Linux host fault runner

on:
  pull_request:
    branches:
      - g0/runtime-fault-attestations
    paths:
      - "daedalus/runtimes/host_fault_runner.py"
      - "daedalus/runtimes/fault_matrix.py"
      - "daedalus/runtimes/fault_attestations.py"
      - "tests/runtimes/test_linux_host_fault_runner.py"
      - "tests/runtimes/test_runtime_fault_catalog.py"
      - "tests/runtimes/test_runtime_fault_attestations.py"
      - ".github/workflows/g0-linux-host-fault-runner.yml"
      - "docs/work-packets/G0-RTC-06H_LINUX_HOST_FAULT_RUNNER.md"
  push:
    branches:
      - g0/linux-host-fault-runner
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-linux-host-fault-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m compileall -q daedalus tests
      - name: Verify host collector and canonical trust composition
        run: >-
          python -m pytest -q
          tests/runtimes/test_linux_host_fault_runner.py
          tests/runtimes/test_runtime_fault_catalog.py
          tests/runtimes/test_runtime_fault_attestations.py
          tests/runtimes/test_runtime_fault_attestation_hardening.py
          tests/runtimes/test_runtime_fault_attestation_receipt.py

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    name: isolated Linux-host fault runner wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-linux-host-fault-wheel
      - run: /tmp/daedalus-linux-host-fault-wheel/bin/pip install dist/*.whl
      - name: Import packaged collector and trust contracts
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-linux-host-fault-wheel/bin/python -c
          "from daedalus.runtimes.host_fault_runner import LinuxHostExecutorBinding, LinuxHostFaultEvidence, load_linux_host_fault_evidence_json, run_linux_host_fault_catalog;
          from daedalus.runtimes.fault_attestations import verify_attested_runtime_fault_matrix;
          from daedalus.runtimes.fault_matrix import RUNTIME_FAULT_CATALOG;
          assert LinuxHostExecutorBinding and LinuxHostFaultEvidence and load_linux_host_fault_evidence_json and run_linux_host_fault_catalog;
          assert verify_attested_runtime_fault_matrix;
          assert sum(row.authority == 'linux-host' for row in RUNTIME_FAULT_CATALOG.scenarios) == 9"
