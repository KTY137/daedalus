name: Runtime workspace export

on:
  pull_request:
    branches:
      - g0/effect-leases
  push:
    branches:
      - g0/runtime-workspace-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Create source archive
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD > CHECKOUT_HEAD
          tar --exclude=.git -czf /tmp/daedalus-runtime-checkout.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-runtime-checkout
          path: /tmp/daedalus-runtime-checkout.tar.gz
          if-no-files-found: error
          retention-days: 1
