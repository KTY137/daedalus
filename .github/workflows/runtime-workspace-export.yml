name: Runtime workspace export

on:
  pull_request:
    branches:
      - g0/effect-leases
  push:
    branches:
      - g0/runtime-workspace-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          set -euo pipefail
          git status --short
          git archive --format=tar.gz --output=/tmp/daedalus-runtime-checkout.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-runtime-checkout
          path: /tmp/daedalus-runtime-checkout.tar.gz
          if-no-files-found: error
          retention-days: 1
