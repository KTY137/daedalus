name: Temporary Ikarus stop patch

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - .github/ikarus_stop_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact canonical stop patch
        run: python .github/ikarus_stop_patch.py
      - name: Install Python test dependencies
        run: python -m pip install -e . pytest
      - name: Compile touched Python surfaces
        run: >-
          python -m py_compile
          daedalus/ikarus_cancellation.py
          daedalus/ikarus_os.py
          daedalus/web_api.py
          tests/test_ikarus_cancellation.py
          tests/test_ikarus_stream.py
          tests/test_ikarus_http_cancellation.py
      - name: Run focused stop tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_ikarus_cancellation.py
          tests/test_ikarus_stream.py
          tests/test_ikarus_http_cancellation.py
          tests/providers/test_openai_compat_cancellation_boundary.py
          tests/providers/test_ollama_native_stream_cancellation.py
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Build shipping cockpit
        run: npm run build --prefix apps/web
      - name: Commit only verified product changes
        run: |
          rm .github/ikarus_stop_patch.py
          git add -A
          git config user.name "KTY"
          git config user.email "kaya.yesilyurt@tu-dortmund.de"
          git commit -m "feat(ikarus): wire canonical JARVIS stop path"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
