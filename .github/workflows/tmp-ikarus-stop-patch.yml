name: Temporary Ikarus stop patch

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - .github/ikarus_stop_patch.py
      - .github/ikarus_stop_retry

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Normalize patch against canonical source layout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/ikarus_stop_patch.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''replace_once(
              "daedalus/web_api.py",
              "from . import core, ikarus_chat, ikarus_os\\n",
              "from . import core, ikarus_cancellation, ikarus_chat, ikarus_os\\n",
          )'''
          new_import = '''replace_once(
              "daedalus/web_api.py",
              "    hierarchy,\\n    ikarus_chat,\\n    runtime_registry,\\n",
              "    hierarchy,\\n    ikarus_cancellation,\\n    ikarus_chat,\\n    runtime_registry,\\n",
          )'''
          if old_import not in text:
              raise SystemExit('expected web_api import patch stanza missing')
          text = text.replace(old_import, new_import, 1)

          old_helper = '''    count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))'''
          new_helper = '''    count = text.count(old)
              stream_duplicate = (
                  count == 2 and path == "daedalus/ikarus_os.py" and (
                      old.startswith("    from .budget import process_guard_boundary_decision") or
                      old.startswith("    host = os.environ.get(\\\"OLLAMA_HOST\\\", DEFAULT_HOST)") or
                      old.startswith("    api_key = os.environ.get(\\\"DEEPSEEK_API_KEY\\\", \\\"\\\")")
                  )
              )
              gate_duplicate = (
                  count == 2 and path == ".github/workflows/g1-ikarus-unified-runtime-admission.yml" and
                  old.startswith("          tests/test_ikarus_stream.py")
              )
              if stream_duplicate:
                  index = text.rfind(old)
                  write(path, text[:index] + new + text[index + len(old):])
                  return
              if gate_duplicate:
                  write(path, text.replace(old, new, 1))
                  return
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))'''
          if old_helper not in text:
              raise SystemExit('expected replace_once helper body missing')
          path.write_text(text.replace(old_helper, new_helper, 1), encoding='utf-8')
          PY
      - name: Apply exact canonical stop patch
        id: patch
        shell: bash
        run: |
          set +e
          python .github/ikarus_stop_patch.py > /tmp/ikarus-stop-patch.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            cp /tmp/ikarus-stop-patch.log .github/ikarus_stop_patch_error.txt
            git add .github/ikarus_stop_patch_error.txt
            git config user.name "KTY"
            git config user.email "kaya.yesilyurt@tu-dortmund.de"
            git commit -m "chore(ikarus): record stop patch staging failure"
            git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
            exit "$code"
          fi
      - name: Install Python test dependencies
        run: python -m pip install -e . pytest
      - name: Compile touched Python surfaces
        run: >-
          python -m py_compile
          daedalus/ikarus_cancellation.py
          daedalus/ikarus_os.py
          daedalus/web_api.py
          tests/test_ikarus_cancellation.py
          tests/test_ikarus_stream.py
          tests/test_ikarus_http_cancellation.py
      - name: Run focused stop tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_ikarus_cancellation.py
          tests/test_ikarus_stream.py
          tests/test_ikarus_http_cancellation.py
          tests/providers/test_openai_compat_cancellation_boundary.py
          tests/providers/test_ollama_native_stream_cancellation.py
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Build shipping cockpit
        run: npm run build --prefix apps/web
      - name: Commit only verified product changes
        run: |
          rm .github/ikarus_stop_patch.py
          rm -f .github/ikarus_stop_retry .github/ikarus_stop_patch_error.txt
          git add -A
          git config user.name "KTY"
          git config user.email "kaya.yesilyurt@tu-dortmund.de"
          git commit -m "feat(ikarus): wire canonical JARVIS stop path"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
