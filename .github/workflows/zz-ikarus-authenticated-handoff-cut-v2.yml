name: Temporary Ikarus authenticated handoff cut v2

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - .github/workflows/zz-ikarus-authenticated-handoff-cut-v2.yml

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: Apply bounded authenticated-handoff admission cut
        run: >-
          python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
      - name: Verify targeted runtime admission tests
        run: |
          python -m py_compile daedalus/ikarus_runtime_role.py daedalus/ikarus_supervisor.py tests/test_ikarus_runtime_role.py
          python -m pytest -q -p no:cacheprovider tests/test_ikarus_runtime_role.py tests/test_ikarus_supervisor_attempt_identity.py
      - name: Commit bounded cut
        run: |
          git config user.name "daedalus-automation"
          git config user.email "daedalus-automation@users.noreply.github.com"
          git add daedalus/ikarus_runtime_role.py daedalus/ikarus_supervisor.py tests/test_ikarus_runtime_role.py .github/workflows/g1-ikarus-unified-runtime-admission.yml
          git diff --cached --check
          git commit -m "feat(ikarus): admit authenticated runtime handoffs"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
