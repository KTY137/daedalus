name: Gate 0 — canonical trust-bundle wire

on:
  pull_request:
    branches:
      - g0/evidence-index-canonical-wire-linear
    paths:
      - "daedalus/gates/__init__.py"
      - "daedalus/gates/trust_bundle.py"
      - "daedalus/gates/trust_bundle_io.py"
      - "tests/gates/test_evidence_trust_bundle.py"
      - "tests/gates/test_evidence_trust_bundle_review.py"
      - "tests/gates/test_evidence_trust_bundle_canonical_wire.py"
      - "scripts/run_trust_bundle_wire_mutations.py"
      - "docs/work-packets/G0-EVD-08F_TRUST_BUNDLE_CANONICAL_WIRE.md"
      - ".github/workflows/g0-trust-bundle-canonical-wire.yml"
  push:
    branches:
      - g0/trust-bundle-canonical-wire-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-trust-bundle-wire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: trust-bundle wire / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: >-
          python -m compileall -q
          daedalus/gates/__init__.py
          daedalus/gates/trust_bundle.py
          daedalus/gates/trust_bundle_io.py
          tests/gates/test_evidence_trust_bundle_canonical_wire.py
          scripts/run_trust_bundle_wire_mutations.py
      - name: Exact-head, index, bundle, release and canonical-wire tests
        run: >-
          python -m pytest -q
          tests/gates/test_exact_head_evidence.py
          tests/gates/test_exact_head_evidence_io.py
          tests/gates/test_exact_head_evidence_canonical_wire.py
          tests/gates/test_evidence_trust_bundle.py
          tests/gates/test_evidence_trust_bundle_review.py
          tests/gates/test_evidence_trust_bundle_canonical_wire.py
          tests/gates/test_gate0_release_assessment.py
          tests/gates/test_gate0_release_assessment_review.py

  mutation:
    name: trust-bundle wire mutation campaign / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python scripts/run_trust_bundle_wire_mutations.py
      - name: Refuse dirty source after mutation restoration
        shell: bash
        run: >-
          git diff --exit-code --
          daedalus/gates/__init__.py
          daedalus/gates/trust_bundle_io.py

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    name: isolated wheel compatibility imports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-trust-wire-wheel
      - run: /tmp/daedalus-trust-wire-wheel/bin/pip install dist/*.whl
      - name: Import package and direct-module strict aliases outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-trust-wire-wheel/bin/python -c
          "import daedalus.gates.trust_bundle as m;
          from daedalus.gates import load_evidence_trust_bundle,
          parse_evidence_trust_bundle;
          assert m.load_evidence_trust_bundle is load_evidence_trust_bundle;
          assert m.parse_evidence_trust_bundle is parse_evidence_trust_bundle"
