name: Gate 0 — unknown outcome reconciliation

on:
  pull_request:
    branches:
      - g0/runtime-trust-contention-fault-linear-v2
    paths:
      - "daedalus/kernel/effect_recovery.py"
      - "daedalus/kernel/effects.py"
      - "configs/schemas/external-effect-observation-v1.schema.json"
      - "tests/fixtures/unknown_outcome_reconciliation_fault_executor.py"
      - "tests/kernel/test_effect_recovery.py"
      - "tests/kernel/test_effect_recovery_hardening.py"
      - "tests/runtimes/test_unknown_outcome_reconciliation_fault_executor.py"
      - "tests/runtimes/test_unknown_outcome_reconciliation_fault_executor_review.py"
      - "docs/work-packets/G0-RTC-06P_UNKNOWN_OUTCOME_RECONCILIATION.md"
      - ".github/workflows/g0-unknown-outcome-reconciliation.yml"
  push:
    branches:
      - g0/unknown-outcome-reconciliation-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-unknown-outcome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q daedalus tests
      - name: Parse recovery JSON schema
        run: >-
          python -c
          "import json, pathlib;
          p=pathlib.Path('configs/schemas/external-effect-observation-v1.schema.json');
          data=json.loads(p.read_text(encoding='utf-8'));
          assert data['additionalProperties'] is False;
          assert data['properties']['status']['const'] == 'acknowledged'"
      - name: Verify recovery and counter-review contracts
        run: >-
          python -m pytest -q
          tests/kernel/test_effect_leases.py
          tests/kernel/test_effect_recovery.py
          tests/kernel/test_effect_recovery_hardening.py
          tests/runtimes/test_unknown_outcome_reconciliation_fault_executor.py
          tests/runtimes/test_unknown_outcome_reconciliation_fault_executor_review.py
          tests/runtimes/test_linux_host_fault_runner.py
          tests/runtimes/test_linux_host_fault_runner_review.py
          tests/runtimes/test_runtime_fault_catalog.py
          tests/runtimes/test_runtime_fault_attestations.py
          tests/runtimes/test_runtime_fault_attestation_hardening.py
          tests/runtimes/test_runtime_fault_attestation_receipt.py

  retained-host-evidence:
    name: retained untrusted unknown-outcome evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Execute exact-head crash reconciliation fault
        run: >-
          python tests/fixtures/unknown_outcome_reconciliation_fault_executor.py
          --source-revision "${GITHUB_SHA}"
          --output-dir reports/unknown-outcome
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: untrusted-unknown-outcome-${{ github.sha }}
          path: reports/unknown-outcome/*
          if-no-files-found: error

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  package:
    name: package / isolated wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-effect-recovery-wheel
      - run: /tmp/daedalus-effect-recovery-wheel/bin/pip install dist/*.whl
      - name: Import recovery authority outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-effect-recovery-wheel/bin/python -c
          "from daedalus.kernel.effect_recovery import ExternalEffectObservation, reconcile_unknown_effect;
          assert ExternalEffectObservation;
          assert reconcile_unknown_effect"
