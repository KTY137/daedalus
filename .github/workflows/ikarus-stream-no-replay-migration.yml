name: Ikarus stream no-replay migration

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - ".github/workflows/ikarus-stream-no-replay-migration.yml"
      - "tools/_ikarus_stream_no_replay_migration.py"

permissions:
  contents: write

concurrency:
  group: ikarus-stream-no-replay-migration
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact canonical Ikarus line
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest

      - name: Apply bounded no-replay migration
        run: python tools/_ikarus_stream_no_replay_migration.py

      - name: Compile changed Python surface
        run: >-
          python -m py_compile
          daedalus/ikarus_os.py
          tests/test_ikarus_stream.py
          tests/test_ikarus_os_boundary.py

      - name: Run focused stream regressions
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_ikarus_stream.py

      - name: Prove an attempted empty stream cannot re-enter blocking chat
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("daedalus/ikarus_os.py").read_text(encoding="utf-8")
          tests = Path("tests/test_ikarus_stream.py").read_text(encoding="utf-8")
          tail = source[source.index("def _ask_stream_inner"):]
          start = tail.index("    if not text:")
          end = tail.index("\n    block = _ctx_envelope_block(ctx)", start + 1)
          empty = tail[start:end]
          assert "_chat(" not in empty, empty
          assert "stream_interrupted=True" in empty
          assert "not automatically retried" in empty
          assert "test_empty_stream_halts_without_replaying_provider" in tests
          assert "blocking.assert_not_called()" in tests
          print("attempted-stream no-replay invariant: OK")
          PY

      - name: Remove one-shot migration machinery before conformance scan
        run: git rm tools/_ikarus_stream_no_replay_migration.py .github/workflows/ikarus-stream-no-replay-migration.yml

      - name: Run Ikarus effect-boundary regression after helper removal
        run: python -m pytest -q -p no:cacheprovider tests/test_ikarus_os_boundary.py

      - name: Commit verified no-replay repair
        run: |
          git config user.name "Daedalus Ikarus CI"
          git config user.email "actions@users.noreply.github.com"
          git add daedalus/ikarus_os.py tests/test_ikarus_stream.py docs/work-packets/G1-IKARUS-14_STREAM_INTERRUPTION_NO_REPLAY.md
          git diff --cached --check
          git commit -m "fix(ikarus): terminate empty streams without provider replay"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
