# Exact-head CI evidence for G0-RPT-08A.
name: Gate 0 — exact-head evidence index

on:
  pull_request:
    branches:
      - g0/unknown-outcome-reconciliation-linear
    paths:
      - "daedalus/gates/**"
      - "daedalus/schemas.py"
      - "tests/gates/**"
      - "docs/work-packets/G0-RPT-08A_EXACT_HEAD_EVIDENCE_INDEX.md"
      - ".github/workflows/g0-exact-head-evidence.yml"
  push:
    branches:
      - g0/exact-head-evidence-index-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-exact-head-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-index:
    name: evidence-index / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q daedalus tests
      - name: Exact-head, stale, malformed, and adversarial evidence tests
        run: >-
          python -m pytest -q
          tests/gates/test_gate_report.py
          tests/gates/test_exact_head_evidence.py
          tests/gates/test_exact_head_evidence_strict.py
          tests/gates/test_exact_head_evidence_io.py
          tests/test_effect_boundary.py

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  isolated-wheel:
    name: isolated wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-evidence-wheel
      - run: /tmp/daedalus-evidence-wheel/bin/pip install dist/*.whl
      - name: Import installed evidence contracts outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-evidence-wheel/bin/python -c
          "from daedalus.gates import GateEvidenceIndex,
          load_gate_evidence_index, strict_mechanical_blockers;
          assert GateEvidenceIndex.CONTRACT_TYPE ==
          'daedalus-gate-evidence-index/1';
          assert load_gate_evidence_index;
          assert strict_mechanical_blockers"
