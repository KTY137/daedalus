# Exact-head CI evidence for G0-RPT-08A.
name: Gate 0 — exact-head evidence index

on:
  pull_request:
    branches:
      - g0/effect-entrypoint-centralization
    paths:
      - "daedalus/gates/**"
      - "daedalus/schemas.py"
      - "tests/gates/**"
      - ".github/workflows/g0-exact-head-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-index:
    name: evidence-index / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m compileall -q daedalus tests
      - name: Exact-head, stale, malformed, and adversarial evidence tests
        run: >-
          python -m pytest -q
          tests/gates/test_gate_report.py
          tests/gates/test_exact_head_evidence.py
          tests/gates/test_exact_head_evidence_strict.py
          tests/test_effect_boundary.py

  isolated-wheel:
    name: isolated wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-wheel
      - run: /tmp/daedalus-wheel/bin/pip install dist/*.whl
      - name: Import installed evidence contracts outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-wheel/bin/python -c
          "from daedalus.gates import GateEvidenceIndex,
          strict_mechanical_blockers;
          assert GateEvidenceIndex.CONTRACT_TYPE ==
          'daedalus-gate-evidence-index/1'"
