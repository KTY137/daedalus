name: Gate 0 Event Store Writer Inventory

on:
  pull_request:
    branches:
      - g0/event-store-writer-factory-linear
    paths:
      - "daedalus/spine/writer_inventory.py"
      - "daedalus/spine/__init__.py"
      - "scripts/report_spine_writer_inventory.py"
      - "scripts/run_spine_writer_inventory_mutations.py"
      - "configs/schemas/event-store-writer-inventory-v1.schema.json"
      - "tests/test_spine_writer_inventory.py"
      - "tests/test_spine_writer_inventory_review.py"
      - "tests/test_spine_writer_inventory_cli.py"
      - "tests/test_spine_writer_inventory_schema.py"
      - "docs/work-packets/G0-ES-17_EVENT_STORE_WRITER_INVENTORY.md"
      - "docs/work-packets/G0-ES-17_EVENT_STORE_WRITER_INVENTORY.json"
      - ".github/workflows/g0-event-store-writer-inventory.yml"
  push:
    branches:
      - g0/event-store-writer-inventory-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-event-store-writer-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool configs/schemas/event-store-writer-inventory-v1.schema.json
      - run: python -m json.tool docs/work-packets/G0-ES-17_EVENT_STORE_WRITER_INVENTORY.json
      - run: >-
          python -m pytest -q
          tests/test_spine_writer_inventory.py
          tests/test_spine_writer_inventory_review.py
          tests/test_spine_writer_inventory_cli.py
          tests/test_spine_writer_inventory_schema.py
          tests/test_spine_gate0_writer_factory.py
          tests/test_spine_gate0_writer_factory_review.py
          tests/test_spine_gate0_durability.py
          tests/test_spine_gate0_durability_review.py
          tests/test_spine_ledger.py
          tests/kernel/test_attempt_durability_admission.py
          tests/kernel/test_attempt_durability_admission_review.py
          tests/kernel/test_isolated_attempt_lifecycle.py
          tests/kernel/test_isolated_attempt_lifecycle_adversarial.py
          tests/kernel/test_isolated_attempt_lifecycle_review.py
          tests/kernel/test_isolated_attempt_spine_wire_review.py
      - name: Produce exact-head inventory
        run: >-
          python scripts/report_spine_writer_inventory.py .
          --source-revision "${{ github.sha }}"
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.seed == '0' }}
        run: python scripts/run_spine_writer_inventory_mutations.py
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-writer-inventory-wheel
      - run: /tmp/daedalus-writer-inventory-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-writer-inventory-wheel/bin/python - <<'PY'
          from daedalus.spine import (
              WriterCallsite,
              WriterInventory,
              WriterInventoryError,
              scan_event_store_writers,
          )

          assert WriterCallsite.__module__ == "daedalus.spine.writer_inventory"
          assert WriterInventory.__module__ == "daedalus.spine.writer_inventory"
          assert WriterInventoryError.__module__ == "daedalus.spine.writer_inventory"
          assert callable(scan_event_store_writers)
          PY
