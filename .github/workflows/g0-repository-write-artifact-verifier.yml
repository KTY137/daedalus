name: Gate 0 Repository-Write Artifact Byte Verification

on:
  pull_request:
    branches:
      - g0/repository-write-evidence-index-v2-linear
    paths:
      - "daedalus/gates/repository_write_artifact_verifier.py"
      - "configs/schemas/repository-write-artifact-verification-receipt-v1.schema.json"
      - "scripts/run_repository_write_artifact_verifier_mutations.py"
      - "tests/gates/test_repository_write_artifact_verifier*.py"
      - "docs/work-packets/G0-GR-22_REPOSITORY_WRITE_ARTIFACT_BYTE_VERIFICATION.*"
      - ".github/workflows/g0-repository-write-artifact-verifier.yml"
  push:
    branches:
      - g0/repository-write-artifact-verifier-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-repository-write-artifact-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool configs/schemas/repository-write-artifact-verification-receipt-v1.schema.json
      - run: python -m json.tool docs/work-packets/G0-GR-22_REPOSITORY_WRITE_ARTIFACT_BYTE_VERIFICATION.json
      - run: python -m pytest -q tests/gates/test_repository_write_artifact_verifier.py tests/gates/test_repository_write_artifact_verifier_types.py tests/gates/test_repository_write_artifact_verifier_malformed.py tests/gates/test_repository_write_artifact_verifier_review.py tests/gates/test_repository_write_artifact_verifier_schema.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_repository_write_artifact_verifier_mutations.py

  predecessor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/gates/test_repository_write_evidence.py tests/gates/test_repository_write_evidence_provenance.py tests/gates/test_repository_write_evidence_review.py tests/gates/test_repository_write_evidence_schema.py tests/gates/test_gate_report_v3.py tests/gates/test_gate_report_v3_bounds.py tests/gates/test_gate_report_v3_drift.py tests/gates/test_gate_report_v3_review.py tests/gates/test_gate_report_v3_schema.py tests/gates/test_gate_report_v3_cli.py tests/gates/test_repository_write_inventory_v2.py tests/gates/test_repository_write_inventory_v2_review.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-repository-write-verifier-wheel
      - run: /tmp/daedalus-repository-write-verifier-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        run: /tmp/daedalus-repository-write-verifier-wheel/bin/python -c "from daedalus.gates.repository_write_artifact_verifier import RepositoryWriteArtifactVerificationReceipt, verify_repository_write_artifact; assert RepositoryWriteArtifactVerificationReceipt is not None and callable(verify_repository_write_artifact)"
