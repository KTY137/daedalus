name: Temporary Ikarus Codex cancellation cut v2

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - ".github/workflows/_tmp_ikarus_codex_cancel_cut_v2.yml"

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - name: Apply bounded Codex Stop cut
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("daedalus/ikarus_os.py")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"def _codex\(message: str, effort: str \| None = None, model: str \| None = None,\n"
              r"           context: str = \"\", \*, timeout_s: float = 150\.0\) -> str \| None:\n"
              r".*?\n\n\n# --------------------------------------------------------------------------- #\n"
              r"# Streaming brain — same routing as ask\(\), tokens pushed as they are produced   #",
              re.S,
          )
          replacement = '''def _codex(message: str, effort: str | None = None, model: str | None = None,
                     context: str = "", *, timeout_s: float = 150.0,
                     cancellation: CancellationSignal | None = None) -> str | None:
              """Codex CLI chat brain with exact-child cancellation ownership.

              Codex has no verified token-frame format in this integration, so the
              streaming surface still receives at most one whole-answer delta. The
              blocking CLI wait is nevertheless cancellable: this call owns the exact
              ``Popen`` child, polls the canonical ``CancellationSignal``, and delegates
              termination evidence to ``terminate_owned_subprocess``. No process-table
              scan, replay, or vendor-side billing claim is introduced.

              The read-only sandbox, neutral cwd and ``--output-last-message`` capture
              remain the same contract used by the previous blocking implementation.
              """
              if cancellation is not None and type(cancellation) is not CancellationSignal:
                  raise TypeError("cancellation must be an exact CancellationSignal")
              if cancellation is not None and cancellation.cancelled():
                  raise ProviderCancelled("cancelled before Ikarus spawned Codex CLI")

              path = shutil.which("codex")
              if not path:
                  return None
              _provider_start("codex", endpoint=path, model=model)
              prompt = _claude_prompt(message, effort, context)
              proc = None
              try:
                  with tempfile.TemporaryDirectory(prefix="daedalus-codex-chat-") as td:
                      message_path = Path(td) / "last_message.txt"
                      neutral_cwd = _neutral_cwd()
                      args = [
                          path, "exec",
                          "--cd", neutral_cwd,
                          "--sandbox", "read-only",
                          "--skip-git-repo-check",
                          "--color", "never",
                          "--output-last-message", str(message_path),
                      ]
                      if model:
                          args += ["--model", model]
                      args.append(prompt)
                      proc = subprocess.Popen(
                          args,
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                          stdin=subprocess.DEVNULL,
                          cwd=neutral_cwd,
                      )
                      deadline = _time.monotonic() + max(0.0, float(timeout_s))
                      while proc.poll() is None:
                          if cancellation is not None and cancellation.cancelled():
                              receipt = terminate_owned_subprocess(
                                  cancellation, proc, grace_s=0.5
                              )
                              if receipt.was_running:
                                  raise ProviderCancelled(
                                      "Codex CLI cancelled; local child termination was "
                                      "requested "
                                      f"(process_exited={receipt.process_exited})"
                                  )
                              break
                          remaining = deadline - _time.monotonic()
                          if remaining <= 0:
                              try:
                                  proc.kill()
                              except ProcessLookupError:
                                  pass
                              try:
                                  proc.wait(timeout=5.0)
                              except subprocess.TimeoutExpired:
                                  pass
                              return None
                          try:
                              proc.wait(timeout=min(0.05, remaining))
                          except subprocess.TimeoutExpired:
                              continue
                      return (
                          (message_path.read_text(encoding="utf-8") or "").strip()
                          or None
                      )
              except ProviderCancelled:
                  raise
              except (OSError, subprocess.SubprocessError, TypeError, ValueError):
                  return None
              finally:
                  if proc is not None:
                      try:
                          if proc.poll() is None:
                              proc.kill()
                          proc.wait(timeout=5.0)
                      except Exception:
                          pass


          def _codex_stream(message: str, effort: str | None = None,
                            model: str | None = None, context: str = "", *,
                            timeout_s: float = 150.0,
                            cancellation: CancellationSignal | None = None):
              """Cancellable Codex adapter for ``ask_stream`` without fake token frames."""
              reply = _codex(
                  message, effort, model, context,
                  timeout_s=timeout_s, cancellation=cancellation,
              )
              if reply:
                  yield reply


          # --------------------------------------------------------------------------- #
          # Streaming brain — same routing as ask(), tokens pushed as they are produced   #'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one _codex block, replaced {count}")

          old_comment = '''    # Codex CLI has no verified streaming JSON frame format (unlike Claude's,
              # confirmed against 2.1.201 -- see _claude_stream's comment), so an
              # unverified parser here risks yielding garbled deltas. It deliberately
              # stays on the blocking path via the `streamer is None` fallback below,
              # where `ask()` -> `_llm()` still answers it correctly, just without
              # per-token streaming. An unconfigured DeepSeek (missing key) falls
              # through the same way on purpose: the blocking call produces the clear
              # "not set up" reply via `_llm()`'s pre-flight check instead of this
              # function duplicating it.
          '''
          new_comment = (
              '    elif p in _CODEX:\n'
              '        model_used = model or os.environ.get("CODEX_MODEL", "") or "codex"\n'
              '        ctx = _project_context(project, message, lane="untrusted")\n'
              '        streamer = _codex_stream(\n'
              '            message, effort, model or os.environ.get("CODEX_MODEL", ""),\n'
              '            _merge_model_context(history, ctx.text),\n'
              '            timeout_s=selection.timeout_s, cancellation=cancellation)\n'
              '        # No unverified Codex token parser: this emits at most one whole-answer\n'
              '        # delta, but the owned CLI wait is cancellable and cannot auto-replay.\n'
              '    # An unconfigured DeepSeek (missing key) still falls through to the\n'
              '    # blocking setup-error path below so the existing clear remedy is kept.\n'
          )
          if old_comment not in text:
              raise SystemExit("Codex streaming fallback marker changed")
          text = text.replace(old_comment, new_comment, 1)
          path.write_text(text, encoding="utf-8")

          test = Path("tests/test_ikarus_codex_cancellation.py")
          if test.exists():
              raise SystemExit(f"{test} already exists; refusing to overwrite")
          test.write_text(r'''"""Regression tests for the Codex CLI leg of canonical Ikarus Stop."""
          from __future__ import annotations

          import subprocess as stdlib_subprocess
          import sys
          import threading
          import types
          from unittest import mock

          import pytest

          from daedalus import ikarus_os
          from daedalus.ikarus_cancellation import CancellationSignal
          from daedalus.providers._openai_compat import ProviderCancelled


          def test_precancelled_codex_refuses_before_resolution_admission_or_spawn() -> None:
              signal = CancellationSignal("codex-pre-cancel-0001")
              assert signal.cancel() is True
              with mock.patch.object(ikarus_os.shutil, "which") as which, \
                   mock.patch.object(ikarus_os, "_provider_start") as provider_start, \
                   mock.patch.object(ikarus_os.subprocess, "Popen") as popen:
                  with pytest.raises(ProviderCancelled, match="before Ikarus spawned Codex CLI"):
                      list(ikarus_os._codex_stream("hello", cancellation=signal))
              which.assert_not_called()
              provider_start.assert_not_called()
              popen.assert_not_called()


          def test_codex_rejects_duck_typed_cancellation_before_resolution() -> None:
              class FakeSignal:
                  request_id = "codex-fake-signal"
                  def cancelled(self) -> bool:
                      return False
              with mock.patch.object(ikarus_os.shutil, "which") as which, \
                   mock.patch.object(ikarus_os, "_provider_start") as provider_start:
                  with pytest.raises(TypeError, match="exact CancellationSignal"):
                      list(ikarus_os._codex_stream("hello", cancellation=FakeSignal()))
              which.assert_not_called()
              provider_start.assert_not_called()


          def _blocking_codex_proxy(monkeypatch, *, sleep_s: float = 60.0):
              spawned = threading.Event()
              holder: dict[str, object] = {}
              def spawn(_args, **kwargs):
                  holder["argv"] = list(_args)
                  child = stdlib_subprocess.Popen(
                      [sys.executable, "-u", "-c", f"import time; time.sleep({sleep_s})"],
                      **kwargs,
                  )
                  holder["process"] = child
                  spawned.set()
                  return child
              proxy = types.SimpleNamespace(
                  Popen=spawn,
                  DEVNULL=stdlib_subprocess.DEVNULL,
                  TimeoutExpired=stdlib_subprocess.TimeoutExpired,
                  SubprocessError=stdlib_subprocess.SubprocessError,
              )
              monkeypatch.setattr(ikarus_os, "subprocess", proxy)
              monkeypatch.setattr(ikarus_os.shutil, "which", lambda _name: "/safe/codex")
              monkeypatch.setattr(ikarus_os, "_provider_start", lambda *args, **kwargs: None)
              return spawned, holder


          def test_cancellation_terminates_real_codex_child_while_wait_is_blocked(monkeypatch) -> None:
              signal = CancellationSignal("codex-live-cancel-0001")
              spawned, holder = _blocking_codex_proxy(monkeypatch)
              outcome: dict[str, BaseException] = {}
              def consume() -> None:
                  try:
                      list(ikarus_os._codex_stream("hello", timeout_s=30.0, cancellation=signal))
                  except BaseException as exc:
                      outcome["exception"] = exc
              worker = threading.Thread(target=consume, name="test-codex-stream-consumer")
              worker.start()
              assert spawned.wait(3.0), "Codex child was never spawned"
              assert signal.cancel() is True
              worker.join(5.0)
              child = holder["process"]
              assert isinstance(child, stdlib_subprocess.Popen)
              try:
                  assert not worker.is_alive(), "cancellation did not unblock Codex"
                  assert isinstance(outcome.get("exception"), ProviderCancelled)
                  assert child.poll() is not None, "request returned while Codex child was live"
                  argv = holder["argv"]
                  assert "--sandbox" in argv and argv[argv.index("--sandbox") + 1] == "read-only"
                  assert "--output-last-message" in argv
                  assert "--skip-git-repo-check" in argv
              finally:
                  if child.poll() is None:
                      child.kill()
                      child.wait(timeout=5.0)


          def test_codex_timeout_kills_owned_child_instead_of_leaking(monkeypatch) -> None:
              spawned, holder = _blocking_codex_proxy(monkeypatch)
              result = ikarus_os._codex("hello", timeout_s=0.08)
              assert spawned.is_set()
              child = holder["process"]
              assert isinstance(child, stdlib_subprocess.Popen)
              try:
                  assert result is None
                  assert child.poll() is not None
              finally:
                  if child.poll() is None:
                      child.kill()
                      child.wait(timeout=5.0)
          ''', encoding="utf-8")
          PY
      - name: Compile touched code
        run: python -m py_compile daedalus/ikarus_os.py tests/test_ikarus_codex_cancellation.py
      - name: Run Stop regression slice
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_ikarus_codex_cancellation.py
          tests/test_ikarus_claude_stream_cancellation.py
          tests/test_ikarus_cancellation.py
          tests/test_ikarus_http_cancellation.py
          tests/test_ikarus_stream.py
      - name: Commit verified product cut and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/_tmp_ikarus_codex_cancel_cut.yml
          rm .github/workflows/_tmp_ikarus_codex_cancel_cut_v2.yml
          git config user.name "KTY"
          git config user.email "kaya.yesilyurt@tu-dortmund.de"
          git add daedalus/ikarus_os.py tests/test_ikarus_codex_cancellation.py .github/workflows/_tmp_ikarus_codex_cancel_cut.yml .github/workflows/_tmp_ikarus_codex_cancel_cut_v2.yml
          git diff --cached --check
          git commit -m "feat(ikarus): terminate Codex child on stop"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
