name: Apply Iron Plan revision 3

on:
  pull_request:
    branches:
      - g0/fourfold-evidence-binding
    paths:
      - ".daedalus-bootstrap/g0-plan-amend.patch"
      - ".github/workflows/apply-g0-plan-amendment.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'g0/sealed-promotion-runtime-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply accepted amendment atomically
        shell: bash
        run: |
          set -euo pipefail
          echo "46a91c8876407d8aaa7e03033e087bbe632b13d8faf86b1175f1f86efa1e0f06  .daedalus-bootstrap/g0-plan-amend.patch" | sha256sum -c -
          git apply --check .daedalus-bootstrap/g0-plan-amend.patch
          git apply .daedalus-bootstrap/g0-plan-amend.patch
          rm -rf .daedalus-bootstrap
          rm -f .github/workflows/apply-g0-plan-amendment.yml
          python tools/iron_plan_guard.py verify
          git config user.name "daedalus-gate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m $'docs(plan): accept sealed promotion and bounded Gate-1 rehearsal\n\nIron-Plan: amendment\nIron-Gate: 0'
          python tools/iron_plan_guard.py verify-base "${{ github.event.pull_request.base.sha }}"
          git push origin HEAD:g0/sealed-promotion-runtime-sandbox
