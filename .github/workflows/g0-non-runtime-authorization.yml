name: Gate 0 — non-runtime effect authorization

on:
  pull_request:
    branches:
      - g0/release-assessment-linear
    paths:
      - "daedalus/kernel/authorization.py"
      - "daedalus/kernel/__init__.py"
      - "tests/kernel/test_effect_authorization.py"
      - "scripts/run_non_runtime_authorization_mutations.py"
      - "docs/work-packets/G0-EFX-09A_NON_RUNTIME_AUTHORIZATION.md"
      - ".github/workflows/g0-non-runtime-authorization.yml"
  push:
    branches:
      - g0/generic-effect-authorization-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-non-runtime-authorization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: authorization / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m compileall -q daedalus tests scripts
      - name: Focused malformed, stale, bypass and counter-review tests
        run: >-
          python -m pytest -q
          tests/kernel/test_effect_leases.py
          tests/kernel/test_effect_authorization.py
      - name: Bounded mutation campaign
        run: python scripts/run_non_runtime_authorization_mutations.py

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    name: isolated wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-authorization-wheel
      - run: /tmp/daedalus-authorization-wheel/bin/pip install dist/*.whl
      - name: Import installed authorization outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-authorization-wheel/bin/python -c
          "from daedalus.kernel import NonRuntimeEffectAuthorization;
          assert NonRuntimeEffectAuthorization"
