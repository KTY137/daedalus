name: Gate 0 Promotion Effect Rows

on:
  pull_request:
    branches:
      - g0/promotion-manager-wiring-linear
    paths:
      - "daedalus/spine/promotion_effect_rows.py"
      - "tests/kernel/test_promotion_effect_rows*.py"
      - "scripts/run_promotion_effect_rows_mutations.py"
      - "docs/work-packets/G0-PRM-25A_PROMOTION_EXECUTION_ROW_DESCRIPTORS.*"
      - ".github/workflows/g0-promotion-effect-rows.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-ledger-inventory-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-promotion-effect-rows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-PRM-25A_PROMOTION_EXECUTION_ROW_DESCRIPTORS.json
      - run: >-
          python -m pytest -q
          tests/kernel/test_promotion_effect_rows.py
          tests/kernel/test_promotion_effect_rows_review.py
          tests/kernel/test_promotion_effect_inventory.py
          tests/kernel/test_promotion_manager_live_wiring.py
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.seed == '0' }}
        run: python scripts/run_promotion_effect_rows_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-promotion-rows-wheel
      - run: /tmp/daedalus-promotion-rows-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-promotion-rows-wheel/bin/python - <<'PY'
          from daedalus.spine.effect_boundary import (
              Effect,
              EntrypointSpec,
              Surface,
              Wiring,
          )
          from daedalus.spine.promotion_effect_rows import (
              PROMOTION_EXECUTION_ROW_DESCRIPTORS,
              materialize_promotion_execution_rows,
          )

          rows = materialize_promotion_execution_rows(
              entrypoint_spec=EntrypointSpec,
              surface_values={value.value: value for value in Surface},
              effect_values={value.value: value for value in Effect},
              wiring_values={value.value: value for value in Wiring},
          )
          assert len(PROMOTION_EXECUTION_ROW_DESCRIPTORS) == 3
          assert len(rows) == 3
          assert all(row.wiring is Wiring.LOCAL_GUARDS for row in rows)
          PY
