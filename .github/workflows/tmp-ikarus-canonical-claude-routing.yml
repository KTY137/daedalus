name: tmp-ikarus-canonical-claude-routing

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest
      - name: Apply bounded production and regression cut
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          core_path = Path('daedalus/core.py')
          text = core_path.read_text(encoding='utf-8')

          old_availability = dedent('''\
          def _availability_from_doctor() -> dict[str, bool]:
              from .doctor import check

              ready = check()
              return {
                  "claude_cli": bool(ready.get("claude_cli")),
                  "ollama": bool(ready.get("can_offload_local")),
                  "deepseek": bool(ready.get("deepseek_key")),
                  "codex_cli": bool(ready.get("codex_cli")),
              }
          ''')
          new_availability = dedent('''\
          def _availability_from_doctor() -> dict[str, bool]:
              from .doctor import check
              from .providers import _availability_probe

              ready = check()
              claude_dispatch_ready, _ = _availability_probe("claude_cli")
              return {
                  # Executable discovery is inventory, not dispatch authority. Do
                  # not let Kairos route onto a provider the canonical effect seam
                  # must refuse; this keeps automatic/local routing aligned with
                  # the same readiness truth exposed by /api/providers/status.
                  "claude_cli": bool(
                      ready.get("claude_cli") and claude_dispatch_ready
                  ),
                  "ollama": bool(ready.get("can_offload_local")),
                  "deepseek": bool(ready.get("deepseek_key")),
                  "codex_cli": bool(ready.get("codex_cli")),
              }
          ''')
          if old_availability not in text:
              raise SystemExit('availability seam changed; refusing blind patch')
          text = text.replace(old_availability, new_availability, 1)

          start = text.index('def _ask_claude_report(payload: dict[str, Any]) -> dict[str, Any]:')
          end = text.index('\n\ndef local_only_failure_report', start)
          replacement = dedent('''\
          def _ask_claude_report(payload: dict[str, Any]) -> dict[str, Any]:
              """Refuse the legacy queue fallback before any provider invocation.

              A serialized bridge payload is intent, not an in-memory runtime/effect
              capability. ``ask_claude`` correctly requires an exact
              ``ClaudeSealedInvocationBundle``; this legacy file-bridge seam owns no
              such bundle and must not probe the provider and then catch the expected
              authorization exception. Claude becomes runnable here only after the
              canonical Mission/Attempt runtime composition root supplies that bundle.
              """
              return {
                  "request": payload,
                  "bridge_status": "failed",
                  "lane": "claude",
                  "error": (
                      "Claude dispatch is blocked before provider invocation: the "
                      "legacy queue caller does not own the exact "
                      "ClaudeSealedInvocationBundle required by the canonical runtime "
                      "boundary. Route Claude through Ikarus' Mission/Attempt runtime "
                      "composition root."
                  ),
              }
          ''')
          text = text[:start] + replacement + text[end:]
          core_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_dynamic.py')
          tests = test_path.read_text(encoding='utf-8')
          start = tests.index('    def test_claude_lane_calls_ask_claude_not_offload(self):')
          end = tests.index('\n    def test_unknown_or_missing_lane_fails_closed_not_claude', start)
          method = dedent('''\
          def test_claude_lane_refuses_before_ambient_provider_invocation(self):
              with tempfile.TemporaryDirectory() as d:
                  tmp = Path(d)
                  req = self._write_request(tmp, lane="claude")
                  with (
                      patch.object(file_bridge, "INBOX", tmp / "inbox"),
                      patch.object(file_bridge, "ARCHIVE", tmp / "archive"),
                      patch.object(file_bridge, "record_from_bridge_report", lambda r: None),
                      patch(
                          "daedalus.core.ask_claude",
                          side_effect=AssertionError("unsealed queue caller must not invoke Claude"),
                      ) as ask,
                      patch(
                          "daedalus.offload.offload",
                          side_effect=AssertionError("offload must not run on the claude lane"),
                      ) as off,
                  ):
                      out_path = file_bridge.process_request(req)
                  ask.assert_not_called()
                  off.assert_not_called()
                  report = json.loads(out_path.read_text(encoding="utf-8"))
              self.assertEqual(report["bridge_status"], "failed")
              self.assertEqual(report["lane"], "claude")
              self.assertIn("ClaudeSealedInvocationBundle", report["error"])
              self.assertIn("blocked before provider invocation", report["error"])
          ''')
          tests = tests[:start] + indent(method, '    ') + tests[end:]

          start = tests.index('    def test_local_lane_ineligible_falls_through_to_claude(self):')
          end = tests.index('\n    def test_local_only_lane_never_falls_through_to_claude', start)
          method = dedent('''\
          def test_local_lane_ineligible_refuses_unsealed_claude_fallback(self):
              with tempfile.TemporaryDirectory() as d:
                  tmp = Path(d)
                  req = self._write_request(tmp, lane="local")
                  doctor_ready = {
                      "claude_cli": True,
                      "can_offload_local": True,
                      "deepseek_key": False,
                      "codex_cli": False,
                  }
                  # Force this legacy scheduler fixture to reject the local bench.
                  decision = SimpleNamespace(
                      provider="claude_cli",
                      persona="Adam",
                      mode="advisory",
                      reason="senior lane",
                  )
                  with (
                      patch.object(file_bridge, "INBOX", tmp / "inbox"),
                      patch.object(file_bridge, "ARCHIVE", tmp / "archive"),
                      patch.object(file_bridge, "record_from_bridge_report", lambda r: None),
                      patch("daedalus.doctor.check", return_value=doctor_ready),
                      patch("daedalus.providers._availability_probe", return_value=(True, "")),
                      patch(
                          "daedalus.kairos.scheduler.route_and_select",
                          return_value=({"name": "hardware-dev"}, decision),
                      ),
                      patch(
                          "daedalus.offload.offload",
                          side_effect=AssertionError("offload must not run for a senior-lane route"),
                      ) as off,
                      patch(
                          "daedalus.core.ask_claude",
                          side_effect=AssertionError("unsealed fallback must not invoke Claude"),
                      ) as ask,
                  ):
                      out_path = file_bridge.process_request(req)
                  off.assert_not_called()
                  ask.assert_not_called()
                  report = json.loads(out_path.read_text(encoding="utf-8"))
              self.assertEqual(report["lane"], "claude")
              self.assertEqual(report["bridge_status"], "failed")
              self.assertIn("ClaudeSealedInvocationBundle", report["error"])
          ''')
          tests = tests[:start] + indent(method, '    ') + tests[end:]
          test_path.write_text(tests, encoding='utf-8')

          gate_path = Path('tests/test_runtime_registry_claude_shim.py')
          gate = gate_path.read_text(encoding='utf-8')
          if 'test_core_claude_fallback_never_invokes_unsealed_public_bridge' in gate:
              raise SystemExit('regression already present')
          addition = dedent('''\

          def test_ikarus_scheduler_claude_availability_requires_canonical_dispatch(monkeypatch) -> None:
              monkeypatch.setattr(
                  "daedalus.doctor.check",
                  lambda: {
                      "claude_cli": True,
                      "can_offload_local": True,
                      "deepseek_key": False,
                      "codex_cli": False,
                  },
              )
              with mock.patch(
                  "daedalus.providers._availability_probe",
                  return_value=(False, "inventory_only"),
              ) as probe:
                  availability = core._availability_from_doctor()

              assert availability["claude_cli"] is False
              assert availability["ollama"] is True
              probe.assert_called_once_with("claude_cli")


          def test_core_claude_fallback_never_invokes_unsealed_public_bridge(monkeypatch) -> None:
              monkeypatch.setattr(
                  core,
                  "ask_claude",
                  mock.Mock(side_effect=AssertionError("ambient Claude invocation is forbidden")),
              )
              payload = {
                  "objective": "inspect runtime seam",
                  "repo_root": "/repo",
                  "paths": [],
                  "model": "sonnet",
                  "lane": "claude",
              }

              report = core._ask_claude_report(payload)

              core.ask_claude.assert_not_called()
              assert report["bridge_status"] == "failed"
              assert report["lane"] == "claude"
              assert "ClaudeSealedInvocationBundle" in report["error"]
              assert "blocked before provider invocation" in report["error"]
          ''')
          gate_path.write_text(gate.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Verify focused Ikarus runtime cut
        run: |
          python -m py_compile daedalus/core.py tests/test_dynamic.py tests/test_runtime_registry_claude_shim.py
          python -m pytest -q tests/test_dynamic.py tests/test_runtime_registry_claude_shim.py
      - name: Commit product cut and remove temporary workflow
        shell: bash
        run: |
          git config user.name "KTY"
          git config user.email "kaya.yesilyurt@tu-dortmund.de"
          git rm .github/workflows/tmp-ikarus-canonical-claude-routing.yml
          git add daedalus/core.py tests/test_dynamic.py tests/test_runtime_registry_claude_shim.py
          git commit -m "fix(ikarus): gate Claude routing on canonical authority"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
