name: Gate 2 Project Twin

on:
  pull_request:
    paths:
      - "daedalus/twin/**"
      - "daedalus/kernel/artifacts.py"
      - "tests/twin/**"
      - ".github/workflows/gate2-project-twin.yml"

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        hash-seed: ["0", "123456"]
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: ${{ matrix.hash-seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: >-
          python -m pytest -q
          tests/kernel/test_artifact_identity.py
          tests/twin/test_genesis_contracts.py
          tests/twin/test_genesis_runner.py
          tests/twin/test_fourfold_contracts.py
          tests/twin/test_projection_verifier.py

  isolated-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-g2-wheel
      - run: /tmp/daedalus-g2-wheel/bin/pip install dist/*.whl
      - run: >-
          cd /tmp && /tmp/daedalus-g2-wheel/bin/python -c
          "from daedalus.twin.genesis import ProjectTwinManifest, GenesisCompileReceipt, verify_genesis_receipt; from daedalus.twin.genesis_runner import run_bounded_genesis"
