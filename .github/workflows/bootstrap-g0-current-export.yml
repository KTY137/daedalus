name: Bootstrap current Gate 0 checkout export

on:
  pull_request:
    branches:
      - g0/effect-leases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > CHECKOUT_HEAD
          tar --exclude=.git -czf /tmp/daedalus-checkout.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-g0-current-checkout
          path: /tmp/daedalus-checkout.tar.gz
          if-no-files-found: error
          retention-days: 2
