name: Gate 0 Repository-Write Artifact Evidence

on:
  pull_request:
    branches:
      - g0/gate-report-repository-write-v3-linear
    paths:
      - "daedalus/gates/repository/write_evidence.py"
      - "configs/schemas/repository-write-artifact-evidence-v1.schema.json"
      - "scripts/run_repository_write_evidence_mutations.py"
      - "tests/gates/test_repository_write_evidence*.py"
      - "docs/work-packets/G0-GR-21_REPOSITORY_WRITE_ARTIFACT_EVIDENCE.*"
      - ".github/workflows/g0-repository-write-artifact-evidence.yml"
  push:
    branches:
      - g0/repository-write-evidence-index-v2-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-repository-write-artifact-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool configs/schemas/repository-write-artifact-evidence-v1.schema.json
      - run: python -m json.tool docs/work-packets/G0-GR-21_REPOSITORY_WRITE_ARTIFACT_EVIDENCE.json
      - run: >-
          python -m pytest -q
          tests/gates/test_repository_write_evidence.py
          tests/gates/test_repository_write_evidence_provenance.py
          tests/gates/test_repository_write_evidence_review.py
          tests/gates/test_repository_write_evidence_schema.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_repository_write_evidence_mutations.py

  predecessor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: >-
          python -m pytest -q
          tests/gates/test_gate_report_v3.py
          tests/gates/test_gate_report_v3_bounds.py
          tests/gates/test_gate_report_v3_drift.py
          tests/gates/test_gate_report_v3_review.py
          tests/gates/test_gate_report_v3_schema.py
          tests/gates/test_gate_report_v3_cli.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-repository-write-evidence-wheel
      - run: /tmp/daedalus-repository-write-evidence-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-repository-write-evidence-wheel/bin/python - <<'PY'
          from daedalus.gates.repository.write_evidence import (
              RepositoryWriteArtifactEvidence,
              RepositoryWriteArtifactEvidenceError,
          )

          assert RepositoryWriteArtifactEvidence is not None
          assert RepositoryWriteArtifactEvidenceError is not None
          PY
