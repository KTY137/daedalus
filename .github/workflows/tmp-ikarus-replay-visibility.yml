name: Temporary Ikarus Replay Visibility Patch

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - ".github/workflows/tmp-ikarus-replay-visibility.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python .github/ikarus_replay_visibility_patch.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q -p no:cacheprovider tests/test_bridge_report_execution_evidence.py
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run build
      - name: Commit product delta and remove temporary scaffold
        run: |
          rm .github/ikarus_replay_visibility_patch.py
          rm .github/workflows/tmp-ikarus-replay-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ikarus): expose provider replay evidence in Work Pulse"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
