name: Run branch consolidation 2026-08-30

on:
  push:
    branches: [main]
    paths:
      - .github/branch-consolidation-final.trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: branch-consolidation-20260830
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch complete remote branch graph
        shell: pwsh
        run: |
          gh auth setup-git
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Execute recovery-first consolidation
        shell: pwsh
        run: python tools/branch_consolidate_20260830.py
