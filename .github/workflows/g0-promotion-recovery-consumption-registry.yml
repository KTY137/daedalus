name: Gate 0 Promotion Recovery Consumption Registry

on:
  pull_request:
    branches:
      - g0/promotion-recovery-consumption-inventory-linear
    paths:
      - "daedalus/spine/__init__.py"
      - "daedalus/spine/promotion_recovery_consumption_registry.py"
      - "daedalus/spine/promotion_recovery_consumption_registry_report.py"
      - "tests/test_promotion_recovery_consumption_registry*.py"
      - "scripts/run_promotion_recovery_consumption_registry_mutations.py"
      - "docs/work-packets/G0-PRM-25N_PROMOTION_RECOVERY_CONSUMPTION_REGISTRY.*"
      - ".github/workflows/g0-promotion-recovery-consumption-registry.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-recovery-consumption-registry-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-promotion-recovery-consumption-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-PRM-25N_PROMOTION_RECOVERY_CONSUMPTION_REGISTRY.json
      - run: >-
          python -m pytest -q
          tests/test_promotion_recovery_consumption_registry.py
          tests/test_promotion_recovery_consumption_registry_review.py
          tests/test_promotion_recovery_consumption_inventory.py
          tests/test_promotion_recovery_consumption_inventory_review.py
          tests/kernel/test_promotion_recovery_consumption.py
          tests/kernel/test_promotion_recovery_consumption_concurrency.py
          tests/kernel/test_promotion_recovery_consumption_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_promotion_recovery_consumption_registry_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-promotion-recovery-consumption-registry-wheel
      - run: /tmp/daedalus-promotion-recovery-consumption-registry-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          /tmp/daedalus-promotion-recovery-consumption-registry-wheel/bin/python - <<'PY'
          import os

          from daedalus.spine import effect_boundary
          from daedalus.spine.promotion_recovery_consumption_registry_report import (
              inspect_promotion_recovery_consumption_registry,
          )

          expected = (
              "kernel.promotion_recovery_consumption.initialize",
              "kernel.promotion_recovery_consumption.consume",
          )
          assert tuple(row.id for row in effect_boundary.ENTRYPOINTS[-2:]) == expected
          report = inspect_promotion_recovery_consumption_registry(
              source_revision=os.environ["SOURCE_REVISION"],
          )
          assert report.canonical_registry_integrated is True
          assert report.scanner_integrated is True
          assert report.closed is False
          PY
