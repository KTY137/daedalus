name: Gate 0 Provider Target Source Verification

on:
  pull_request:
    branches:
      - g0/provider-executable-target-manifest-linear
    paths:
      - "daedalus/runtimes/provider/target_verification.py"
      - "daedalus/runtimes/provider/target_verification_contracts.py"
      - "tests/runtimes/test_provider_target_verification.py"
      - "tests/runtimes/test_provider_target_verification_hardening.py"
      - "tests/runtimes/test_provider_target_verification_review.py"
      - "scripts/run_provider_target_verification_mutations.py"
      - "docs/work-packets/G0-RTC-07C_PROVIDER_TARGET_SOURCE_VERIFICATION.*"
      - ".github/workflows/g0-provider-target-source-verification.yml"
  push:
    branches:
      - g0/provider-executable-target-verification-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-target-source-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool docs/work-packets/G0-RTC-07C_PROVIDER_TARGET_SOURCE_VERIFICATION.json
      - run: >-
          python -m pytest -q
          tests/runtimes/test_provider_target_verification.py
          tests/runtimes/test_provider_target_verification_hardening.py
          tests/runtimes/test_provider_target_verification_review.py
          tests/runtimes/test_provider_executable_targets.py
          tests/runtimes/test_provider_executable_targets_review.py
          tests/runtimes/test_provider_invocation_identity.py
          tests/runtimes/test_provider_invocation_identity_review.py
          tests/runtimes/test_provider_invocation_registry.py
          tests/runtimes/test_provider_invocation_registry_review.py
          tests/runtimes/test_provider_invocation_authority.py
          tests/runtimes/test_provider_invocation_authority_review.py
          tests/runtimes/test_provider_observation_authority.py
          tests/runtimes/test_provider_observation_authority_review.py
          tests/runtimes/test_runtime_provider_broker.py
          tests/runtimes/test_runtime_provider_exact_authority_boundary.py
          tests/kernel/test_source_tree_store.py
          tests/kernel/test_source_tree_store_adversarial.py
          tests/kernel/test_source_tree_store_constructor_adversarial.py
          tests/kernel/test_source_tree_store_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_provider_target_verification_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-provider-target-verification-wheel
      - run: /tmp/daedalus-provider-target-verification-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-provider-target-verification-wheel/bin/python - <<'PY'
          from daedalus.runtimes.provider.target_verification import (
              issue_provider_target_verification_receipt,
              verify_provider_target_verification_receipt,
          )
          from daedalus.runtimes.provider.target_verification_contracts import (
              ProviderExecutableTargetVerificationReceipt,
              VerifiedPythonTarget,
          )

          assert callable(issue_provider_target_verification_receipt)
          assert callable(verify_provider_target_verification_receipt)
          assert ProviderExecutableTargetVerificationReceipt is not None
          assert VerifiedPythonTarget is not None
          PY
