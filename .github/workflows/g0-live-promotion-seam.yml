name: Gate 0 Live Promotion Seam

on:
  pull_request:
    branches:
      - g0/persisted-promotion-authorization-linear
    paths:
      - "daedalus/kairos/gated_writes.py"
      - "daedalus/kairos/_gated_writes_legacy.py.src"
      - "daedalus/kernel/promotion.py"
      - "pyproject.toml"
      - "tests/kernel/test_live_promotion_seam.py"
      - "tests/kernel/test_live_promotion_seam_review.py"
      - "tests/kernel/test_live_promotion_legacy_retirement.py"
      - "tests/kernel/test_persisted_promotion_authorization.py"
      - "tests/kernel/test_persisted_promotion_authorization_review.py"
      - "tests/kernel/test_promotion_material_review.py"
      - "tests/kernel/test_sealed_promotion.py"
      - "scripts/run_live_promotion_seam_mutations.py"
      - "docs/work-packets/G0-PRM-12B_LIVE_PROMOTION_SEAM.md"
      - ".github/workflows/g0-live-promotion-seam.yml"
  push:
    branches:
      - g0/live-promotion-seam-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-live-promotion-seam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: >-
          python -m pytest -q
          tests/kernel/test_live_promotion_seam.py
          tests/kernel/test_live_promotion_seam_review.py
          tests/kernel/test_live_promotion_legacy_retirement.py
          tests/kernel/test_persisted_promotion_authorization.py
          tests/kernel/test_persisted_promotion_authorization_review.py
          tests/kernel/test_promotion_material_review.py
          tests/kernel/test_sealed_promotion.py
          tests/kernel/test_owner_approval.py
          tests/kernel/test_approval_consumption_review.py
          tests/kernel/test_fourfold_approval_integration.py
          tests/kernel/test_fourfold_evidence_owner_binding.py
          tests/kernel/test_effect_leases.py
          tests/kernel/test_effect_leases_adversarial.py
          tests/gates/test_gate_report.py
          tests/test_effect_boundary.py
          tests/test_kernel_contracts.py
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.seed == '0' }}
        run: python scripts/run_live_promotion_seam_mutations.py
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-live-promotion-wheel
      - run: /tmp/daedalus-live-promotion-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        run: >-
          /tmp/daedalus-live-promotion-wheel/bin/python -c
          "import importlib, inspect;
          from importlib.resources import files;
          import daedalus.kairos.gated_writes as g;
          from daedalus.kernel.promotion import snapshot_promotion_candidates;
          s=inspect.signature(g.promote_candidates);
          assert 'approval_ledger' in s.parameters and 'owner_keyring' in s.parameters;
          assert callable(snapshot_promotion_candidates);
          assert not hasattr(g, 'snapshot_promotion_candidates');
          r=files('daedalus.kairos').joinpath('_gated_writes_legacy.py.src');
          assert r.is_file();
          assert g._git_blob_sha1(r.read_bytes()) == g._RETAINED_SOURCE_GIT_BLOB_SHA1;
          try: importlib.import_module('daedalus.kairos._gated_writes_legacy')
          except ModuleNotFoundError: pass
          else: raise AssertionError('legacy module became importable')"