name: Kernel mirror source verification aid
# Temporary read-only source transport for this owner-requested work packet.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hopping-mirror-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retain versioned source and revision only
        shell: bash
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
          git bundle create "$RUNNER_TEMP/daedalus.bundle" --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-mirror-source
          path: |
            ${{ runner.temp }}/daedalus.bundle
            ${{ runner.temp }}/source-revision.txt
          retention-days: 1
          if-no-files-found: error
