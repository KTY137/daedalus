name: Gate 0 Provider Invocation Exact Authority Integration

on:
  pull_request:
    branches:
      - g0/provider-invocation-identity-admission-linear
    paths:
      - "daedalus/runtimes/broker.py"
      - "tests/runtimes/test_runtime_provider_broker.py"
      - "tests/runtimes/test_runtime_provider_exact_authority_boundary.py"
      - "tests/runtimes/test_provider_observation_authority_review.py"
      - "tests/runtimes/test_provider_invocation_identity.py"
      - "tests/runtimes/test_provider_invocation_identity_review.py"
      - "scripts/run_provider_broker_exact_authority_mutations.py"
      - "docs/work-packets/G0-RTC-07A_PROVIDER_INVOCATION_EXACT_AUTHORITY_INTEGRATION.*"
      - ".github/workflows/g0-provider-invocation-exact-authority-integration.yml"
  push:
    branches:
      - g0/provider-invocation-exact-authority-integration-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-invocation-exact-authority-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-RTC-07A_PROVIDER_INVOCATION_EXACT_AUTHORITY_INTEGRATION.json
      - run: >-
          python -m pytest -q
          tests/runtimes/test_runtime_provider_broker.py
          tests/runtimes/test_runtime_provider_exact_authority_boundary.py
          tests/runtimes/test_provider_observation_authority.py
          tests/runtimes/test_provider_observation_authority_review.py
          tests/runtimes/test_provider_invocation.py
          tests/runtimes/test_provider_invocation_authority.py
          tests/runtimes/test_provider_invocation_authority_review.py
          tests/runtimes/test_provider_invocation_registry.py
          tests/runtimes/test_provider_invocation_registry_review.py
          tests/runtimes/test_provider_invocation_identity.py
          tests/runtimes/test_provider_invocation_identity_review.py
          tests/runtimes/test_runtime_provider_post_invoke_unknown.py
          tests/runtimes/test_runtime_provider_recovery.py
          tests/runtimes/test_runtime_provider_recovery_review.py
          tests/kernel/test_effect_recovery.py
          tests/kernel/test_effect_recovery_hardening.py
          tests/kernel/test_runtime_effect_replay_projection.py
          tests/kernel/test_runtime_effect_replay_projection_review.py
          tests/runtimes/test_runtime_trust_contention_fault_executor.py
          tests/runtimes/test_runtime_trust_contention_fault_executor_review.py
          tests/test_runtime_profiles.py
          tests/test_runtime_trust_store.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_provider_broker_exact_authority_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-provider-authority-wheel
      - run: /tmp/daedalus-provider-authority-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-provider-authority-wheel/bin/python - <<'PY'
          from daedalus.runtimes.broker import (
              RuntimeProviderBindingMismatch,
              run_runtime_provider,
          )
          from daedalus.runtimes.provider_invocation_identity import (
              ProviderInvocationIdentityProjection,
              project_provider_invocation_identity,
          )
          from daedalus.runtimes.provider_observation import (
              ProviderObservationAuthority,
              ProviderObservationBindingLedger,
          )

          assert callable(run_runtime_provider)
          assert callable(project_provider_invocation_identity)
          assert RuntimeProviderBindingMismatch is not None
          assert ProviderInvocationIdentityProjection is not None
          assert ProviderObservationAuthority is not None
          assert ProviderObservationBindingLedger is not None
          PY
