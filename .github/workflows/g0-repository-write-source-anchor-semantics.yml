name: Gate 0 Repository Write Source-Anchor Semantics

on:
  pull_request:
    branches:
      - g0/repository-write-evidence-origin-linear
    paths:
      - "daedalus/gates/repository/write_source_anchor_semantics.py"
      - "tests/gates/test_repository_write_source_anchor_semantics*.py"
      - "scripts/run_repository_write_source_anchor_semantics_mutations.py"
      - "configs/schemas/repository-write-source-anchor-semantics.schema.json"
      - "docs/work-packets/G0-RWI-20F_REPOSITORY_WRITE_SOURCE_ANCHOR_SEMANTICS.*"
      - ".github/workflows/g0-repository-write-source-anchor-semantics.yml"
  push:
    branches:
      - g0/repository-write-source-anchor-semantics-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-repository-write-source-anchor-semantics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool configs/schemas/repository-write-source-anchor-semantics.schema.json
      - run: python -m json.tool docs/work-packets/G0-RWI-20F_REPOSITORY_WRITE_SOURCE_ANCHOR_SEMANTICS.json
      - run: >-
          python -m pytest -q
          tests/gates/test_repository_write_source_anchor_semantics.py
          tests/gates/test_repository_write_source_anchor_semantics_review.py
          tests/gates/test_repository_write_evidence_origin.py
          tests/gates/test_repository_write_evidence_origin_review.py
          tests/gates/test_repository_write_evidence_materialization.py
          tests/gates/test_repository_write_evidence_materialization_review.py
          tests/gates/test_repository_write_classification.py
          tests/gates/test_repository_write_classification_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_repository_write_source_anchor_semantics_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-source-anchor-wheel
      - run: /tmp/daedalus-source-anchor-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-source-anchor-wheel/bin/python - <<'PY'
          from daedalus.gates.repository.write_source_anchor_semantics import (
              RepositoryWriteSourceAnchorBindingError,
              RepositoryWriteSourceAnchorSemanticsError,
              RepositoryWriteSourceAnchorSemanticsReport,
              RepositoryWriteSourceAnchorTreeError,
              SourceAnchorSemanticRecord,
              verify_repository_write_source_anchor_semantics,
          )

          assert issubclass(
              RepositoryWriteSourceAnchorBindingError,
              RepositoryWriteSourceAnchorSemanticsError,
          )
          assert issubclass(
              RepositoryWriteSourceAnchorTreeError,
              RepositoryWriteSourceAnchorSemanticsError,
          )
          assert RepositoryWriteSourceAnchorSemanticsReport.__dataclass_fields__
          assert SourceAnchorSemanticRecord.__dataclass_fields__
          assert callable(verify_repository_write_source_anchor_semantics)
          PY
