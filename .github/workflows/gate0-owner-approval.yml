name: Gate 0 owner approval

on:
  pull_request:
    branches:
      - g0/gate-reporting
      - g0/gate-reporting
      - core/fourfold-v2
  push:
    branches:
      - g0-owner-approval

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e .
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q tests/test_kernel_approvals.py tests/gates tests/test_kernel_contracts.py
      - run: python -m build
      - name: Isolated wheel import
        run: |
          python -m venv /tmp/daedalus-wheel
          /tmp/daedalus-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/daedalus-wheel/bin/python -c "from daedalus.kernel import OwnerApproval, PromotionReceipt"
