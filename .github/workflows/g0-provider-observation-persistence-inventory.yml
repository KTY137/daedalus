name: Gate 0 Provider Observation Persistence Inventory

on:
  pull_request:
    branches:
      - g0/provider-observation-authority-linear
    paths:
      - "daedalus/gates/provider_observation_persistence_inventory.py"
      - "scripts/report_provider_observation_persistence_inventory.py"
      - "scripts/run_provider_observation_persistence_inventory_mutations.py"
      - "tests/gates/test_provider_observation_persistence_inventory*.py"
      - "docs/work-packets/G0-RTC-06U_PROVIDER_OBSERVATION_PERSISTENCE_INVENTORY.*"
      - ".github/workflows/g0-provider-observation-persistence-inventory.yml"
  push:
    branches:
      - g0/provider-observation-persistence-inventory-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-observation-persistence-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-RTC-06U_PROVIDER_OBSERVATION_PERSISTENCE_INVENTORY.json
      - run: >-
          python -m pytest -q
          tests/gates/test_provider_observation_persistence_inventory.py
          tests/gates/test_provider_observation_persistence_inventory_review.py
          tests/gates/test_provider_observation_persistence_inventory_cli.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_provider_observation_persistence_inventory_mutations.py

  provider-observation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: >-
          python -m pytest -q
          tests/runtimes/test_provider_observation_authority.py
          tests/runtimes/test_provider_observation_authority_review.py
          tests/runtimes/test_runtime_provider_post_invoke_unknown.py
          tests/runtimes/test_runtime_provider_post_invoke_unknown_review.py
          tests/runtimes/test_runtime_provider_recovery.py
          tests/runtimes/test_runtime_provider_recovery_review.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-provider-persistence-wheel
      - run: /tmp/daedalus-provider-persistence-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-provider-persistence-wheel/bin/python - <<'PY'
          from daedalus.gates.provider_observation_persistence_inventory import (
              ProviderObservationPersistenceInventory,
              ProviderObservationPersistenceInventoryError,
              scan_provider_observation_persistence,
          )

          assert ProviderObservationPersistenceInventory is not None
          assert ProviderObservationPersistenceInventoryError is not None
          assert callable(scan_provider_observation_persistence)
          PY
