name: Hopping integration source snapshot

# Temporary, read-only verification aid; removed with the integration packet.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hopping-source-snapshot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only versioned source
        shell: bash
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/daedalus-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: hopping-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/daedalus-source.tar.gz
            ${{ runner.temp }}/source-revision.txt
          retention-days: 1
          if-no-files-found: error
