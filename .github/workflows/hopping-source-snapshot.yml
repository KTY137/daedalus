name: Hopping integration verification

# One-shot, owner-requested integration of the hash-bound patch; no candidate promotion.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hopping-source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hopping-integration
  cancel-in-progress: false
env:
  PATCH_SHA256: 554ed95db384dbc40a9a28127abf64649db74e60fc9082753be747c139bd69a7
  PATCH_BLOBS: '["cec6629a32ba54a3f75abd2aca68284573557067","08baf84623157942dbf0ae72a7d627fe215dc5ec","c4cf865711e693d48d5fabf27864abf5a31f5dc3","75dedcb7549d2187a540baaa153f652a6a7d0bd0"]'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact source patch for verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, pathlib, hashlib, base64, lzma, subprocess, json, urllib.request
          fragments = []
          for sha in json.loads(os.environ['PATCH_BLOBS']):
              url = f'https://api.github.com/repos/KTY137/daedalus/git/blobs/{sha}'
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(100000)
              blob = base64.b64decode(json.loads(raw)['content'])
              identity = hashlib.sha1(b'blob ' + str(len(blob)).encode() + b'\x00' + blob).hexdigest()
              assert identity == sha, 'unexpected blob content'
              fragments.append(blob)
          patch = lzma.decompress(base64.b64decode(b''.join(fragments)))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hopping.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', '--unidiff-zero', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', str(path)], check=True)
      - run: python -m pip install -e ".[test]"
      - name: Portable contracts and existing regressions
        shell: python
        run: |
          import subprocess, sys, os
          paths = ['tests/twin/test_tensor_kernel.py', 'tests/twin/test_relation_contractions.py',
            'tests/twin/test_wiki_reference.py', 'tests/twin/test_runtime_projection.py',
            'tests/test_ariadne_owner_evaluator.py', 'tests/test_hopping_admission.py',
            'tests/test_ikarus_hopping_dispatch.py', 'tests/runtimes/test_computer_genesis.py',
            'tests/runtimes/test_computer_ariadne.py', 'tests/test_ikarus_computer_loop_ariadne.py',
            'tests/kernel/test_computer_policy.py', 'tests/runtimes/test_computer_daedalus.py',
            'tests/test_ikarus_computer_dispatch.py', 'tests/test_ikarus_computer_loop.py',
            'tests/test_ikarus_computer_loop_adversarial.py', 'tests/interfaces/test_computer_configuration.py',
            'tests/contracts/test_import_scc_hierarchy.py', 'tests/kernel/test_genesis_contracts.py',
            'tests/kernel/test_genesis_effect_lease.py', 'tests/orchestration/test_genesis_materializer.py']
          args = [sys.executable, '-m', 'pytest', '-q', *paths, '--tb=short', '--junitxml=portable.xml']
          if os.name != 'nt':
              args += ['-k', 'not real_campaign_through']
          subprocess.run(args, check=True)
      - name: Native Windows builder, failure, replay and file-effect regressions
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-m', 'pytest', '-q',
            'tests/orchestration/test_genesis_service.py',
            'tests/orchestration/test_genesis_source_archive.py',
            'tests/interfaces/test_genesis_cli.py', 'tests/interfaces/test_http_genesis.py',
            'tests/runtimes/test_computer_service.py', 'tests/runtimes/test_computer_service_effect_state.py',
            'tests/test_ariadne_leakage_boundary.py', 'tests/test_ariadne_test_evaluator.py',
            '--tb=short', '--junitxml=native.xml'], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hopping-verification-${{ matrix.os }}
          path: |
            portable.xml
            native.xml
          retention-days: 7
          if-no-files-found: warn
  apply:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Apply only to the verified unchanged main head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, pathlib, hashlib, base64, lzma, subprocess, json, urllib.request
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA'], 'main advanced; integration requires a new verification'
          fragments = []
          for sha in json.loads(os.environ['PATCH_BLOBS']):
              url = f'https://api.github.com/repos/KTY137/daedalus/git/blobs/{sha}'
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(100000)
              blob = base64.b64decode(json.loads(raw)['content'])
              identity = hashlib.sha1(b'blob ' + str(len(blob)).encode() + b'\x00' + blob).hexdigest()
              assert identity == sha, 'unexpected blob content'
              fragments.append(blob)
          patch = lzma.decompress(base64.b64decode(b''.join(fragments)))
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hopping.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', '--unidiff-zero', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', str(path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat(ikarus): wire tensor-backed Genesis and owner-tested hopping nominations'], check=True)
      - name: Fast-forward only; no candidate activation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main
