name: Gate 0 Repository Write Runtime Conformance

on:
  pull_request:
    branches:
      - g0/repository-write-guard-structure-linear
    paths:
      - "daedalus/gates/repository/write_runtime_conformance.py"
      - "tests/gates/test_repository_write_runtime_conformance*.py"
      - "scripts/run_repository_write_runtime_conformance_mutations.py"
      - "configs/schemas/repository-write-runtime-conformance.schema.json"
      - "docs/work-packets/G0-RWI-20K_REPOSITORY_WRITE_RUNTIME_CONFORMANCE.*"
      - ".github/workflows/g0-repository-write-runtime-conformance.yml"
  push:
    branches:
      - g0/repository-write-runtime-conformance-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-repository-write-runtime-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool configs/schemas/repository-write-runtime-conformance.schema.json
      - run: python -m json.tool docs/work-packets/G0-RWI-20K_REPOSITORY_WRITE_RUNTIME_CONFORMANCE.json
      - run: >-
          python -m pytest -q
          tests/gates/test_repository_write_runtime_conformance.py
          tests/gates/test_repository_write_runtime_conformance_review.py
          tests/gates/test_repository_write_guard_structure.py
          tests/gates/test_repository_write_guard_structure_review.py
          tests/gates/test_python_target_structure.py
          tests/gates/test_python_target_structure_review.py
          tests/gates/test_repository_tree.py
          tests/gates/test_repository_tree_review.py
          tests/gates/test_guard_implementation_manifest.py
          tests/gates/test_guard_implementation_manifest_review.py
          tests/gates/test_repository_write_source_anchor_semantics.py
          tests/gates/test_repository_write_source_anchor_semantics_review.py
          tests/gates/test_repository_write_evidence_origin.py
          tests/gates/test_repository_write_evidence_origin_review.py
          tests/gates/test_repository_write_evidence_materialization.py
          tests/gates/test_repository_write_evidence_materialization_review.py
          tests/gates/test_repository_write_classification.py
          tests/gates/test_repository_write_classification_review.py
          tests/test_runtime_profiles.py
          tests/test_runtime_trust_store.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_repository_write_runtime_conformance_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-runtime-replay-wheel
      - run: /tmp/daedalus-runtime-replay-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-runtime-replay-wheel/bin/python - <<'PY'
          from daedalus.gates.repository.write_runtime_conformance import (
              RepositoryWriteRuntimeConformanceBindingError,
              RepositoryWriteRuntimeConformanceError,
              RepositoryWriteRuntimeConformancePayloadError,
              RepositoryWriteRuntimeConformanceReport,
              RuntimeConformanceReplayRecord,
              RuntimeConformanceSubject,
              verify_repository_write_runtime_conformance,
          )

          assert issubclass(
              RepositoryWriteRuntimeConformanceBindingError,
              RepositoryWriteRuntimeConformanceError,
          )
          assert issubclass(
              RepositoryWriteRuntimeConformancePayloadError,
              RepositoryWriteRuntimeConformanceError,
          )
          assert RepositoryWriteRuntimeConformanceReport.__dataclass_fields__
          assert RuntimeConformanceReplayRecord.__dataclass_fields__
          assert RuntimeConformanceSubject.__dataclass_fields__
          assert callable(verify_repository_write_runtime_conformance)
          PY
