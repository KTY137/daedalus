name: Bootstrap checkout export

on:
  push:
    branches:
      - g0/bootstrap-workspace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g0/effect-leases
          fetch-depth: 1
      - name: Create exact tracked-source archive
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD | tee "$RUNNER_TEMP/CHECKOUT_HEAD"
          git archive --format=tar.gz --output="$RUNNER_TEMP/daedalus-checkout.tar.gz" HEAD
          test -s "$RUNNER_TEMP/daedalus-checkout.tar.gz"
          tar -tzf "$RUNNER_TEMP/daedalus-checkout.tar.gz" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-effect-leases-checkout
          path: |
            ${{ runner.temp }}/daedalus-checkout.tar.gz
            ${{ runner.temp }}/CHECKOUT_HEAD
          if-no-files-found: error
          retention-days: 7

