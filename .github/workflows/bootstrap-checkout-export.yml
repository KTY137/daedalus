name: Bootstrap checkout export

on:
  pull_request:
    branches:
      - core/fourfold-v2
  push:
    branches:
      - g0/bootstrap-workspace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD > CHECKOUT_HEAD
          tar --exclude=.git --exclude=daedalus-checkout.tar.gz -czf daedalus-checkout.tar.gz .
          test -s daedalus-checkout.tar.gz
          tar -tzf daedalus-checkout.tar.gz >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-checkout-${{ github.sha }}
          path: daedalus-checkout.tar.gz
          if-no-files-found: error
          retention-days: 2
