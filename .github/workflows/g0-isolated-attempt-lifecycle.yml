name: Gate 0 Isolated Attempt Lifecycle

on:
  pull_request:
    branches:
      - g0/source-tree-cas-port-v2-linear
    paths:
      - "daedalus/kernel/attempts.py"
      - "daedalus/kernel/attempt_contracts.py"
      - "daedalus/kernel/attempt_ledger.py"
      - "daedalus/kernel/attempt_spine_reader.py"
      - "daedalus/kernel/attempt_workspace.py"
      - "daedalus/kernel/__init__.py"
      - "configs/schemas/attempt-start-v1.schema.json"
      - "configs/schemas/attempt-terminal-v1.schema.json"
      - "tests/kernel/test_isolated_attempt_lifecycle.py"
      - "tests/kernel/test_isolated_attempt_lifecycle_adversarial.py"
      - "tests/kernel/test_isolated_attempt_lifecycle_review.py"
      - "tests/kernel/test_isolated_attempt_cas_review.py"
      - "tests/kernel/test_isolated_attempt_schema_review.py"
      - "tests/kernel/test_isolated_attempt_spine_wire_review.py"
      - "tests/kernel/test_isolated_attempt_effect_inventory.py"
      - "scripts/run_isolated_attempt_mutations.py"
      - "docs/work-packets/G0-ATT-13B_ISOLATED_ATTEMPT_LIFECYCLE.md"
      - "docs/work-packets/G0-ATT-13B_EFFECT_INVENTORY.json"
      - ".github/workflows/g0-isolated-attempt-lifecycle.yml"
  push:
    branches:
      - g0/isolated-attempt-lifecycle-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-isolated-attempt-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool configs/schemas/attempt-start-v1.schema.json
      - run: python -m json.tool configs/schemas/attempt-terminal-v1.schema.json
      - run: python -m json.tool docs/work-packets/G0-ATT-13B_EFFECT_INVENTORY.json
      - run: >-
          python -m pytest -q
          tests/kernel/test_isolated_attempt_lifecycle.py
          tests/kernel/test_isolated_attempt_lifecycle_adversarial.py
          tests/kernel/test_isolated_attempt_lifecycle_review.py
          tests/kernel/test_isolated_attempt_cas_review.py
          tests/kernel/test_isolated_attempt_schema_review.py
          tests/kernel/test_isolated_attempt_spine_wire_review.py
          tests/kernel/test_isolated_attempt_effect_inventory.py
          tests/kernel/test_source_tree_store.py
          tests/kernel/test_source_tree_store_adversarial.py
          tests/kernel/test_source_tree_store_constructor_adversarial.py
          tests/kernel/test_source_tree_store_review.py
          tests/kernel/test_live_promotion_seam.py
          tests/kernel/test_persisted_promotion_authorization.py
          tests/kernel/test_fourfold_evidence_owner_binding.py
          tests/kernel/test_effect_leases.py
          tests/kernel/test_runtime_conformance.py
          tests/kernel/test_docker_sandbox.py
          tests/test_spine_ledger.py
          tests/test_kernel_contracts.py
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && matrix.seed == '0' }}
        run: python scripts/run_isolated_attempt_mutations.py
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-isolated-attempt-wheel
      - run: /tmp/daedalus-isolated-attempt-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-isolated-attempt-wheel/bin/python - <<'PY'
          import inspect
          from daedalus.kernel import AttemptLedger, IsolatedAttemptCoordinator
          from daedalus.kernel.attempts import (
              AttemptLedger as CompatibilityAttemptLedger,
              AttemptStartRecord,
              AttemptTerminalReceipt,
              IsolatedAttemptCoordinator as CompatibilityCoordinator,
          )

          assert AttemptLedger is CompatibilityAttemptLedger
          assert IsolatedAttemptCoordinator is CompatibilityCoordinator
          assert AttemptLedger.__module__ == "daedalus.kernel.attempt_ledger"
          assert IsolatedAttemptCoordinator.__module__ == "daedalus.kernel.attempt_workspace"
          assert AttemptStartRecord.CONTRACT_TYPE == "daedalus.attempt-start"
          assert AttemptTerminalReceipt.CONTRACT_TYPE == "daedalus.attempt-terminal"
          assert "source_store" in inspect.signature(AttemptLedger).parameters
          PY
