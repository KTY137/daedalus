name: Gate 0 Promotion Effect Capability

on:
  pull_request:
    branches:
      - g0/promotion-registry-install-linear
    paths:
      - "daedalus/kernel/__init__.py"
      - "daedalus/kernel/promotion_effects.py"
      - "daedalus/kernel/authorization.py"
      - "daedalus/kernel/effects.py"
      - "daedalus/kernel/promotion.py"
      - "daedalus/spine/effect_boundary.py"
      - "tests/kernel/test_effect_authorization.py"
      - "tests/kernel/test_promotion_effect_capability*.py"
      - "tests/kernel/test_promotion_effect_registry*.py"
      - "tests/kernel/test_promotion_effect_inventory*.py"
      - "scripts/run_promotion_effect_capability_mutations.py"
      - "docs/work-packets/G0-PRM-25C_PROMOTION_EFFECT_CAPABILITY.*"
      - ".github/workflows/g0-promotion-effect-capability.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/promotion-effect-capability-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-promotion-effect-capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool docs/work-packets/G0-PRM-25C_PROMOTION_EFFECT_CAPABILITY.json
      - run: >-
          python -m pytest -q
          tests/kernel/test_effect_authorization.py
          tests/kernel/test_promotion_effect_capability.py
          tests/kernel/test_promotion_effect_capability_review.py
          tests/kernel/test_promotion_effect_registry.py
          tests/kernel/test_promotion_effect_registry_review.py
          tests/kernel/test_promotion_effect_inventory.py
          tests/kernel/test_promotion_effect_inventory_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_promotion_effect_capability_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-promotion-effect-capability-wheel
      - run: /tmp/daedalus-promotion-effect-capability-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-promotion-effect-capability-wheel/bin/python - <<'PY'
          from daedalus.kernel import (
              PROMOTION_EFFECTS,
              PROMOTION_ENTRYPOINT_ID,
              PromotionEffectCapability,
          )

          assert PROMOTION_ENTRYPOINT_ID == "python.promote_candidates"
          assert PROMOTION_EFFECTS == (
              "filesystem_write",
              "process_spawn",
              "repository_mutation",
          )
          assert PromotionEffectCapability.__module__ == "daedalus.kernel.promotion_effects"
          PY
