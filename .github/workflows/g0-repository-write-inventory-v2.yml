name: Gate 0 Repository Write Inventory v2

on:
  pull_request:
    branches:
      - g0/repository-write-stdlib-delta-linear
    paths:
      - "daedalus/gates/repository/write_inventory_v2.py"
      - "scripts/report_repository_write_inventory_v2.py"
      - "scripts/run_repository_write_inventory_v2_mutations.py"
      - "tests/gates/test_repository_write_inventory_v2*.py"
      - "configs/schemas/repository-write-inventory-v2.schema.json"
      - "docs/work-packets/G0-RWI-20B_REPOSITORY_WRITE_CANONICAL_V2.*"
      - ".github/workflows/g0-repository-write-inventory-v2.yml"
  push:
    branches:
      - g0/repository-write-canonical-v2-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-repository-write-inventory-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool configs/schemas/repository-write-inventory-v2.schema.json
      - run: python -m json.tool docs/work-packets/G0-RWI-20B_REPOSITORY_WRITE_CANONICAL_V2.json
      - run: >-
          python -m pytest -q
          tests/gates/test_repository_write_inventory_v2.py
          tests/gates/test_repository_write_inventory_v2_review.py
          tests/gates/test_repository_write_stdlib_delta.py
          tests/gates/test_repository_write_inventory.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_repository_write_inventory_v2_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-repository-write-v2-wheel
      - run: /tmp/daedalus-repository-write-v2-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-repository-write-v2-wheel/bin/python - <<'PY'
          import tempfile
          from pathlib import Path

          from daedalus.gates.repository.write_inventory_v2 import (
              scan_repository_write_surfaces_v2,
          )

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              package = root / "daedalus"
              package.mkdir()
              (package / "__init__.py").write_text("", encoding="utf-8")
              (package / "surface.py").write_text(
                  "import os\nos.write(1, b'x')\n",
                  encoding="utf-8",
              )
              report = scan_repository_write_surfaces_v2(
                  root,
                  source_revision="f" * 40,
              )
              assert report.to_dict()["canonical_scanner_integrated"] is True
              assert report.to_dict()["inventory_generation"] == 2
              assert report.to_dict()["closed"] is False
          PY
