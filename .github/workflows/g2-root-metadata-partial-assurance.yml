name: Gate 2 prep — ROOT metadata partial assurance

on:
  pull_request:
    branches:
      - g0/release-assessment-linear
    paths:
      - "daedalus/twin/extractors/root_file_adapter.py"
      - "tests/twin/test_root_file_extractor.py"
      - "tests/twin/test_root_metadata_assurance_boundary.py"
      - "scripts/run_root_metadata_assurance_mutations.py"
      - "docs/work-packets/G2-PREP-ROOT01_PARTIAL_ASSURANCE.md"
      - ".github/workflows/g2-root-metadata-partial-assurance.yml"
  push:
    branches:
      - g2/root-metadata-partial-assurance-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-root-metadata-partial-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: ROOT metadata / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,root]" pytest numpy
      - run: python tools/iron_plan_guard.py verify
      - run: python -m compileall -q daedalus tests scripts
      - name: Contract, real ROOT, malformed and assurance tests
        run: >-
          python -m pytest -q
          tests/twin/test_extractor_contracts.py
          tests/twin/test_root_file_extractor.py
          tests/twin/test_root_metadata_assurance_boundary.py
      - name: Metadata overclaim mutation
        run: python scripts/run_root_metadata_assurance_mutations.py

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,polyglot,root]" pytest numpy
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    name: isolated wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-root-metadata-wheel
      - run: /tmp/daedalus-root-metadata-wheel/bin/pip install dist/*.whl
      - name: Import installed metadata adapter outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-root-metadata-wheel/bin/python -c
          "from daedalus.twin.extractors.root_file_adapter import inspect_root_artifact;
          assert inspect_root_artifact"
