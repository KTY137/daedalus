name: Gate 1 Ikarus Runtime Events

on:
  pull_request:
    branches:
      - main
    paths:
      - "daedalus/orchestration/ikarus/runtime_events.py"
      - "tests/test_ikarus_runtime_events.py"
      - "docs/research/hermes-agent-v2026.8.19-provenance.json"
      - "docs/work-packets/G1-IKARUS-03_RUNTIME_EVENT_PROJECTION.md"
      - ".github/workflows/g1-ikarus-runtime-events.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-ikarus-runtime-events-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m py_compile daedalus/orchestration/ikarus/runtime_events.py tests/test_ikarus_runtime_events.py
      - run: python -m json.tool docs/research/hermes-agent-v2026.8.19-provenance.json
      - run: python -m pytest -q -p no:cacheprovider tests/test_ikarus_runtime_events.py
