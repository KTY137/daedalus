name: Fourfold hybrid retrieval experiment

on:
  push:
    branches:
      - exp/fourfold-hybrid-retrieval-01
    paths:
      - "experiments/fourfold_hybrid_retrieval/**"
      - "tests/twin/test_fourfold_hybrid_retrieval_experiment.py"
      - "docs/work-packets/G1-EXP-FOURFOLD-HYBRID-RETRIEVAL-01.json"
      - ".github/workflows/fourfold-hybrid-retrieval.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experiments/fourfold_hybrid_retrieval/**"
      - "tests/twin/test_fourfold_hybrid_retrieval_experiment.py"
      - "docs/work-packets/G1-EXP-FOURFOLD-HYBRID-RETRIEVAL-01.json"
      - ".github/workflows/fourfold-hybrid-retrieval.yml"
  workflow_dispatch:

concurrency:
  group: fourfold-hybrid-retrieval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        hash-seed: ["0", "123456"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install repository and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Compile experiment
        run: >-
          python -m py_compile
          experiments/fourfold_hybrid_retrieval/__init__.py
          experiments/fourfold_hybrid_retrieval/relations.py
          experiments/fourfold_hybrid_retrieval/planner.py
          experiments/fourfold_hybrid_retrieval/retrieval.py
          tests/twin/test_fourfold_hybrid_retrieval_experiment.py
      - name: Run focused Fourfold hybrid tests
        env:
          PYTHONHASHSEED: ${{ matrix.hash-seed }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/twin/test_fourfold_contracts.py
          tests/twin/test_fourfold_hybrid_retrieval_experiment.py

  twin-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run complete Twin test surface
        env:
          PYTHONHASHSEED: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -p no:cacheprovider tests/twin
