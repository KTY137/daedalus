name: Gate 0 Provider Invocation Identity

on:
  pull_request:
    branches:
      - g0/provider-invocation-registry-manifest-linear
    paths:
      - "daedalus/runtimes/provider_invocation_identity.py"
      - "tests/runtimes/test_provider_invocation_identity*.py"
      - "scripts/run_provider_invocation_identity_mutations.py"
      - "docs/work-packets/G0-RTC-06Y_PROVIDER_INVOCATION_IDENTITY.*"
      - ".github/workflows/g0-provider-invocation-identity.yml"
  push:
    branches:
      - g0/provider-invocation-identity-admission-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-invocation-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests
      - run: python -m json.tool docs/work-packets/G0-RTC-06Y_PROVIDER_INVOCATION_IDENTITY.json
      - run: >-
          python -m pytest -q
          tests/runtimes/test_provider_invocation_subject.py
          tests/runtimes/test_provider_invocation_subject_review.py
          tests/runtimes/test_provider_invocation_authority.py
          tests/runtimes/test_provider_invocation_authority_review.py
          tests/runtimes/test_provider_invocation_registry.py
          tests/runtimes/test_provider_invocation_registry_review.py
          tests/runtimes/test_provider_invocation_identity.py
          tests/runtimes/test_provider_invocation_identity_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python scripts/run_provider_invocation_identity_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-provider-invocation-identity-wheel
      - run: /tmp/daedalus-provider-invocation-identity-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-provider-invocation-identity-wheel/bin/python - <<'PY'
          from daedalus.runtimes.provider_invocation_identity import (
              PROVIDER_INVOCATION_CONTRACT_ID,
              ProviderInvocationIdentityProjection,
              project_provider_invocation_identity,
          )

          assert PROVIDER_INVOCATION_CONTRACT_ID
          assert ProviderInvocationIdentityProjection is not None
          assert project_provider_invocation_identity is not None
          PY
