name: Gate 1 prep renovation attempt bindings

on:
  pull_request:
    branches:
      - g1/renovation-work-items-prep-linear
    paths:
      - "daedalus/orchestration/**"
      - "tests/orchestration/test_renovation_work_items.py"
      - "tests/orchestration/test_renovation_attempt_bindings.py"
      - "tests/orchestration/test_renovation_attempt_bindings_review.py"
      - "scripts/run_g1_renovation_attempt_binding_mutations.py"
      - "docs/work-packets/G1-PREP-02_RENOVATION_ATTEMPT_BINDINGS.md"
      - ".github/workflows/g1-prep-renovation-attempt-bindings.yml"
  push:
    branches:
      - g1/renovation-attempt-bindings-prep-linear

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        hashseed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: >-
          python -m pytest -q
          tests/orchestration/test_renovation_work_items.py
          tests/orchestration/test_renovation_work_items_review.py
          tests/orchestration/test_renovation_attempt_bindings.py
          tests/orchestration/test_renovation_attempt_bindings_review.py
          tests/twin/test_fourfold_contracts.py
          tests/test_kernel_contracts.py
      - run: python tools/iron_plan_guard.py verify

  mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_g1_renovation_attempt_binding_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m pip install --target /tmp/g1-attempt-wheel dist/*.whl
      - run: >-
          cd /tmp && PYTHONPATH=/tmp/g1-attempt-wheel python -c
          "from daedalus.orchestration import RenovationAttemptPlan,
          assemble_renovation_attempt_plan, verify_renovation_attempt_plan"
