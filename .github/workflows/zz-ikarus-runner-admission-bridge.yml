name: Temporary Ikarus runner admission bridge

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - .github/workflows/zz-ikarus-runner-admission-bridge.yml

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: Bind Claude runner factory to admitted execution mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('daedalus/ikarus_claude_task_attempt_runner.py')
          text = runner.read_text(encoding='utf-8')
          old = '''from .ikarus_runtime_role import (\n    RuntimeRoleBinding,\n    RuntimeRoleRegistry,\n    RuntimeRoleSnapshot,\n)'''
          new = '''from .ikarus_runtime_role import (\n    AUTHENTICATED_HANDOFF_EXECUTION_MODE,\n    RuntimeRoleBinding,\n    RuntimeRoleRegistry,\n    RuntimeRoleSnapshot,\n)'''
          assert text.count(old) == 1, 'runner import seam drifted'
          text = text.replace(old, new)
          old = '''    if snapshot.runtime_id != CLAUDE_RUNTIME_ID:\n        raise IkarusClaudeTaskAttemptAuthorityRefused(\n            "Claude runner factory requires the canonical claude_code_cli runtime"\n        )\n    return snapshot'''
          new = '''    if snapshot.runtime_id != CLAUDE_RUNTIME_ID:\n        raise IkarusClaudeTaskAttemptAuthorityRefused(\n            "Claude runner factory requires the canonical claude_code_cli runtime"\n        )\n    if snapshot.execution_mode != AUTHENTICATED_HANDOFF_EXECUTION_MODE:\n        raise IkarusClaudeTaskAttemptAuthorityRefused(\n            "Claude runner factory requires an authenticated-handoff runtime binding"\n        )\n    return snapshot'''
          assert text.count(old) == 1, 'runtime snapshot admission seam drifted'
          runner.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_ikarus_claude_task_attempt_runner.py')
          text = test.read_text(encoding='utf-8')
          old = '''from daedalus.ikarus_runtime_role import (\n    SOURCE_ONLY_EXECUTION_MODE,\n    RuntimeRoleBinding,\n    RuntimeRoleRegistry,\n)'''
          new = '''from daedalus.ikarus_runtime_role import (\n    AUTHENTICATED_HANDOFF_EXECUTION_MODE,\n    SOURCE_ONLY_EXECUTION_MODE,\n    RuntimeRoleBinding,\n    RuntimeRoleRegistry,\n)'''
          assert text.count(old) == 1, 'test import seam drifted'
          text = text.replace(old, new)
          old = '''        origin="tests://ikarus-claude-composition",\n        execution_mode=SOURCE_ONLY_EXECUTION_MODE,\n        refusal_reason="source-only until the sealed mission runtime admits execution",\n    )'''
          new = '''        origin="tests://ikarus-claude-composition",\n        execution_mode=AUTHENTICATED_HANDOFF_EXECUTION_MODE,\n    )'''
          assert text.count(old) == 1, 'runtime binding fixture seam drifted'
          text = text.replace(old, new)
          anchor = '''def _item(subjects, **overrides):\n'''
          addition = '''def _source_only_runtime_binding():\n    binding = RuntimeRoleBinding(\n        role="assistant",\n        runtime_id=CLAUDE_RUNTIME_ID,\n        adapter_id="claude.oneshot-adapter",\n        adapter_version="test-1",\n        source_revision=fixture.CLAUDE_SOURCE_REVISION,\n        origin="tests://ikarus-claude-composition",\n        execution_mode=SOURCE_ONLY_EXECUTION_MODE,\n        refusal_reason="declaration only; authenticated handoff is not admitted",\n    )\n    snapshot = RuntimeRoleRegistry((binding,)).snapshot("assistant", CLAUDE_RUNTIME_ID)\n    assert snapshot is not None\n    return snapshot\n\n\ndef test_handoff_runner_factory_refuses_source_only_runtime_before_resolver():\n    resolved = False\n\n    def resolve_inputs(item, handoff):\n        nonlocal resolved\n        resolved = True\n        raise AssertionError("source-only runtime must never resolve provider inputs")\n\n    with pytest.raises(\n        authority.IkarusClaudeTaskAttemptAuthorityRefused,\n        match="authenticated-handoff runtime binding",\n    ):\n        runner_adapter.make_task_attempt_claude_handoff_runner_factory(\n            _source_only_runtime_binding(),\n            resolve_inputs,\n        )\n\n    assert resolved is False\n\n\n'''
          assert text.count(anchor) == 1, 'test insertion seam drifted'
          text = text.replace(anchor, addition + anchor)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Verify runner admission bridge
        run: |
          python -m py_compile daedalus/ikarus_runtime_role.py daedalus/ikarus_claude_task_attempt_runner.py tests/test_ikarus_runtime_role.py tests/test_ikarus_claude_task_attempt_runner.py
          python -m pytest -q -p no:cacheprovider tests/test_ikarus_runtime_role.py tests/test_ikarus_supervisor_attempt_identity.py tests/test_ikarus_claude_task_attempt_runner.py
          git diff --check
      - name: Commit bounded cut and remove temporary workflow
        run: |
          git config user.name "daedalus-automation"
          git config user.email "daedalus-automation@users.noreply.github.com"
          git rm .github/workflows/zz-ikarus-runner-admission-bridge.yml
          git add daedalus/ikarus_claude_task_attempt_runner.py tests/test_ikarus_claude_task_attempt_runner.py
          git diff --cached --check
          git commit -m "fix(ikarus): require admitted Claude runner handoff"
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
