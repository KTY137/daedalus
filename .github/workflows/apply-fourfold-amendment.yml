name: Apply Fourfold plan amendment

on:
  push:
    branches:
      - core/fourfold-v2
    paths:
      - ".github/workflows/apply-fourfold-amendment.yml"

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: core/fourfold-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply owner-approved amendment atomically
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          root = Path(".")
          expected_base = "a47d84ee736fcaebd76f4309f4e0653f536415b9bda9e04940920ca1896026d4"
          current = (root / "docs/IKARUS_ARIADNE_MASTER_PLAN.md").read_bytes()
          normalized = current.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          actual = hashlib.sha256(normalized).hexdigest()
          if actual != expected_base:
              raise SystemExit(f"refusing stale amendment base: {actual}")

          mapping = {
              "plan.gz.b64": "docs/IKARUS_ARIADNE_MASTER_PLAN.md",
              "ledger.gz.b64": "docs/IKARUS_ARIADNE_MASTER_PLAN.amendments.jsonl",
              "test.gz.b64": "tests/test_iron_plan_guard.py",
              "execution.gz.b64": "docs/FOURFOLD_V2_EXECUTION_PLAN.md",
          }
          for payload_name, target in mapping.items():
              encoded = (
                  root / "tools/amendment_payloads" / payload_name
              ).read_text(encoding="ascii").strip()
              raw = gzip.decompress(base64.b64decode(encoded))
              path = root / target
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)

          for path in (root / "tools/amendment_payloads").glob("*"):
              path.unlink()
          (root / "tools/amendment_payloads").rmdir()
          Path(".github/workflows/apply-fourfold-amendment.yml").unlink()
          PY
      - name: Verify amended policy and tests
        run: |
          python tools/iron_plan_guard.py verify
          python -m unittest tests.test_iron_plan_guard -v
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/twin/test_fourfold_contracts.py tests/test_kernel_contracts.py
      - name: Commit amendment
        env:
          DAEDALUS_IRON_PLAN_AMENDMENT: a47d84ee736fcaebd76f4309f4e0653f536415b9bda9e04940920ca1896026d4
        run: |
          git config user.name "Daedalus Amendment Bot"
          git config user.email "actions@users.noreply.github.com"
          git config core.hooksPath .githooks
          git add -A
          git commit -m "amend(plan): add Genesis and dual-layer execution chain" \
            -m "Iron-Plan: amendment" \
            -m "Iron-Gate: 0"
          git push origin HEAD:core/fourfold-v2
