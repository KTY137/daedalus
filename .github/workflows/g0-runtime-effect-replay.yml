name: Gate 0 Runtime Effect Replay

on:
  pull_request:
    branches:
      - g0/effect-replay-integration-linear
    paths:
      - "daedalus/kernel/runtime_effect_replay.py"
      - "daedalus/kernel/effect_replay.py"
      - "daedalus/kernel/runtime_effects.py"
      - "tests/kernel/test_runtime_effect_replay_projection*.py"
      - "tests/kernel/test_effect_replay_projection*.py"
      - "scripts/run_runtime_effect_replay_projection_mutations.py"
      - "docs/work-packets/G0-RWI-20M_RUNTIME_EFFECT_REPLAY.*"
      - ".github/workflows/g0-runtime-effect-replay.yml"
      - "pyproject.toml"
  push:
    branches:
      - g0/runtime-effect-replay-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-runtime-effect-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool docs/work-packets/G0-RWI-20M_RUNTIME_EFFECT_REPLAY.json
      - run: >-
          python -m pytest -q
          tests/kernel/test_runtime_effect_replay_projection.py
          tests/kernel/test_runtime_effect_replay_projection_review.py
          tests/kernel/test_effect_replay_projection.py
          tests/kernel/test_effect_replay_projection_review.py
          tests/kernel/test_runtime_effect_admission.py
          tests/kernel/test_effect_authorization.py
          tests/gates/test_repository_write_runtime_conformance.py
          tests/gates/test_repository_write_runtime_conformance_review.py
          tests/gates/test_repository_write_guard_structure.py
          tests/gates/test_repository_write_guard_structure_review.py
          tests/gates/test_python_target_structure.py
          tests/gates/test_python_target_structure_review.py
          tests/gates/test_repository_tree.py
          tests/gates/test_repository_tree_review.py
          tests/gates/test_guard_implementation_manifest.py
          tests/gates/test_guard_implementation_manifest_review.py
          tests/gates/test_repository_write_source_anchor_semantics.py
          tests/gates/test_repository_write_source_anchor_semantics_review.py
          tests/gates/test_repository_write_evidence_origin.py
          tests/gates/test_repository_write_evidence_origin_review.py
          tests/gates/test_repository_write_evidence_materialization.py
          tests/gates/test_repository_write_evidence_materialization_review.py
          tests/gates/test_repository_write_classification.py
          tests/gates/test_repository_write_classification_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_runtime_effect_replay_projection_mutations.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-runtime-effect-replay-wheel
      - run: /tmp/daedalus-runtime-effect-replay-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-runtime-effect-replay-wheel/bin/python - <<'PY'
          from daedalus.kernel.runtime_effect_replay import (
              RuntimeEffectExecutionReplaySnapshot,
              RuntimeEffectReplayProjectionError,
              inspect_runtime_effect_execution,
          )

          assert RuntimeEffectExecutionReplaySnapshot.__dataclass_fields__
          assert issubclass(RuntimeEffectReplayProjectionError, RuntimeError)
          assert callable(inspect_runtime_effect_execution)
          PY
