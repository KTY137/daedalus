name: Owner-requested Tensor reintegration 2026-09-11

on:
  push:
    branches: [exp/tensor-kernel-contract-01]
    paths: [.github/workflows/tensor-reintegration-20260911.yml]

permissions:
  contents: write

concurrency:
  group: tensor-reintegration-20260911
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAIN_SHA: 217d5edc2b5e59441051b9cb0df60a5fbca93fe2
      TENSOR_BASE: 327b11fd43bab6fefb6007bdb427504d4fb56a2c
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize the explicitly authorized two-parent integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/integration-evidence
          git merge-base --is-ancestor "$TENSOR_BASE" HEAD
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/archive/legacy-20260830)" = 6d70b6d3788ca327ac778bbbcd06be04a4d6a398
          python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; assert datetime.now(ZoneInfo("Europe/Berlin")).date().isoformat() < "2026-09-29"'
          git config user.name 'Daedalus integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c integration-local
          git merge --no-ff --no-commit "$MAIN_SHA" || {
            python - <<'PY'
          import subprocess
          conflicts = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          allowed = {'docs/work-packets/index.json', 'tests/contracts/test_work_packet_index.py'}
          if not conflicts or not conflicts <= allowed:
              raise SystemExit(f'Unexpected merge failure/conflicts: {sorted(conflicts)}')
          for path in sorted(conflicts):
              side = '--theirs' if path == 'docs/work-packets/index.json' else '--ours'
              subprocess.run(['git', 'checkout', side, '--', path], check=True)
              subprocess.run(['git', 'add', '--', path], check=True)
          PY
          }
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('docs/work-packets/G1-DESKTOP-LOCAL-BUILD-REPAIR-20260908.md')
          original = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          assert blob == '2d9b8acba66d9922ba9346c52a18e71e79465e65', 'Desktop evidence changed'
          header = '''Packet ID: G1-DESKTOP-LOCAL-BUILD-REPAIR-20260908
          Artifact role: primary
          Active gate: 1
          Classification: ALIGNED
          Owner: repository owner
          Base revision: 24e229c0f34e5404bc219637b646386529f82035
          Dependencies: Master Plan Revision 13; canonical desktop build and smoke entrypoints

          Registry projection added during integration on 2026-09-11. The original
          report follows verbatim. This projection does not upgrade historical claims.

          ## Primary acceptance claim
          Repair the owner-selected local desktop build driver, not release admission.

          ## Scope
          See the original frozen scope below.

          ## Contracts and behavior
          Preserve application identity, policy admission, version mirrors and unrelated work.

          ## Acceptance matrix
          See Actual final build and Independent and adversarial review in the original report.

          ## Migration and rollback
          Restore only the documented script backup and scoped edits; never reset the shared checkout.

          ## Evidence expected failures and review
          The original report retains baseline failures, logs, hashes, reviews and host-only limits.

          '''
          path.write_bytes(header.encode() + original)
          path = Path('tests/twin/test_relation_block_validation_fusion.py')
          text = path.read_text()
          start = text.index('def test_from_indexed_reuses_validated_key_order_without_item_pair_copy()')
          assert '\ndef ' not in text[start:]
          replacement = '''@pytest.mark.parametrize("layout", ("canonical", "shuffled", "generic"))
          def test_from_indexed_preserves_key_value_binding_across_layouts(layout: str) -> None:
              """Exercise emitted CSR values, not the spelling of the implementation."""
              from collections import UserDict
              from daedalus.twin.semiring import NaturalSemiring

              rows, columns = _axes()
              pairs = [((0, 0), 11), ((0, 2), 23), ((1, 1), 37)]
              entries = dict(pairs if layout == "canonical" else reversed(pairs))
              if layout == "generic":
                  entries = UserDict(entries)
              before = tuple(entries.items())
              block = TypedRelationBlock._from_indexed(
                  _subject(), RelationSignature("code", "declares", "type"),
                  rows, columns, entries, NaturalSemiring(),
              )
              assert block.row_offsets == (0, 2, 3)
              assert block.column_indices == (0, 2, 1)
              assert block.values == (11, 23, 37)
              assert tuple(entries.items()) == before
          '''
          path.write_text(text[:start] + replacement)
          PY
          git add docs/work-packets/G1-DESKTOP-LOCAL-BUILD-REPAIR-20260908.md tests/twin/test_relation_block_validation_fusion.py
          python tools/index_work_packets.py --render > /tmp/work-packet-index.json
          mv /tmp/work-packet-index.json docs/work-packets/index.json
          git add docs/work-packets/index.json
          # Check OUR integration delta; preserve existing mainline CRLF/evidence bytes.
          git diff --cached --check "$MAIN_SHA"
          git commit -m 'Merge main into Tensor: execute combined contracts and preserve both histories' -m 'Explicit owner request 2026-09-11. Regenerate packet registry, retain gardener invariants, preserve original desktop evidence and replace an obsolete CSR source-string assertion with behavioral value-binding tests. No candidate promotion, release approval or history rewrite.'
          python tools/index_work_packets.py --check
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^2 > /tmp/integration-evidence/identity.txt
          git diff --stat "$MAIN_SHA" HEAD > /tmp/integration-evidence/diff-stat.txt
          git diff "$MAIN_SHA" HEAD > /tmp/integration-evidence/integration.patch
      - name: Install declared test dependencies
        run: python -m pip install '.[test,polyglot,root]'
      - name: Execute Tensor, registry, Ikarus and Ariadne integration regressions
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/twin \
            tests/contracts/test_work_packet_index.py \
            tests/test_kernel_contracts.py \
            tests/test_ariadne_test_evaluator.py \
            tests/test_ikarus_computer_loop_ariadne.py \
            tests/runtimes/test_computer_ariadne.py \
            tests/runtimes/test_computer_daedalus.py \
            tests/orchestration/test_genesis_service.py \
            tests/orchestration/test_genesis_materializer.py \
            tests/orchestration/test_genesis_source_archive.py \
            --junitxml=/tmp/integration-evidence/junit.xml \
            2>&1 | tee /tmp/integration-evidence/pytest.log
      - name: Retain actual combined-source and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensor-main-integration-${{ github.sha }}
          path: /tmp/integration-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Advance only the existing Tensor line after successful tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/exp/tensor-kernel-contract-01 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/exp/tensor-kernel-contract-01
