name: Owner-requested mainline project acceptance bootstrap

# One-shot: prepare from a content-verified reviewed script, test, remove this
# helper, and publish only a descendant of the exact owner-requested main HEAD.
on:
  push:
    branches: [main]
    paths: [.github/workflows/tensor-reintegration-20260911.yml]
permissions:
  contents: write
concurrency:
  group: owner-project-acceptance-bootstrap
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared test dependencies and preparation tools
        run: python -m pip install '.[test,polyglot,root]' pyyaml tzdata
      - name: Prepare the reviewed mainline acceptance change
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/project-acceptance"
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          import yaml
          # Fetch bytes at the reviewed immutable blob, not a mutable branch.
          # Keeping its GitHub expressions out of this run block also prevents
          # eager expansion into a stale SHA or an absolute Windows path.
          blob = 'b284fb506d0af4fed283dada5e1d3b7e0d8efc0a'
          request = urllib.request.Request(
              'https://api.github.com/repos/KTY137/daedalus/git/blobs/' + blob,
              headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'Daedalus-acceptance'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          raw = base64.b64decode(payload['content'])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == blob
          steps = yaml.safe_load(raw)['jobs']['acceptance']['steps']
          script, = [step['run'] for step in steps if step.get('name') == 'Prepare bounded mainline acceptance change']

          # The exact-head Windows run 34601228085 proved the bootstrap itself
          # executed, then the old acceptance fixture failed closed because its
          # negative control appended an identifier to a complete return
          # statement, which cannot parse. Keep the reviewed preparation script
          # unchanged except for its content-addressed test fixture. The new
          # fixture uses an expression fragment so the negative arm can be
          # judged, and it asserts the retained/redacted failure contract rather
          # than requiring a host-path-bearing internal error message.
          old_test_blob = '7816e8f47bcf643bb4739f6d73a004b47b60df08'
          corrected_test_blob = '8ae808398441b7663aaa277bb674cb4096ef0b94'
          old_binding = "test_blob = '" + old_test_blob + "'"
          new_binding = "test_blob = '" + corrected_test_blob + "'"
          assert script.count(old_binding) == 1
          script = script.replace(old_binding, new_binding)
          Path(os.environ['RUNNER_TEMP'], 'acceptance-prepare.sh').write_text(script, encoding='utf-8', newline='\n')
          PY
          bash "$RUNNER_TEMP/acceptance-prepare.sh"
      - name: Validate permanent workflow and Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          text = Path('.github/workflows/g1-ikarus-effect-bridge.yml').read_text()
          workflow = yaml.safe_load(text)
          assert 'focused' in workflow['jobs'] and 'project-acceptance' in workflow['jobs']
          assert '$' + '{{ github.sha }}' in text and '$' + '{{ runner.temp }}' in text
          for path in ('tests/test_ikarus_project_acceptance.py', 'daedalus/runtimes/computer_ariadne.py', 'daedalus/runtimes/computer.py'):
              compile(Path(path).read_text(), path, 'exec')
          PY
      - name: Execute real project acceptance and Genesis regressions
        env:
          DAEDALUS_PROJECT_ACCEPTANCE: '1'
          PYTHONHASHSEED: '0'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider tests/test_ikarus_project_acceptance.py tests/runtimes/test_computer_ariadne.py tests/test_ikarus_computer_loop_ariadne.py tests/orchestration/test_genesis_service.py tests/orchestration/test_genesis_materializer.py tests/orchestration/test_genesis_source_archive.py --junitxml="$RUNNER_TEMP/project-acceptance/junit.xml" 2>&1 | tee "$RUNNER_TEMP/project-acceptance/pytest.log"
      - name: Retain actual acceptance evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-project-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/project-acceptance/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish only tested main descendant without racing another writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          test "$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/main