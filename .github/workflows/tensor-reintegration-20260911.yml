name: Owner-requested mainline project acceptance bootstrap

# Reuses the remaining one-shot integration helper, then deletes itself.
# Only publishes a tested descendant of its exact main SHA; never force pushes.
on:
  push:
    branches: [main]
    paths: [.github/workflows/tensor-reintegration-20260911.yml]
permissions:
  contents: write
concurrency:
  group: owner-project-acceptance-bootstrap
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare bounded mainline acceptance change
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          assert datetime.now(ZoneInfo('Europe/Berlin')).date().isoformat() < '2026-09-29'
          import base64, hashlib, json, urllib.request
          from pathlib import Path
          test_blob = '7816e8f47bcf643bb4739f6d73a004b47b60df08'
          request = urllib.request.Request(
              'https://api.github.com/repos/KTY137/daedalus/git/blobs/' + test_blob,
              headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'Daedalus-acceptance'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              material = json.load(response)
          raw = base64.b64decode(material['content'])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == test_blob
          target = Path('tests/test_ikarus_project_acceptance.py')
          assert not target.exists(), 'Another writer owns the acceptance test now'
          target.write_bytes(raw)

          target = Path('daedalus/runtimes/computer_ariadne.py')
          source = target.read_text(encoding='utf-8')
          old = '        result = {\n            "schema": RESULT_SCHEMA,'
          new = '''        # Project the caller-bound judge truthfully, without granting trust.
                  # TestCommandEvaluator uses candidate self-reports, not an independent
                  # proof of autonomous improvement or authorization to promote.
                  metric_names = data.get("metric_names")
                  if metric_names == ["tests_pass"]:
                      evaluator_label = "ariadne-test-command-evaluator (candidate self-report)"
                      evaluator_note = (
                          "the caller-frozen project test verdict is candidate self-report; "
                          "passing supports non-regression, not autonomous improvement"
                      )
                  elif metric_names is None or metric_names == ["exact_match"]:
                      evaluator_label = EVALUATOR_LABEL
                      evaluator_note = "the frozen exact-match evaluator proves the machinery, not improvement"
                  else:
                      evaluator_label = "unrecognized campaign evaluator (unverified)"
                      evaluator_note = "the evaluator kind is unrecognized; no test or improvement claim is made"
                  result = {
                      "schema": RESULT_SCHEMA,'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          assert source.count('"evaluator": EVALUATOR_LABEL,') == 1
          source = source.replace('"evaluator": EVALUATOR_LABEL,', '"evaluator": evaluator_label,')
          old = '''            "note": ("nominated candidates are content-addressed evidence under the subject's control root; "
                               "nothing was applied to any checkout, and the frozen exact-match evaluator proves the "
                               "machinery, not improvement"),'''
          new = '''            "note": ("nominated candidates are content-addressed evidence under the subject's control root; "
                               "nothing was applied to any checkout, and " + evaluator_note),'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          source = source.replace(
              "Honesty (G1-SELF-01, master plan §8.1): the campaign's evaluator is the\nfrozen exact-match evaluator; a nomination proves isolation, provenance,\nbudget equality and non-application, not improvement. The result says so.",
              "Honesty (G1-SELF-01, master plan §8.1): exact-match is the default; a\ncaller may bind project tests instead. The projection names that judge and\nits candidate-self-report limitation. Nomination is never improvement proof.",
          )
          source = source.replace("#: The frozen evaluator's name in the receipt and in every result.",
                                  "#: The default frozen evaluator's name in historical and exact-match results.")
          target.write_text(source, encoding='utf-8', newline='\n')

          target = Path('daedalus/runtimes/computer.py')
          source = target.read_text(encoding='utf-8')
          old = '        "The evaluator is the frozen exact-match evaluator: a nomination proves the machinery, not improvement. "'
          new = '''        "By default the frozen exact-match evaluator proves the machinery, not improvement. "
                  "A caller may instead freeze project tests; the observation names their self-reported verdict. "'''
          assert source.count(old) == 1
          target.write_text(source.replace(old, new), encoding='utf-8', newline='\n')

          target = Path('.github/workflows/g1-ikarus-effect-bridge.yml')
          source = target.read_text(encoding='utf-8')
          old = '  push:\n    branches:\n      - g1/ikarus-effect-bridge-06\n'
          new = '''  push:
              branches:
                - main
                - g1/ikarus-effect-bridge-06
              paths:
                - "daedalus/orchestration/ikarus/**"
                - "daedalus/orchestration/genesis/**"
                - "daedalus/runtimes/computer*"
                - "daedalus/ariadne/**"
                - "tests/test_ikarus_project_acceptance.py"
                - ".github/workflows/g1-ikarus-effect-bridge.yml"
          '''
          assert source.count(old) == 1
          source = source.replace(old, new)
          anchor = '      - "tests/test_ikarus_effect_bridge.py"'
          assert source.count(anchor) == 1
          source = source.replace(anchor, '''      - "tests/test_ikarus_project_acceptance.py"
                - "daedalus/orchestration/genesis/**"
                - "daedalus/runtimes/computer*"
                - "daedalus/ariadne/**"
          ''' + anchor)
          source += '''
            project-acceptance:
              runs-on: windows-latest
              timeout-minutes: 30
              env:
                DAEDALUS_PROJECT_ACCEPTANCE: "1"
                PYTHONHASHSEED: "0"
                PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
              steps:
                - name: Preserve committed source bytes
                  shell: bash
                  run: git config --global core.autocrlf false
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - name: Install declared project-test dependencies
                  run: python -m pip install '.[test,polyglot,root]'
                - name: Execute full-repository Ikarus/Ariadne acceptance and Genesis regressions
                  shell: bash
                  run: |
                    mkdir -p "$RUNNER_TEMP/project-acceptance"
                    git show -s --format='%H%n%P%n%T' HEAD > "$RUNNER_TEMP/project-acceptance/source.txt"
                    python -m pytest -q -p no:cacheprovider tests/test_ikarus_project_acceptance.py tests/runtimes/test_computer_ariadne.py tests/test_ikarus_computer_loop_ariadne.py tests/orchestration/test_genesis_service.py tests/orchestration/test_genesis_materializer.py tests/orchestration/test_genesis_source_archive.py --junitxml="$RUNNER_TEMP/project-acceptance/junit.xml"
                - name: Retain measured outcomes, including failures
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: project-acceptance-${{ github.sha }}
                    path: ${{ runner.temp }}/project-acceptance/
                    if-no-files-found: error
                    retention-days: 14
          '''
          target.write_text(source, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/tensor-reintegration-20260911.yml
          git add tests/test_ikarus_project_acceptance.py daedalus/runtimes/computer_ariadne.py daedalus/runtimes/computer.py .github/workflows/g1-ikarus-effect-bridge.yml
          git diff --cached --check
          git config user.name 'Daedalus project acceptance'
          git config user.email 'integration@users.noreply.github.com'
          git commit -m 'test: exercise real Ikarus/Ariadne refactoring of the complete repository on main' -m 'Explicit owner request. Scripted planner, real service/leases/contained pytest/CAS; compare baseline, negative control and candidate; reject semantic regression; never apply or promote candidates. Correct the projected evaluator label without upgrading self-reported verdicts. Reuse existing Ikarus CI owner and remove the temporary integration helper.'
          mkdir -p "$RUNNER_TEMP/project-acceptance"
          git show -s --format='%H%n%P%n%T' HEAD > "$RUNNER_TEMP/project-acceptance/source.txt"
          git diff "$GITHUB_SHA" HEAD > "$RUNNER_TEMP/project-acceptance/change.patch"
      - name: Install declared test dependencies
        run: python -m pip install '.[test,polyglot,root]' pyyaml
      - name: Validate the permanent workflow and Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/g1-ikarus-effect-bridge.yml').read_text())
          assert 'focused' in workflow['jobs'] and 'project-acceptance' in workflow['jobs']
          for path in ('tests/test_ikarus_project_acceptance.py', 'daedalus/runtimes/computer_ariadne.py', 'daedalus/runtimes/computer.py'):
              compile(Path(path).read_text(), path, 'exec')
          PY
      - name: Execute real project acceptance, not mocked effects
        env:
          DAEDALUS_PROJECT_ACCEPTANCE: '1'
          PYTHONHASHSEED: '0'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider tests/test_ikarus_project_acceptance.py tests/runtimes/test_computer_ariadne.py tests/test_ikarus_computer_loop_ariadne.py tests/orchestration/test_genesis_service.py tests/orchestration/test_genesis_materializer.py tests/orchestration/test_genesis_source_archive.py --junitxml="$RUNNER_TEMP/project-acceptance/junit.xml" 2>&1 | tee "$RUNNER_TEMP/project-acceptance/pytest.log"
      - name: Retain actual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-project-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/project-acceptance/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish only tested main descendant without racing another writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          test "$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/main
