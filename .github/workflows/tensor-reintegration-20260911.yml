name: Owner-requested Tensor reintegration 2026-09-11

on:
  push:
    branches: [exp/tensor-kernel-contract-01]
    paths: [.github/workflows/tensor-reintegration-20260911.yml]

permissions:
  contents: write

concurrency:
  group: tensor-reintegration-20260911
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAIN_SHA: 217d5edc2b5e59441051b9cb0df60a5fbca93fe2
      TENSOR_BASE: 327b11fd43bab6fefb6007bdb427504d4fb56a2c
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize the explicitly authorized two-parent integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$TENSOR_BASE"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/archive/legacy-20260830)" = 6d70b6d3788ca327ac778bbbcd06be04a4d6a398
          git config user.name 'Daedalus integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c integration-local
          git merge --no-ff --no-commit "$MAIN_SHA" || {
            python - <<'PY'
          import subprocess
          conflicts = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          allowed = {'docs/work-packets/index.json', 'tests/contracts/test_work_packet_index.py'}
          if not conflicts or not conflicts <= allowed:
              raise SystemExit(f'Unexpected merge failure/conflicts: {sorted(conflicts)}')
          for path in sorted(conflicts):
              side = '--theirs' if path == 'docs/work-packets/index.json' else '--ours'
              subprocess.run(['git', 'checkout', side, '--', path], check=True)
              subprocess.run(['git', 'add', '--', path], check=True)
          PY
          }
          python tools/index_work_packets.py --render > /tmp/work-packet-index.json
          mv /tmp/work-packet-index.json docs/work-packets/index.json
          git add docs/work-packets/index.json
          git diff --cached --check
          git commit -m 'Merge current main into canonical Tensor line for owner-requested integration' -m 'Owner explicitly requested Tensor reintegration and subsequent mainline work on 2026-09-11. Preserve both histories, all mainline Ikarus/Ariadne changes, and frozen archive. Resolve only generated packet registry and retain gardener-owned invariant tests. No candidate promotion or release approval.'
          python tools/index_work_packets.py --check
          mkdir -p /tmp/integration-evidence
          git rev-parse HEAD HEAD^{tree} HEAD^ HEAD^2 > /tmp/integration-evidence/identity.txt
          git diff --stat "$MAIN_SHA" HEAD > /tmp/integration-evidence/diff-stat.txt
          git archive --format=tar.gz --output=/tmp/integration-evidence/source.tar.gz HEAD
      - name: Install declared test dependencies
        run: python -m pip install '.[test,polyglot,root]'
      - name: Execute Tensor, registry, Ikarus and Ariadne integration regressions
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/twin \
            tests/contracts/test_work_packet_index.py \
            tests/test_kernel_contracts.py \
            tests/test_ariadne_test_evaluator.py \
            tests/test_ikarus_computer_loop_ariadne.py \
            tests/runtimes/test_computer_ariadne.py \
            tests/runtimes/test_computer_daedalus.py \
            --junitxml=/tmp/integration-evidence/junit.xml \
            2>&1 | tee /tmp/integration-evidence/pytest.log
      - name: Retain actual combined-source and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensor-main-integration-${{ github.sha }}
          path: /tmp/integration-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Advance only the existing Tensor line after successful tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/exp/tensor-kernel-contract-01 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/exp/tensor-kernel-contract-01
