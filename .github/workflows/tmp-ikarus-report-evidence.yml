name: Temporary Ikarus report execution evidence patch

on:
  push:
    branches:
      - g1/ikarus-runtime-invocation-binding-07d3
    paths:
      - .github/workflows/tmp-ikarus-report-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): add temporary report evidence workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g1/ikarus-runtime-invocation-binding-07d3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch terminal report projection and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('daedalus/file_bridge.py')
          text = path.read_text(encoding='utf-8')
          old = '''    return {
              "name": path.name,
              "status": payload.get("bridge_status") or "?",
              "lane": payload.get("lane") or request.get("lane") or "?",
              "project": request.get("project") or "",
              "summary": " ".join(str(summary).split())[:160],  # one line for the console
          }
          '''
          new = '''    return {
              "name": path.name,
              "status": payload.get("bridge_status") or "?",
              "lane": payload.get("lane") or request.get("lane") or "?",
              "project": request.get("project") or "",
              # Execution attribution is copied only from the terminal report
              # itself. Request/chat metadata must never be promoted into an
              # agent identity because routing may change after enqueue.
              "agent": payload.get("agent") or "",
              "summary": " ".join(str(summary).split())[:160],  # one line for the console
          }
          '''
          if old not in text:
              raise SystemExit('expected _report_brief block not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_bridge_report_execution_evidence.py')
          test.write_text('''import json\n\nfrom daedalus import file_bridge\n\n\ndef test_report_brief_projects_terminal_agent_evidence_only(tmp_path):\n    report = tmp_path / "task.report.json"\n    report.write_text(\n        json.dumps(\n            {\n                "request": {\n                    "project": "project_tct",\n                    "lane": "claude",\n                    "agent": "request-agent-must-not-win",\n                },\n                "bridge_status": "done",\n                "lane": "claude",\n                "agent": "qa-critic",\n                "report": {"summary": "  verified   terminal evidence  "},\n            }\n        ),\n        encoding="utf-8",\n    )\n\n    assert file_bridge._report_brief(report) == {\n        "name": "task.report.json",\n        "status": "done",\n        "lane": "claude",\n        "project": "project_tct",\n        "agent": "qa-critic",\n        "summary": "verified terminal evidence",\n    }\n\n\ndef test_report_brief_never_invents_agent_from_request(tmp_path):\n    report = tmp_path / "task.report.json"\n    report.write_text(\n        json.dumps(\n            {\n                "request": {\n                    "project": "project_tct",\n                    "lane": "local_only",\n                    "agent": "request-agent-must-not-be-promoted",\n                },\n                "bridge_status": "failed",\n                "error": "executor unavailable",\n            }\n        ),\n        encoding="utf-8",\n    )\n\n    brief = file_bridge._report_brief(report)\n    assert brief["agent"] == ""\n    assert brief["summary"] == "executor unavailable"\n\n\ndef test_project_report_projection_carries_terminal_agent_to_live_bus(tmp_path, monkeypatch):\n    monkeypatch.setattr(file_bridge, "INBOX", tmp_path)\n    report = tmp_path / "task.report.json"\n    report.write_text(\n        json.dumps(\n            {\n                "request": {"project": "project_tct", "lane": "codex"},\n                "bridge_status": "done",\n                "lane": "codex",\n                "agent": "core-dev",\n                "report": {"summary": "finished"},\n            }\n        ),\n        encoding="utf-8",\n    )\n\n    rows = file_bridge._project_report_briefs("project_tct")\n    assert len(rows) == 1\n    assert rows[0]["agent"] == "core-dev"\n''', encoding='utf-8')
          PY
      - name: Verify focused bridge evidence tests
        run: |
          python -m py_compile daedalus/file_bridge.py tests/test_bridge_report_execution_evidence.py
          python -m pytest -q tests/test_bridge_report_execution_evidence.py tests/test_bridge_signals.py
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daedalus/file_bridge.py tests/test_bridge_report_execution_evidence.py
          git commit -m 'feat(web): carry terminal agent evidence into live reports'
          git push origin HEAD:g1/ikarus-runtime-invocation-binding-07d3
