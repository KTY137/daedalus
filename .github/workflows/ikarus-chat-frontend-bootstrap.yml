name: Ikarus chat frontend migration

on:
  push:
    branches: [feature/ikarus-llm-chat-ui]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ikarus-llm-chat-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Repair migration script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/_automation_ikarus_chat_frontend.py')
          s = p.read_text(encoding='utf-8')

          timeout_old = '''replace_once("daedalus/ikarus_os.py", '            timeout_s=120, extra={"max_tokens": _effort_cap(effort)},\\n', '            timeout_s=timeout_s, extra={"max_tokens": _effort_cap(effort)},\\n')'''
          timeout_new = '''text = read("daedalus/ikarus_os.py")
          old = '            timeout_s=120, extra={"max_tokens": _effort_cap(effort)},\\n'
          if old not in text:
              raise RuntimeError("ollama blocking timeout occurrence missing")
          write("daedalus/ikarus_os.py", text.replace(old, '            timeout_s=timeout_s, extra={"max_tokens": _effort_cap(effort)},\\n', 1))'''
          if timeout_old not in s:
              raise SystemExit('timeout migration repair target not found')
          s = s.replace(timeout_old, timeout_new, 1)

          help_old = '''replace_once("daedalus/ikarus_os.py",
                       '            "Choose a runtime to give me a language brain (local Ollama is free)."\\n',
                       '            "Automatic chat selects an available language model; the local index remains available for measured answers."\\n')'''
          if help_old not in s:
              raise SystemExit('help-text migration repair target not found')
          s = s.replace(help_old, '# Optional help-text copy change skipped: routing semantics are implemented above.', 1)

          heading_old = '''      const Tag = `h${Math.min(4, heading[1].length + 1)}` as keyof JSX.IntrinsicElements;
                nodes.push(<Tag key={key++}>{inline(heading[2])}</Tag>);'''
          heading_new = '''      const level = Math.min(4, heading[1].length + 1);
                const body = inline(heading[2]);
                if (level === 2) nodes.push(<h2 key={key++}>{body}</h2>);
                else if (level === 3) nodes.push(<h3 key={key++}>{body}</h3>);
                else nodes.push(<h4 key={key++}>{body}</h4>);'''
          if heading_old not in s:
              raise SystemExit('Markdown heading typing repair target not found')
          s = s.replace(heading_old, heading_new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply migration
        run: python tools/_automation_ikarus_chat_frontend.py
      - name: Python syntax
        run: python -m py_compile daedalus/llm_client.py daedalus/ikarus_os.py
      - name: Python focused tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest tests/test_llm_client.py tests/test_ikarus_llm_voice.py -q
      - name: Frontend typecheck and build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Commit verified migration
        run: |
          rm -f tools/_automation_ikarus_chat_frontend.py .github/workflows/ikarus-chat-frontend-bootstrap.yml .automation-trigger*
          git config user.name 'Daedalus Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: make Ikarus chat LLM-first and conversational'
          git push origin HEAD:feature/ikarus-llm-chat-ui
