name: Ikarus chat frontend migration

on:
  push:
    branches: [feature/ikarus-llm-chat-ui]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ikarus-llm-chat-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Apply migration
        run: python tools/_automation_ikarus_chat_frontend.py
      - name: Python syntax
        run: python -m py_compile daedalus/llm_client.py daedalus/ikarus_os.py
      - name: Python focused tests
        run: |
          python -m pip install -e '.[test]'
          python -m pytest tests/test_llm_client.py tests/test_ikarus_llm_voice.py -q
      - name: Frontend typecheck and build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Commit verified migration
        run: |
          rm -f tools/_automation_ikarus_chat_frontend.py .github/workflows/ikarus-chat-frontend-bootstrap.yml
          git config user.name 'Daedalus Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: make Ikarus chat LLM-first and conversational'
          git push origin HEAD:feature/ikarus-llm-chat-ui
