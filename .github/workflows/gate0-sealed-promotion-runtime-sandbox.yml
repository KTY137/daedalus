name: Gate 0 Sealed Promotion Runtime Sandbox

on:
  pull_request:
    branches:
      - g0/fourfold-evidence-binding
    paths:
      - "daedalus/kernel/**"
      - "daedalus/kairos/gated_writes.py"
      - "daedalus/spine/effect_boundary.py"
      - "daedalus/gates/report.py"
      - "tests/kernel/**"
      - "tests/gates/test_gate_report.py"
      - "tests/test_effect_boundary.py"
      - "docs/work-packets/G0-WP-04_SEALED_PROMOTION_RUNTIME_SANDBOX.md"
      - ".github/workflows/gate0-sealed-promotion-runtime-sandbox.yml"
  push:
    branches:
      - g0/sealed-promotion-runtime-sandbox
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate0-sealed-promotion-runtime-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python tools/iron_plan_guard.py verify
      - run: >-
          python -m pytest -q
          tests/kernel/test_owner_approval.py
          tests/kernel/test_sealed_promotion.py
          tests/kernel/test_runtime_conformance_harness.py
          tests/kernel/test_docker_sandbox_policy.py
          tests/kernel/test_fourfold_evidence.py
          tests/kernel/test_fourfold_approval_integration.py
          tests/gates/test_gate_report.py
          tests/test_effect_boundary.py

  isolated-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-wheel
      - run: /tmp/daedalus-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        run: >-
          /tmp/daedalus-wheel/bin/python -c
          "from daedalus.kernel import authorize_promotion, run_in_docker_sandbox, assemble_recorded_conformance"
