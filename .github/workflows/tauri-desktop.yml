name: Tauri Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "daedalus/**"
      - "packaging/**"
      - "scripts/daedalus_desktop_sidecar.py"
      - "tools/build_tauri_sidecar.py"
      - "tools/select_desktop_release_assets.py"
      - "tools/smoke_tauri_sidecar.py"
      - "tests/test_desktop_packaging.py"
      - "tests/test_desktop_runtime.py"
      - "tests/test_desktop_startup_nonce.py"
      - "tests/test_project_registration.py"
      - "pyproject.toml"
      - ".github/workflows/tauri-desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "daedalus/**"
      - "packaging/**"
      - "scripts/daedalus_desktop_sidecar.py"
      - "tools/build_tauri_sidecar.py"
      - "tools/select_desktop_release_assets.py"
      - "tools/smoke_tauri_sidecar.py"
      - "tests/test_desktop_packaging.py"
      - "tests/test_desktop_runtime.py"
      - "tests/test_desktop_startup_nonce.py"
      - "tests/test_project_registration.py"
      - "pyproject.toml"
      - ".github/workflows/tauri-desktop.yml"
  workflow_dispatch:

# Cost policy:
# - pull requests validate one Linux desktop build only;
# - trusted main pushes and explicit manual runs exercise the full platform matrix;
# - only the newest commit in a burst may consume release runners or publish;
# - release credentials exist only in the push-to-main publish job.
permissions:
  contents: read

concurrency:
  group: tauri-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-linux:
    name: Linux x86-64 PR validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install cockpit dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build cockpit
        working-directory: apps/web
        run: npm run build

      # 6.22.1 fixes GHSA-9fxf-4qw3-ghmr (2026-08-15). Keep this exact:
      # packaging must not bake a known unsafe bootloader into a release.
      - name: Install Python build/test dependencies
        run: python -m pip install -e ".[test]" pyinstaller==6.22.1

      - name: Build frozen Daedalus backend
        run: python tools/build_tauri_sidecar.py --target "x86_64-unknown-linux-gnu"

      - name: Smoke-test frozen backend and cockpit
        run: python tools/smoke_tauri_sidecar.py

      - name: Project and desktop contract tests
        run: >-
          python -m pytest -q
          tests/test_desktop_packaging.py
          tests/test_desktop_runtime.py
          tests/test_desktop_startup_nonce.py
          tests/test_project_registration.py

      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.4

      - name: Generate desktop icons
        working-directory: apps/web
        run: tauri icon src-tauri/icons/icon.svg

      - name: Rust formatting
        run: cargo fmt --manifest-path apps/web/src-tauri/Cargo.toml -- --check

      - name: Rust library tests
        run: cargo test --manifest-path apps/web/src-tauri/Cargo.toml --lib --locked

      - name: Build Linux validation desktop bundle
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/web
          tauriScript: tauri
          args: --bundles appimage,deb
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: daedalus-desktop-pr-linux-[arch]-[bundle]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

  desktop-release:
    name: ${{ matrix.label }}
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86-64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: --bundles nsis
          - label: Linux x86-64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri_args: --bundles appimage,deb
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles app,dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install cockpit dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build cockpit
        working-directory: apps/web
        run: npm run build

      # 6.22.1 fixes GHSA-9fxf-4qw3-ghmr (2026-08-15). Keep this exact:
      # packaging must not bake a known unsafe bootloader into a release.
      - name: Install Python build/test dependencies
        run: python -m pip install -e ".[test]" pyinstaller==6.22.1

      - name: Build frozen Daedalus backend
        run: python tools/build_tauri_sidecar.py --target "${{ matrix.target }}"

      - name: Smoke-test frozen backend and cockpit
        run: python tools/smoke_tauri_sidecar.py

      - name: Project and desktop contract tests
        run: >-
          python -m pytest -q
          tests/test_desktop_packaging.py
          tests/test_desktop_runtime.py
          tests/test_desktop_startup_nonce.py
          tests/test_project_registration.py

      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.4

      - name: Generate desktop icons
        working-directory: apps/web
        run: tauri icon src-tauri/icons/icon.svg

      - name: Rust formatting
        run: cargo fmt --manifest-path apps/web/src-tauri/Cargo.toml -- --check

      - name: Rust library tests
        run: cargo test --manifest-path apps/web/src-tauri/Cargo.toml --lib --locked

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/web
          tauriScript: tauri
          args: ${{ matrix.tauri_args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: daedalus-desktop-[platform]-[arch]-[bundle]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Verify macOS arm64 bundle architecture
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          # PyInstaller is a native build. Refuse an Intel runner or a mixed
          # target/app/sidecar bundle instead of publishing an ARM-labelled app
          # whose embedded backend cannot execute on Apple Silicon.
          python tools/select_desktop_release_assets.py verify-macos-arm64 \
            apps/web/src-tauri/target/aarch64-apple-darwin/release/bundle/macos \
            apps/web/src-tauri/backend \
            "$RUNNER_ARCH" \
            "${{ matrix.target }}"

      - name: Archive exactly one macOS application bundle
        if: startsWith(matrix.platform, 'macos')
        id: macos_archive
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('apps/web/src-tauri/tauri.conf.json').read_text(encoding='utf-8'))['version'])
          PY
          )"
          archive="$RUNNER_TEMP/Daedalus_${VERSION}_aarch64.app.tar.gz"
          python tools/select_desktop_release_assets.py archive-macos-app \
            apps/web/src-tauri/target/aarch64-apple-darwin/release/bundle/macos \
            "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload macOS application archive
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: daedalus-desktop-macos-aarch64-app-tar-gz
          path: ${{ steps.macos_archive.outputs.archive }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish trusted-main prerelease
    if: github.event_name == 'push'
    needs: desktop-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse a superseded main build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$latest" = "$GITHUB_SHA"

      - name: Download validated desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: daedalus-desktop-*
          path: desktop-artifacts
          merge-multiple: true

      - name: Read packaged version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('apps/web/src-tauri/tauri.conf.json').read_text(encoding='utf-8'))['version'])
          PY
          )"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The macOS runner has already archived exactly one top-level `.app`
          # before workflow-artifact upload. Select one and only one of each of
          # the five public asset types; never upload expanded app internals.
          asset_list="$RUNNER_TEMP/daedalus-release-assets.list"
          python tools/select_desktop_release_assets.py select desktop-artifacts > "$asset_list"
          mapfile -d '' assets < "$asset_list"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="desktop-v${VERSION}-g${SHORT_SHA}"
          NOTES=$'Native Daedalus desktop bundles.\n\nHighlights:\n- Project registration plus an embedded OpenVSCode workspace. The IDE runtime is installed separately; Windows uses the locally built, pinned Docker image.\n- Owner-controlled execution-cap menu with bounded, custom and unbounded Daedalus resource modes. Security, authorization, evidence and promotion boundaries remain active.\n- Portable Claude/Codex runtime discovery and provider-policy propagation.\n- Ikarus as an agent surface: every answer carries the kernel\'s own receipts (route, context, refusal, provenance, dispatch), the rail lists and resumes this project\'s threads from the canonical spine, and / commands map only to existing routes.\n\nThis build also contains the integrated Fourfold/Tensor contracts, bounded hybrid retrieval, latent-ceiling harness, 2-cell semantics and retained experiment history.\n\nThis release is intentionally a prerelease: Windows artifacts are not Authenticode-signed and macOS is ad-hoc signed, not notarized. The application updater is disabled until an updater signing trust root is provisioned and validated.'
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Daedalus Desktop v${VERSION} (${SHORT_SHA})" \
            --prerelease \
            --generate-notes \
            --notes "$NOTES"
