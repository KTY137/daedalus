name: Tauri Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "daedalus/**"
      - "packaging/**"
      - "scripts/daedalus_desktop_sidecar.py"
      - "tools/build_tauri_sidecar.py"
      - "tools/gui_check.py"
      - "tools/select_desktop_release_assets.py"
      - "tools/smoke_packaged_resources.py"
      - "tools/smoke_tauri_sidecar.py"
      - "tests/**"
      - "tests/test_desktop_packaging.py"
      - "tests/test_desktop_runtime.py"
      - "tests/test_desktop_startup_nonce.py"
      - "tests/test_project_registration.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tauri-desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "daedalus/**"
      - "packaging/**"
      - "scripts/daedalus_desktop_sidecar.py"
      - "tools/build_tauri_sidecar.py"
      - "tools/gui_check.py"
      - "tools/select_desktop_release_assets.py"
      - "tools/smoke_packaged_resources.py"
      - "tools/smoke_tauri_sidecar.py"
      - "tests/**"
      - "tests/test_desktop_packaging.py"
      - "tests/test_desktop_runtime.py"
      - "tests/test_desktop_startup_nonce.py"
      - "tests/test_project_registration.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tauri-desktop.yml"
  workflow_dispatch:

# Cost policy:
# - pull requests validate one Linux desktop build only;
# - trusted main pushes and explicit manual runs exercise the full platform and
#   product-acceptance matrix;
# - only the newest commit in a burst may consume release runners or publish;
# - release credentials exist only in the push-to-main publish job.
permissions:
  contents: read

concurrency:
  group: tauri-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-linux:
    name: Linux x86-64 PR validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, pinned 2026-09-04
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Install Linux desktop dependencies
        run: |
          # The hosted image preinstalls Google's Chrome apt source. Nothing this step
          # needs comes from it, and a Hash Sum mismatch there kills the whole
          # `set -euo pipefail` step: measured 2026-09-09, Google republished the index
          # at 17:16:59Z and every Linux job after it died on `apt-get update` before a
          # single line of repository code was compiled. Dropping the list narrows the
          # flake surface and the trust surface at once; `rm -f` so an image without it
          # is not an error.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install cockpit dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build cockpit
        working-directory: apps/web
        run: npm run build

      - name: Verify committed cockpit bundle is current
        shell: bash
        run: |
          bundle_status="$(git status --porcelain -- apps/web/dist)" || {
            echo "::error::Unable to inspect the committed cockpit bundle."
            exit 1
          }
          if [[ -n "$bundle_status" ]]; then
            echo "::error::apps/web/dist is stale; run 'npm ci && npm run build' in apps/web and commit the generated bundle."
            printf '%s\n' "$bundle_status"
            git diff -- apps/web/dist
            exit 1
          fi

      # 6.22.1 fixes GHSA-9fxf-4qw3-ghmr (2026-08-15). Keep this exact:
      # packaging must not bake a known unsafe bootloader into a release.
      - name: Install Python build/test dependencies
        run: uv sync --locked --extra test --extra desktop-build --no-extra gpu

      - name: Build frozen Daedalus backend
        run: python tools/build_tauri_sidecar.py --target "x86_64-unknown-linux-gnu"

      - name: Smoke-test frozen backend and cockpit
        run: python tools/smoke_tauri_sidecar.py

      - name: Project and desktop contract tests
        run: >-
          python -m pytest -q
          tests/test_desktop_packaging.py
          tests/test_desktop_runtime.py
          tests/test_desktop_startup_nonce.py
          tests/test_project_registration.py

      - name: Generate desktop icons
        working-directory: apps/web
        run: npm exec -- tauri icon src-tauri/icons/icon.svg

      - name: Rust formatting
        run: cargo fmt --manifest-path apps/web/src-tauri/Cargo.toml -- --check

      - name: Rust library tests
        run: cargo test --manifest-path apps/web/src-tauri/Cargo.toml --lib --locked

      - name: Build Linux validation desktop bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: apps/web
          tauriScript: npm exec tauri
          args: --bundles appimage,deb
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: daedalus-desktop-pr-linux-[arch]-[bundle]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

  desktop-release:
    name: ${{ matrix.label }}
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86-64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: --bundles nsis
          - label: Linux x86-64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri_args: --bundles appimage,deb
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles app,dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, pinned 2026-09-04
        with:
          toolchain: "1.97.1"
          components: rustfmt
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # The hosted image preinstalls Google's Chrome apt source. Nothing this step
          # needs comes from it, and a Hash Sum mismatch there kills the whole
          # `set -euo pipefail` step: measured 2026-09-09, Google republished the index
          # at 17:16:59Z and every Linux job after it died on `apt-get update` before a
          # single line of repository code was compiled. Dropping the list narrows the
          # flake surface and the trust surface at once; `rm -f` so an image without it
          # is not an error.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install cockpit dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build cockpit
        working-directory: apps/web
        run: npm run build

      # 6.22.1 fixes GHSA-9fxf-4qw3-ghmr (2026-08-15). Keep this exact:
      # packaging must not bake a known unsafe bootloader into a release.
      - name: Install Python build/test dependencies
        run: uv sync --locked --extra test --extra desktop-build --no-extra gpu

      - name: Build frozen Daedalus backend
        run: python tools/build_tauri_sidecar.py --target "${{ matrix.target }}"

      - name: Smoke-test frozen backend and cockpit
        run: python tools/smoke_tauri_sidecar.py

      - name: Project and desktop contract tests
        run: >-
          python -m pytest -q
          tests/test_desktop_packaging.py
          tests/test_desktop_runtime.py
          tests/test_desktop_startup_nonce.py
          tests/test_project_registration.py

      - name: Generate desktop icons
        working-directory: apps/web
        run: npm exec -- tauri icon src-tauri/icons/icon.svg

      - name: Rust formatting
        run: cargo fmt --manifest-path apps/web/src-tauri/Cargo.toml -- --check

      - name: Rust library tests
        run: cargo test --manifest-path apps/web/src-tauri/Cargo.toml --lib --locked

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: apps/web
          tauriScript: npm exec tauri
          args: ${{ matrix.tauri_args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: daedalus-desktop-[platform]-[arch]-[bundle]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Verify macOS arm64 bundle architecture
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          # PyInstaller is a native build. Refuse an Intel runner or a mixed
          # target/app/sidecar bundle instead of publishing an ARM-labelled app
          # whose embedded backend cannot execute on Apple Silicon.
          python tools/select_desktop_release_assets.py verify-macos-arm64 \
            apps/web/src-tauri/target/aarch64-apple-darwin/release/bundle/macos \
            apps/web/src-tauri/backend \
            "$RUNNER_ARCH" \
            "${{ matrix.target }}"

      - name: Archive exactly one macOS application bundle
        if: startsWith(matrix.platform, 'macos')
        id: macos_archive
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          archive="$RUNNER_TEMP/Daedalus_${VERSION}_aarch64.app.tar.gz"
          python tools/select_desktop_release_assets.py archive-macos-app \
            apps/web/src-tauri/target/aarch64-apple-darwin/release/bundle/macos \
            "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload macOS application archive
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daedalus-desktop-macos-aarch64-app-tar-gz
          path: ${{ steps.macos_archive.outputs.archive }}
          if-no-files-found: error
          compression-level: 0

  release-acceptance:
    name: Release acceptance (full product and Linux OCI)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Prepare release evidence directory
        run: mkdir -p release-evidence

      - name: Install Python build and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --extra test --extra release-build --no-extra gpu
          uv pip check | tee release-evidence/python-dependency-check.txt

      - name: Install cockpit dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit production dependencies
        working-directory: apps/web
        shell: bash
        run: npm audit --omit=dev --json > "$GITHUB_WORKSPACE/release-evidence/npm-audit.json"

      - name: Run cockpit application specifications
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm run test:app | tee "$GITHUB_WORKSPACE/release-evidence/web-app.txt"

      - name: Run cockpit motion specifications
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm run test:motion | tee "$GITHUB_WORKSPACE/release-evidence/web-motion.txt"

      - name: Type-check cockpit
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit | tee "$GITHUB_WORKSPACE/release-evidence/typescript.txt"

      - name: Build production cockpit
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$GITHUB_WORKSPACE/release-evidence/web-build.txt"

      - name: Install and preflight rootless Podman
        shell: bash
        run: |
          set -euo pipefail
          # The hosted image preinstalls Google's Chrome apt source. Nothing this step
          # needs comes from it, and a Hash Sum mismatch there kills the whole
          # `set -euo pipefail` step: measured 2026-09-09, Google republished the index
          # at 17:16:59Z and every Linux job after it died on `apt-get update` before a
          # single line of repository code was compiled. Dropping the list narrows the
          # flake surface and the trust surface at once; `rm -f` so an image without it
          # is not an error.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y podman uidmap crun fuse-overlayfs slirp4netns
          # The hosted runner image makes /usr/share recursively writable.
          # Restore the exact authenticated package; do not bless existing bytes
          # by relaxing the kernel guard or merely changing ownership/mode.
          seccomp_path=/usr/share/containers/seccomp.json
          readlink -f "$seccomp_path" > release-evidence/seccomp-resolved-path.txt
          stat -c '%F uid=%u gid=%g mode=%a links=%h dev=%d inode=%i' "$seccomp_path" > release-evidence/seccomp-stat-before.txt
          sha256sum "$seccomp_path" > release-evidence/seccomp-before.sha256
          dpkg-query -S "$seccomp_path" > release-evidence/seccomp-package-owner.txt
          test "$(cat release-evidence/seccomp-package-owner.txt)" = "golang-github-containers-common: $seccomp_path"
          seccomp_version="$(dpkg-query -W -f='${Version}' golang-github-containers-common)"
          echo "$seccomp_version" > release-evidence/seccomp-package-version.txt
          dpkg-statoverride --list > release-evidence/dpkg-statoverrides.txt || test "$?" -eq 1
          sudo apt-get install --reinstall -y "golang-github-containers-common=$seccomp_version"
          sha256sum --check release-evidence/seccomp-before.sha256
          stat -c '%F uid=%u gid=%g mode=%a links=%h dev=%d inode=%i' "$seccomp_path" > release-evidence/seccomp-stat-after.txt
          test "$(id -u)" -ne 0
          user="$(id -un)"
          if ! awk -F: -v user="$user" \
            '$1 == user && $3 >= 65536 { found=1 } END { exit !found }' /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$user"
          fi
          if ! awk -F: -v user="$user" \
            '$1 == user && $3 >= 65536 { found=1 } END { exit !found }' /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$user"
          fi
          install -d -m 0700 "$HOME/.config/containers"
          : > "$HOME/.config/containers/mounts.conf"
          chmod 0600 "$HOME/.config/containers/mounts.conf"
          xdg_runtime="$RUNNER_TEMP/podman-xdg"
          install -d -m 0700 "$xdg_runtime"
          export XDG_RUNTIME_DIR="$xdg_runtime"
          echo "XDG_RUNTIME_DIR=$xdg_runtime" >> "$GITHUB_ENV"
          echo "DAEDALUS_LINUX_OCI_RUNTIME=/usr/bin/podman" >> "$GITHUB_ENV"
          CONTAINERS_CONF=/dev/null podman --remote=false info --format json \
            > release-evidence/podman-info.json

      - name: Run live Debian-family containment receipt
        shell: bash
        env:
          DAEDALUS_RUN_LINUX_OCI_INTEGRATION: "1"
          DAEDALUS_LINUX_OCI_IMAGE: docker.io/library/python@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
        run: |
          set -euo pipefail
          CONTAINERS_CONF=/dev/null podman --remote=false pull "$DAEDALUS_LINUX_OCI_IMAGE"
          echo "DAEDALUS_LINUX_OCI_IMAGE=$DAEDALUS_LINUX_OCI_IMAGE" >> "$GITHUB_ENV"
          printf '%s\n' "$DAEDALUS_LINUX_OCI_IMAGE" \
            > release-evidence/podman-debian-image-reference.txt
          CONTAINERS_CONF=/dev/null podman --remote=false image inspect --format json \
            "$DAEDALUS_LINUX_OCI_IMAGE" > release-evidence/podman-debian-image.json
          python -m pytest -q \
            tests/test_linux_oci_containment.py::test_live_linux_container_writes_workspace_but_not_root_and_has_no_network \
            --junitxml=release-evidence/podman-debian.xml

      - name: Run live RHEL-family containment receipt
        shell: bash
        env:
          DAEDALUS_RUN_LINUX_OCI_INTEGRATION: "1"
          DAEDALUS_LINUX_OCI_IMAGE: registry.access.redhat.com/ubi9/python-312@sha256:f9a256f5dc66ac635d854b4d80cb720846d6120606422fccbd35de1d69affd86
        run: |
          set -euo pipefail
          CONTAINERS_CONF=/dev/null podman --remote=false pull "$DAEDALUS_LINUX_OCI_IMAGE"
          printf '%s\n' "$DAEDALUS_LINUX_OCI_IMAGE" \
            > release-evidence/podman-rhel-image-reference.txt
          CONTAINERS_CONF=/dev/null podman --remote=false image inspect --format json \
            "$DAEDALUS_LINUX_OCI_IMAGE" > release-evidence/podman-rhel-image.json
          python -m pytest -q \
            tests/test_linux_oci_containment.py::test_live_linux_container_writes_workspace_but_not_root_and_has_no_network \
            --junitxml=release-evidence/podman-rhel.xml

      - name: Run release-critical Gate-1 surfaces
        run: >-
          python -m pytest -q
          --junitxml=release-evidence/gate1-surfaces.xml
          tests/kernel/test_genesis_contracts.py
          tests/kernel/test_genesis_effect_lease.py
          tests/orchestration/test_genesis_materializer.py
          tests/orchestration/test_genesis_service.py
          tests/interfaces/test_genesis_cli.py
          tests/interfaces/test_http_genesis.py
          tests/interfaces/test_http_response_disconnect.py
          tests/interfaces/test_desktop_settings_owner.py
          tests/interfaces/test_web_distribution.py
          tests/twin/test_fourfold_read_projection.py
          tests/test_ariadne_campaign_v0.py
          tests/test_ikarus_project_grounding.py
          tests/test_ikarus_os.py
          tests/test_ikarus_stream.py
          tests/test_accelerators.py
          tests/test_gpu_extra_contract.py
          tests/test_linux_oci_containment.py
          tests/test_effect_boundary.py
          tests/test_cli_effect_boundary.py
          tests/test_kernel_contracts_have_producers.py

      - name: Run complete Python suite
        run: >-
          python -m pytest -q -n auto --dist loadfile
          --junitxml=release-evidence/python-full.xml
          tests

      - name: Install Chromium with host dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium --only-shell

      - name: Exercise the built cockpit in a real browser
        env:
          DAEDALUS_GUI_SUITE_TIMEOUT_S: "900"
        run: python -m tools.gui_check --json > release-evidence/gui-check.json

      - name: Build wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m build --no-isolation --sdist --wheel --outdir release-dist
          python - <<'PY'
          from pathlib import Path

          root = Path("release-dist")
          wheels = tuple(root.glob("*.whl"))
          sdists = tuple(root.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"expected exactly one wheel and one sdist, got {wheels!r} and {sdists!r}"
              )
          PY
          sha256sum release-dist/* > release-evidence/python-distributions.sha256

      - name: Smoke installed wheel resources outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find release-dist -maxdepth 1 -type f -name '*.whl' -print)"
          test -n "$wheel"
          site="$RUNNER_TEMP/daedalus-wheel-site"
          project="$RUNNER_TEMP/daedalus-packaged-project"
          mkdir -p "$site" "$project"
          python -m pip install --no-deps --target "$site" "$wheel"
          python -I tools/smoke_packaged_resources.py \
            --site "$site" \
            --wheel "$wheel" \
            --project "$project" \
            > release-evidence/packaged-resource-smoke.json

      - name: Validate unskipped OCI tests and seal receipts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from xml.etree import ElementTree

          info = json.loads(Path("release-evidence/podman-info.json").read_text())

          def ci_get(value, key, default=None):
              if not isinstance(value, dict):
                  return default
              wanted = key.casefold()
              return next(
                  (item for name, item in value.items() if str(name).casefold() == wanted),
                  default,
              )

          host = ci_get(info, "host", {})
          security = ci_get(host, "security", {})
          expected = {"tests": 1, "failures": 0, "errors": 0, "skipped": 0}
          for slug, family, receipt_name in (
              ("debian", "debian-python", "podman-debian-receipt.json"),
              ("rhel", "rhel-ubi9-python", "podman-rhel-receipt.json"),
          ):
              junit = Path(f"release-evidence/podman-{slug}.xml")
              root = ElementTree.parse(junit).getroot()
              suites = (
                  [root]
                  if root.tag == "testsuite"
                  else list(root.findall("testsuite"))
              )
              totals = {
                  key: sum(int(suite.attrib.get(key, "0")) for suite in suites)
                  for key in ("tests", "failures", "errors", "skipped")
              }
              if totals != expected:
                  raise SystemExit(
                      f"{family} live OCI receipt is not one unskipped pass: {totals}"
                  )
              image_path = Path(f"release-evidence/podman-{slug}-image.json")
              image = json.loads(image_path.read_text())
              image = image[0] if isinstance(image, list) else image
              configured_image = Path(
                  f"release-evidence/podman-{slug}-image-reference.txt"
              ).read_text(encoding="utf-8").strip()
              receipt = {
                  "schema": "daedalus.linux-oci-release-receipt.v1",
                  "created_at": datetime.now(UTC).isoformat(),
                  "family": family,
                  "configured_image": configured_image,
                  "github_sha": os.environ["GITHUB_SHA"],
                  "image_id": ci_get(image, "Id"),
                  "local_image_digest": ci_get(image, "Digest"),
                  "repo_digests": ci_get(image, "RepoDigests", []),
                  "podman_version": ci_get(ci_get(info, "version", {}), "version"),
                  "rootless": ci_get(security, "rootless"),
                  "cgroup_version": ci_get(host, "cgroupVersion"),
                  "cgroup_controllers": ci_get(host, "cgroupControllers", []),
                  "test": "test_live_linux_container_writes_workspace_but_not_root_and_has_no_network",
                  "junit_sha256": hashlib.sha256(junit.read_bytes()).hexdigest(),
                  "junit_totals": totals,
              }
              (Path("release-evidence") / receipt_name).write_text(
                  json.dumps(receipt, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Upload release acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daedalus-release-acceptance-${{ github.sha }}
          path: |
            release-evidence/
            release-dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish trusted-main prerelease
    if: github.event_name == 'push'
    needs:
      - desktop-release
      - release-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Refuse a superseded main build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$latest" = "$GITHUB_SHA"

      - name: Download validated desktop bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: daedalus-desktop-*
          path: desktop-artifacts
          merge-multiple: true

      - name: Read packaged version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Select validated release assets without release authority
        id: release_assets
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The macOS runner has already archived exactly one top-level `.app`
          # before workflow-artifact upload. Select one and only one of each of
          # the five public asset types; never upload expanded app internals.
          asset_list="$RUNNER_TEMP/daedalus-release-assets.list"
          python tools/select_desktop_release_assets.py select desktop-artifacts "$VERSION" > "$asset_list"
          echo "asset_list=$asset_list" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_LIST: ${{ steps.release_assets.outputs.asset_list }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < "$ASSET_LIST"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="desktop-v${VERSION}-g${SHORT_SHA}"
          # immutable-tag-claim:start
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "refusing release with a non-full commit SHA: $GITHUB_SHA" >&2
            exit 1
          fi
          LATEST_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$LATEST_MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "refusing release because main advanced to $LATEST_MAIN_SHA after artifact validation" >&2
            exit 1
          fi
          TAG_REF="refs/tags/$TAG"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field "ref=$TAG_REF" \
            --raw-field "sha=$GITHUB_SHA" >/dev/null
          BOUND_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$BOUND_SHA" != "$GITHUB_SHA" ]]; then
            echo "release tag $TAG is bound to $BOUND_SHA, expected $GITHUB_SHA" >&2
            exit 1
          fi
          # immutable-tag-claim:end
          NOTES="Daedalus v${VERSION}"$' — Autonomous Super Assistant Evolver (ASAE).\n\nHighlights:\n- Ikarus Voice now feels continuous and observable: immediate start receipts, smoother streamed text, truthful phase changes, canonical cancellation and grounded project-state answers.\n- Settings are persisted transactionally before runtime adoption; unsaved drafts stay visible and provider/IDE startup failures are returned instead of being swallowed.\n- Owner-directed Genesis and the Ariadne rehearsal remain inside the canonical kernel, evidence and confirmation boundaries. ASAE does not enable automatic merge or promotion.\n- The optional CUDA 12 research recipe pins PyTorch, Newton, Warp and CuPy and performs real-device probes. Those multi-gigabyte research runtimes are explicitly excluded from every desktop bundle.\n- Project registration, the embedded OpenVSCode workspace, portable provider discovery, Fourfold/Tensor contracts and retained experimental evidence remain included.\n\nThis release is intentionally a prerelease: Windows artifacts are not Authenticode-signed and macOS is ad-hoc signed, not notarized. The application updater is disabled until an updater signing trust root is provisioned and validated.'
          NOTES+=$'\n\nSafety boundary: v0.1.6 centrally disables all workspace file tools, path-based vision and new local skill-directory selection/read; stored grants cannot reactivate them. vision.inspect and vision.ocr accept only a fresh desktop observation_id. Native v0.1.6 installers do not bundle the optional computer dependencies, so desktop capture/input, observation-backed vision/OCR and Playwright browser tools report unavailable there.'
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Daedalus v${VERSION} — Autonomous Super Assistant Evolver (ASAE)" \
            --prerelease \
            --generate-notes \
            --notes "$NOTES"
