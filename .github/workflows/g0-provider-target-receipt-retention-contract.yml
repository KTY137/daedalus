name: Gate 0 Provider Target Receipt Retention Contract

on:
  pull_request:
    branches:
      - g0/provider-target-receipt-retention-inventory-linear
    paths:
      - "daedalus/runtimes/provider/target_receipt_retention_contract.py"
      - "scripts/run_provider_target_receipt_retention_contract_mutations.py"
      - "tests/runtimes/test_provider_target_receipt_retention_contract*.py"
      - "docs/work-packets/G0-RTC-07F_PROVIDER_TARGET_RECEIPT_RETENTION_CONTRACT.*"
      - ".github/workflows/g0-provider-target-receipt-retention-contract.yml"
  push:
    branches:
      - g0/provider-target-receipt-retention-contract-linear
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-target-receipt-retention-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q daedalus tests scripts
      - run: python -m json.tool docs/work-packets/G0-RTC-07F_PROVIDER_TARGET_RECEIPT_RETENTION_CONTRACT.json
      - run: >-
          python -m pytest -q
          tests/runtimes/test_provider_target_receipt_retention_contract.py
          tests/runtimes/test_provider_target_receipt_retention_contract_review.py

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python scripts/run_provider_target_receipt_retention_contract_mutations.py

  predecessor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: >-
          python -m pytest -q
          tests/gates/test_provider_target_receipt_retention_inventory.py
          tests/gates/test_provider_target_receipt_retention_inventory_review.py
          tests/runtimes/test_provider_target_receipt_ledger.py
          tests/runtimes/test_provider_target_receipt_ledger_hardening.py
          tests/runtimes/test_provider_target_receipt_ledger_review.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q

  isolated-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-retention-contract-wheel
      - run: /tmp/daedalus-retention-contract-wheel/bin/pip install dist/*.whl
      - working-directory: /tmp
        shell: bash
        run: |
          /tmp/daedalus-retention-contract-wheel/bin/python - <<'PY'
          from daedalus.runtimes.provider.target_receipt_retention_contract import (
              ProviderTargetReceiptRetentionOperationAuthority,
              ProviderTargetReceiptRetentionOperationSubject,
              authorize_provider_target_receipt_retention_operation,
              build_provider_target_receipt_retention_operation_subject,
          )

          assert ProviderTargetReceiptRetentionOperationAuthority is not None
          assert ProviderTargetReceiptRetentionOperationSubject is not None
          assert callable(authorize_provider_target_receipt_retention_operation)
          assert callable(build_provider_target_receipt_retention_operation_subject)
          PY
