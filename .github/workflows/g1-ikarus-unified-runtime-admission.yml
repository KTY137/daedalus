name: Gate 1 Ikarus Unified Runtime Admission

on:
  push:
    branches:
      - g1/ikarus-unified-runtime-admission-07
      - g1/ikarus-provider-invocation-abi-07d2
      - g1/ikarus-runtime-invocation-binding-07d3
  pull_request:
    branches:
      - g1/ikarus-effect-bridge-06
      - main
    paths:
      - "apps/web/src/App.tsx"
      - "apps/web/src/types.ts"
      - "apps/web/tests/_app.ts"
      - "apps/web/tests/classic-stream.spec.ts"
      - "daedalus/claude_bridge.py"
      - "daedalus/ikarus_effect_bridge.py"
      - "daedalus/ikarus_oneshot.py"
      - "daedalus/ikarus_tool_scope.py"
      - "daedalus/ikarus_os.py"
      - "daedalus/llm_client.py"
      - "daedalus/progress_sources.py"
      - "daedalus/runtime_registry.py"
      - "daedalus/providers/_ollama_native.py"
      - "daedalus/providers/claude_cli.py"
      - "daedalus/providers/claude_sealed_operation.py"
      - "daedalus/providers/ollama.py"
      - "daedalus/runtimes/provider_executable_pre_admission.py"
      - "daedalus/runtimes/provider_executable_object_registry.py"
      - "daedalus/runtimes/provider_runtime_executable_binding.py"
      - "daedalus/runtimes/provider_invocation_payload.py"
      - "daedalus/runtimes/provider_invocation_abi.py"
      - "daedalus/runtimes/provider_runtime_invocation_binding.py"
      - "daedalus/runtimes/sealed_broker.py"
      - "tools/gui_check.py"
      - "tests/providers/test_claude_bypass_inventory.py"
      - "tests/providers/test_claude_sealed_cutover.py"
      - "tests/test_claude_bridge_cmd_shim.py"
      - "tests/test_gui_check_budget.py"
      - "tests/test_ikarus_bridge_progress.py"
      - "tests/test_ikarus_effect_bridge.py"
      - "tests/test_ikarus_oneshot.py"
      - "tests/test_ikarus_tool_scope.py"
      - "tests/test_ikarus_stream.py"
      - "tests/test_ikarus_os_boundary.py"
      - "tests/test_llm_client.py"
      - "tests/test_runtime_registry_claude_shim.py"
      - "tests/test_runtime_registry_singleflight.py"
      - "tests/runtimes/test_provider_executable_pre_admission.py"
      - "tests/runtimes/test_provider_executable_pre_admission_review.py"
      - "tests/runtimes/test_provider_executable_object_registry.py"
      - "tests/runtimes/test_provider_executable_object_registry_review.py"
      - "tests/runtimes/test_provider_runtime_executable_binding.py"
      - "tests/runtimes/test_provider_runtime_executable_binding_review.py"
      - "tests/runtimes/test_provider_invocation_payload.py"
      - "tests/runtimes/test_provider_invocation_payload_review.py"
      - "tests/runtimes/test_provider_invocation_abi.py"
      - "tests/runtimes/test_provider_invocation_abi_review.py"
      - "tests/runtimes/test_provider_runtime_invocation_binding.py"
      - "tests/runtimes/test_provider_runtime_invocation_binding_review.py"
      - "tests/runtimes/test_sealed_runtime_provider.py"
      - "docs/research/hermes-agent-v2026.8.19-provenance.json"
      - "docs/research/hermes-agent-v2026.8.27-delta-provenance.json"
      - "docs/work-packets/G1-IKARUS-07S_PROVIDER_STACK_SERIALIZATION.md"
      - "docs/work-packets/G1-IKARUS-07D1_PROVIDER_INVOCATION_PAYLOAD.md"
      - "docs/work-packets/G1-IKARUS-07D2_PROVIDER_INVOCATION_ABI.md"
      - "docs/work-packets/G1-IKARUS-07D3_RUNTIME_INVOCATION_BINDING.md"
      - ".github/workflows/g1-ikarus-unified-runtime-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-ikarus-unified-runtime-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: >-
          python -m py_compile
          daedalus/claude_bridge.py
          daedalus/ikarus_effect_bridge.py
          daedalus/ikarus_oneshot.py
          daedalus/ikarus_tool_scope.py
          daedalus/ikarus_os.py
          daedalus/llm_client.py
          daedalus/progress_sources.py
          daedalus/runtime_registry.py
          daedalus/providers/_ollama_native.py
          daedalus/providers/claude_cli.py
          daedalus/providers/claude_sealed_operation.py
          daedalus/providers/ollama.py
          daedalus/runtimes/provider_executable_pre_admission.py
          daedalus/runtimes/provider_executable_object_registry.py
          daedalus/runtimes/provider_runtime_executable_binding.py
          daedalus/runtimes/provider_invocation_payload.py
          daedalus/runtimes/provider_invocation_abi.py
          daedalus/runtimes/provider_runtime_invocation_binding.py
          daedalus/runtimes/sealed_broker.py
          tools/gui_check.py
          tests/providers/test_claude_bypass_inventory.py
          tests/providers/test_claude_sealed_cutover.py
          tests/test_claude_bridge_cmd_shim.py
          tests/test_gui_check_budget.py
          tests/test_ikarus_bridge_progress.py
          tests/test_ikarus_effect_bridge.py
          tests/test_ikarus_oneshot.py
          tests/test_ikarus_tool_scope.py
          tests/test_ikarus_stream.py
          tests/test_ikarus_os_boundary.py
          tests/test_llm_client.py
          tests/test_runtime_registry_claude_shim.py
          tests/test_runtime_registry_singleflight.py
          tests/runtimes/test_provider_executable_pre_admission.py
          tests/runtimes/test_provider_executable_object_registry.py
          tests/runtimes/test_provider_runtime_executable_binding.py
          tests/runtimes/test_provider_invocation_payload.py
          tests/runtimes/test_provider_invocation_payload_review.py
          tests/runtimes/test_provider_invocation_abi.py
          tests/runtimes/test_provider_invocation_abi_review.py
          tests/runtimes/test_provider_runtime_invocation_binding.py
          tests/runtimes/test_provider_runtime_invocation_binding_review.py
          tests/runtimes/test_sealed_runtime_provider.py
      - run: python -m json.tool docs/research/hermes-agent-v2026.8.19-provenance.json
      - run: python -m json.tool docs/research/hermes-agent-v2026.8.27-delta-provenance.json
      - run: >-
          python -m pytest -q -p no:cacheprovider
          tests/providers/test_claude_bypass_inventory.py
          tests/providers/test_claude_sealed_cutover.py
          tests/test_claude_bridge_cmd_shim.py
          tests/test_gui_check_budget.py
          tests/test_ikarus_bridge_progress.py
          tests/test_ikarus_effect_bridge.py
          tests/test_ikarus_oneshot.py
          tests/test_ikarus_tool_scope.py
          tests/test_ikarus_runtime_role.py
          tests/test_ikarus_stream.py
          tests/test_ikarus_os_boundary.py
          tests/test_llm_client.py
          tests/test_runtime_registry_claude_shim.py
          tests/test_runtime_registry_singleflight.py
          tests/kernel/test_runtime_conformance_harness.py
          tests/runtimes/test_runtime_conformance_profiles.py
          tests/runtimes/test_provider_executable_pre_admission.py
          tests/runtimes/test_provider_executable_pre_admission_review.py
          tests/runtimes/test_provider_executable_object_registry.py
          tests/runtimes/test_provider_executable_object_registry_review.py
          tests/runtimes/test_provider_runtime_executable_binding.py
          tests/runtimes/test_provider_runtime_executable_binding_review.py
          tests/runtimes/test_provider_invocation_payload.py
          tests/runtimes/test_provider_invocation_payload_review.py
          tests/runtimes/test_provider_invocation_abi.py
          tests/runtimes/test_provider_invocation_abi_review.py
          tests/runtimes/test_provider_runtime_invocation_binding.py
          tests/runtimes/test_provider_runtime_invocation_binding_review.py
          tests/runtimes/test_sealed_runtime_provider.py
          tests/runtimes/test_provider_invocation_authority.py
          tests/runtimes/test_runtime_provider_exact_authority_boundary.py
          tests/runtimes/test_provider_observation_authority_review.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
      DAEDALUS_GUI_SUITE_TIMEOUT_S: "1200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npx --prefix apps/web playwright install --with-deps chromium --only-shell
      - run: python tools/gui_check.py
