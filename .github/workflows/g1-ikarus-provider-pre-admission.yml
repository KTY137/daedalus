name: Gate 1 Ikarus Provider Pre-Admission

on:
  push:
    branches:
      - g1/ikarus-provider-pre-admission-07a
  pull_request:
    branches:
      - main
    paths:
      - "daedalus/runtimes/provider/executable_pre_admission.py"
      - "tests/runtimes/test_provider_executable_pre_admission.py"
      - "tests/runtimes/test_provider_executable_pre_admission_review.py"
      - "docs/work-packets/G1-IKARUS-07A_PROVIDER_EXECUTABLE_PRE_ADMISSION.md"
      - ".github/workflows/g1-ikarus-provider-pre-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-ikarus-provider-pre-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: >-
          python -m py_compile
          daedalus/runtimes/provider/executable_pre_admission.py
          tests/runtimes/test_provider_executable_pre_admission.py
          tests/runtimes/test_provider_executable_pre_admission_review.py
      - run: python -m json.tool docs/research/hermes-agent-v2026.8.19-provenance.json
      - run: >-
          python -m pytest -q -p no:cacheprovider
          tests/runtimes/test_provider_executable_pre_admission.py
          tests/runtimes/test_provider_executable_pre_admission_review.py
          tests/runtimes/test_provider_invocation_resolution.py
          tests/runtimes/test_provider_executable_structure.py
          tests/runtimes/test_provider_target_receipt_retention_completed_evidence.py
          tests/runtimes/test_provider_target_receipt_retention_effect_terminal_evidence.py
          tests/gates/test_repository_head_revision.py
