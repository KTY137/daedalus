name: Ikarus Provider Pre-Admission

on:
  pull_request:
    paths:
      - "daedalus/runtimes/provider_executable_pre_admission.py"
      - "tests/runtimes/test_provider_executable_pre_admission.py"
      - "tests/runtimes/test_provider_executable_pre_admission_review.py"
      - "docs/work-packets/G1-IKARUS-07A_PROVIDER_EXECUTABLE_PRE_ADMISSION.md"
      - ".github/workflows/g1-ikarus-provider-pre-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-boundary:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" pytest
      - name: Compile touched boundary
        run: >-
          python -m py_compile
          daedalus/runtimes/provider_executable_pre_admission.py
          tests/runtimes/test_provider_executable_pre_admission.py
          tests/runtimes/test_provider_executable_pre_admission_review.py
      - name: Validate pinned Hermes provenance
        run: >-
          python -c "import json,pathlib; p=pathlib.Path('docs/research/hermes-agent-v2026.8.19-provenance.json'); json.loads(p.read_text(encoding='utf-8')); print(p)"
      - name: Run exact pre-admission and prerequisite regressions
        run: >-
          python -m pytest -q
          tests/runtimes/test_provider_executable_pre_admission.py
          tests/runtimes/test_provider_executable_pre_admission_review.py
          tests/runtimes/test_provider_invocation_resolution.py
          tests/runtimes/test_provider_executable_structure.py
          tests/runtimes/test_provider_target_receipt_retention_completed_evidence.py
          tests/runtimes/test_provider_target_receipt_retention_effect_terminal_evidence.py
          tests/gates/test_repository_head_revision.py
