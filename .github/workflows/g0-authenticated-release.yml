name: Gate 0 — authenticated exact-head release

on:
  pull_request:
    branches:
      - g0/evidence-trust-bundle-linear
    paths:
      - "daedalus/gates/**"
      - "configs/schemas/gate0-release-report-v1.schema.json"
      - "tests/gates/**"
      - "scripts/run_gate0_release_mutations.py"
      - "docs/work-packets/G0-RPT-08C_AUTHENTICATED_RELEASE_ASSEMBLY.md"
      - ".github/workflows/g0-authenticated-release.yml"
  push:
    branches:
      - g0/exact-head-release-assembly-bundled
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-authenticated-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: release / ${{ matrix.os }} / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m json.tool configs/schemas/gate-evidence-trust-bundle-v1.schema.json
      - run: python -m json.tool configs/schemas/gate0-release-report-v1.schema.json
      - run: python -m compileall -q daedalus tests scripts/run_gate0_release_mutations.py
      - name: Authenticated, stale, malformed, bypass and release tests
        run: >-
          python -m pytest -q
          tests/gates/test_exact_head_evidence.py
          tests/gates/test_exact_head_evidence_strict.py
          tests/gates/test_exact_head_evidence_io.py
          tests/gates/test_evidence_trust_bundle.py
          tests/gates/test_evidence_trust_bundle_review.py
          tests/gates/test_gate0_release_assembly.py
          tests/gates/test_gate0_release_verifier.py
          tests/gates/test_gate_report.py

  release-mutations:
    name: authenticated release mutation campaign / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python scripts/run_gate0_release_mutations.py
      - name: Refuse dirty source after mutation restoration
        shell: bash
        run: git diff --exit-code -- daedalus/gates/release.py daedalus/gates/release_verifier.py

  full-suite:
    name: repository full suite / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/iron_plan_guard.py verify
      - run: python -m pytest -q

  isolated-wheel:
    name: isolated wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-release-wheel
      - run: /tmp/daedalus-release-wheel/bin/pip install dist/*.whl
      - name: Import installed release contracts outside checkout
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-release-wheel/bin/python -c
          "from daedalus.gates import EvidenceTrustBundle,
          Gate0ReleaseReport, assemble_gate0_release_report,
          assert_gate0_release_report,
          gate0_release_verification_blockers;
          assert EvidenceTrustBundle.CONTRACT_TYPE ==
          'daedalus-gate-evidence-trust-bundle/1';
          assert Gate0ReleaseReport.CONTRACT_TYPE ==
          'daedalus-gate0-release-report/1';
          assert assemble_gate0_release_report;
          assert assert_gate0_release_report;
          assert gate0_release_verification_blockers"
