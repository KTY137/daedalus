name: Gate 0 — runtime lease admission

on:
  pull_request:
    branches:
      - g0/runtime-trust-ledger
    paths:
      - "daedalus/kernel/runtime_effects.py"
      - "daedalus/kernel/effects.py"
      - "daedalus/kernel/contracts.py"
      - "daedalus/runtimes/**"
      - "daedalus/spine/effect_boundary.py"
      - "configs/schemas/runtime-bound-effect-lease-v1.schema.json"
      - "tests/kernel/test_runtime_effect_admission.py"
      - "tests/kernel/test_effect_leases.py"
      - "tests/runtimes/test_runtime_trust_store.py"
      - ".github/workflows/g0-runtime-lease-admission.yml"
  push:
    branches:
      - g0/runtime-lease-admission
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-runtime-lease-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts / py${{ matrix.python }} / seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        seed: ["0", "123456"]
    env:
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q daedalus tests
      - run: python -m json.tool configs/schemas/runtime-bound-effect-lease-v1.schema.json > /dev/null
      - name: Runtime trust and Effect Lease composition tests
        run: >-
          python -m pytest -q
          tests/kernel/test_runtime_effect_admission.py
          tests/kernel/test_effect_leases.py
          tests/runtimes/test_runtime_trust_store.py
          tests/runtimes/test_runtime_live_trust_anchor.py
          tests/test_effect_boundary.py

  isolated-wheel:
    name: isolated wheel and import-order smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/daedalus-runtime-lease-wheel
      - run: /tmp/daedalus-runtime-lease-wheel/bin/pip install dist/*.whl
      - name: Import runtimes before runtime lease authority
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-runtime-lease-wheel/bin/python -c
          "import daedalus.runtimes;
          from daedalus.kernel.runtime_effects import
          RuntimeBoundEffectAuthorization, RuntimeBoundEffectLease;
          assert RuntimeBoundEffectAuthorization and RuntimeBoundEffectLease"
      - name: Import runtime lease authority before runtimes
        run: >-
          cd /tmp && PYTHONPATH=
          /tmp/daedalus-runtime-lease-wheel/bin/python -c
          "from daedalus.kernel.runtime_effects import RuntimeBoundEffectLease;
          import daedalus.runtimes;
          assert RuntimeBoundEffectLease"
