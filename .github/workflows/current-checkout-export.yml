name: Current checkout export

on:
  pull_request:
    branches:
      - g0/effect-leases
  push:
    branches:
      - ops/current-checkout-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > CHECKOUT_HEAD
          tar --exclude=.git --exclude=checkout.tar.gz -czf checkout.tar.gz .
          test -s checkout.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-checkout-${{ github.sha }}
          path: checkout.tar.gz
          if-no-files-found: error
          retention-days: 2
